function markProductUsed(id){
  saveProductList(loadProducts().map(p=>p.id===id?{...p,useCount:(p.useCount||0)+1,lastUsed:Date.now()}:p));
}
function toggleProductFavorite(id){
  saveProductList(loadProducts().map(p=>p.id===id?{...p,favorite:!p.favorite}:p));
}

/* Fortschrittsring (SVG). progress 0..1, animiert per CSS-Transition. */
function Ring({size=190,stroke=16,progress=0,color,children}){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  return(
    <div style={{position:"relative",width:size,height:size}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--card2)" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
          strokeLinecap="round" strokeDasharray={c}
          strokeDashoffset={c*(1-Math.min(Math.max(progress,0),1))}
          style={{transition:"stroke-dashoffset .8s cubic-bezier(.32,.72,.28,1),stroke .3s"}}/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>{children}</div>
    </div>
  );
}

/* Tacho-Anzeige: 270°-Bogen mit Luecke unten (wie ein Halbkreis-Tacho).
   Gleiche stroke-dasharray-Technik wie beim Ring, nur auf einen Bogen
   begrenzt statt den vollen Kreis, plus ein kleiner Punkt am Start. */
/* Vollstaendiger 360°-Fortschrittsring (Apple-Fitness-/WHOOP-Stil) —
   kein offener Bogen, kein Marker-Punkt, nur die reine, ruhige Kreisform. */
/* Vollstaendiger 360°-Ring. Animiert beim ersten Erscheinen sanft von 0 auf
   den tatsaechlichen Fortschritt (ca. 700ms) — dafuer startet "mounted"
   bewusst false und wird kurz danach true, die CSS-Transition uebernimmt
   den Rest. Spaetere Aenderungen von "progress" (z.B. nach dem Essen)
   animieren ueber dieselbe Transition automatisch mit. Optional anklickbar
   fuer eine Detailansicht. */
function Gauge({size=246,stroke=18,progress=0,color,children,onClick}){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  const [mounted,setMounted]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setMounted(true),60);return()=>clearTimeout(t);},[]);
  const p=mounted?Math.min(Math.max(progress,0),1):0;
  return(
    <div className={onClick?"dc":undefined} onClick={onClick}
      style={{position:"relative",width:size,height:size,cursor:onClick?"pointer":undefined}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--card2)" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
          strokeDasharray={c} strokeDashoffset={c*(1-p)} strokeLinecap="round"
          style={{transition:"stroke-dashoffset .7s cubic-bezier(.32,.72,.28,1),stroke .4s"}}/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>{children}</div>
    </div>
  );
}

/* Fortschrittsbalken fuer Makros (Kohlenhydrate/Eiweiss/Fett) — etwas
   dicker und heller als frueher, fuer bessere Lesbarkeit ohne unruhig
   zu wirken. */
function MacroBar({label,value,target,color}){
  const pct=target>0?Math.min(100,Math.max(0,(value/target)*100)):0;
  return(
    <div style={{flex:1}}>
      <div className="sub" style={{textAlign:"center",marginBottom:10,fontSize:12}}>{label}</div>
      <div style={{background:"var(--card2)",height:8,borderRadius:99,overflow:"hidden",marginBottom:8,position:"relative"}}>
        <div style={{height:"100%",width:pct+"%",background:color,borderRadius:99,opacity:.85,transition:"width .6s cubic-bezier(.32,.72,.28,1)"}}/>
      </div>
      <div className="sub" style={{textAlign:"center",fontSize:11}}>{Math.round(value)} / {Math.round(target)} g</div>
    </div>
  );
}

/* Mini-Sparkline fuer den Gewichtstrend auf "Heute" */
function Spark({points,w=140,h=44,color="var(--accent)"}){
  if(!points||points.length<2)return null;
  const min=Math.min(...points),max=Math.max(...points),span=Math.max(max-min,0.1);
  /* Asymmetrisches Innenpadding: rechts etwas grosszuegiger als links, damit
     der Endpunkt (Kreis + abgerundete Linienkappe) niemals am Kartenrand
     klebt oder angeschnitten wirkt. */
  const padL=6,padR=10;
  const px=i=>padL+(i/(points.length-1))*(w-padL-padR);
  const py=v=>h-6-((v-min)/span)*(h-12);
  const path=points.map((v,i)=>(i===0?"M":"L")+px(i).toFixed(1)+","+py(v).toFixed(1)).join(" ");
  return(
    <svg width={w} height={h} style={{overflow:"visible"}}>
      <path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={px(points.length-1)} cy={py(points[points.length-1])} r="3.5" fill={color}/>
    </svg>
  );
}

/* Bottom-Sheet: gleitet von unten hoch, Tipp auf den Hintergrund schliesst */
/* Bottom-Sheet mit echter Wisch-Geste: der ganze Kopfbereich (Griff-Balken +
   Titel) reagiert auf Ziehen nach unten, schliesst ab einer Distanz, sonst
   federt es zurueck. Nur der Kopf reagiert, damit Scrollen im Inhalt darunter
   (z.B. lange Formulare) nicht versehentlich das Sheet mitzieht. */
function Sheet({onClose,title,children}){
  const [dragY,setDragY]=useState(0);
  const [dragging,setDragging]=useState(false);
  const startY=useRef(0);
  const onTouchStart=e=>{startY.current=e.touches[0].clientY;setDragging(true);};
  const onTouchMove=e=>{
    const delta=e.touches[0].clientY-startY.current;
    if(delta>0)setDragY(delta); // nur nach unten ziehen erlauben
  };
  const onTouchEnd=()=>{
    setDragging(false);
    if(dragY>110)onClose();   // weit genug gezogen -> schliessen
    else setDragY(0);         // sonst zurueckfedern
  };
  return(
    <div>
      <div className="ov" onClick={onClose}/>
      <div className="sheet" style={{transform:"translateY("+dragY+"px)",transition:dragging?"none":"transform .35s cubic-bezier(.32,.72,.28,1)"}}>
        <div className="grab" style={{padding:"12px 0 18px",margin:"-12px 0 -2px",touchAction:"none"}}
          onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>
          <div style={{width:38,height:5,borderRadius:3,background:"var(--ink3)",opacity:.4,margin:"0 auto 14px"}}/>
          {title&&<div style={{fontSize:20,fontWeight:700}}>{title}</div>}
        </div>
        {children}
      </div>
    </div>
  );
}

   Wisch-Griff. Fuer Ablaeufe, die sich wie ein eigener Screen anfuehlen

/* Zahlenfeld: erlaubt Komma und Punkt, markiert ungueltige Eingaben direkt. */
function NumField({value,onChange,placeholder,suffix,autoFocus,onEnterOrBlur}){
  const invalid=value!==""&&parseNum(value)==null;
  const ref=useRef(null);
  useEffect(()=>{
    if(!autoFocus)return;
    /* Fokus bewusst NACH Ende der Sheet-Slide-Animation (siehe Sheet-
       Komponente: transition .35s) setzen statt sofort beim Mounten —
       Fokussieren waehrend eine CSS-Transform-Transition noch laeuft ist
       ein bekannter iOS-Safari-Stolperstein: die Tastatur erscheint zwar,
       nimmt aber Eingaben nicht zuverlaessig an. */
    const t=setTimeout(()=>{if(ref.current)ref.current.focus();},380);
    return ()=>clearTimeout(t);
  },[]);
  return(
    <div style={{position:"relative"}}>
      <input ref={ref} type="text" inputMode="decimal" placeholder={placeholder||"0"} value={value}
        onChange={e=>onChange(e.target.value)}
        onKeyDown={e=>{if(e.key==="Enter"){e.target.blur();if(onEnterOrBlur)onEnterOrBlur();}}}
        onBlur={()=>{if(onEnterOrBlur)onEnterOrBlur();}}
        style={{borderColor:invalid?"#C0453E":undefined,paddingRight:suffix?54:14}}/>
      {suffix&&<span style={{position:"absolute",right:14,top:"50%",transform:"translateY(-50%)",fontSize:13,color:"var(--ink3)",pointerEvents:"none"}}>{suffix}</span>}
    </div>
  );
}

/* Wiederverwendbare Drag&Drop-Liste (Touch-basiert, ohne externe Bibliothek).
   Ziehen startet nur am uebergebenen Griff (dragHandlers), damit der Rest der
   Zeile (z.B. ein Ein/Aus-Schalter) normal antippbar bleibt. Andere Zeilen
   ruecken waehrend des Ziehens sichtbar zur Seite, wie bei der nativen
   iOS-Listen-Umsortierung. */
/* Wiederverwendbare Drag&Drop-Liste (Touch-basiert, ohne externe Bibliothek).
   Nutzt Refs statt State fuer die laufende Ziehposition — genau wie die
   bereits bewaehrte Wisch-Geste beim Sheet — damit keine veralteten
   Funktions-Abschluesse (stale closures) waehrend des Ziehens entstehen.
   Ziehen startet nur am uebergebenen Griff (dragHandlers), damit der Rest
   der Zeile (z.B. ein Ein/Aus-Schalter) normal antippbar bleibt. Andere
   Zeilen ruecken waehrend des Ziehens sichtbar zur Seite. */
function DragList({items,itemKey,rowHeight=64,onReorder,renderRow}){
  const [dragIdx,setDragIdx]=useState(null);
  const [offset,setOffset]=useState(0);
  const startY=useRef(0);
  const curIdx=useRef(null);
  const curOffset=useRef(0);

  const onStart=(i,clientY)=>{
    startY.current=clientY;
    curIdx.current=i;
    curOffset.current=0;
    setDragIdx(i);
    setOffset(0);
  };
  const onMove=clientY=>{
    if(curIdx.current==null)return;
    const d=clientY-startY.current;
    curOffset.current=d;
    setOffset(d);
  };
  const onEnd=()=>{
    if(curIdx.current!=null){
      const moveSlots=Math.round(curOffset.current/rowHeight);
      const targetIdx=Math.max(0,Math.min(items.length-1,curIdx.current+moveSlots));
      if(targetIdx!==curIdx.current){
        const next=[...items];
        const [moved]=next.splice(curIdx.current,1);
        next.splice(targetIdx,0,moved);
        onReorder(next);
      }
    }
    curIdx.current=null;
    setDragIdx(null);
    setOffset(0);
  };

  return(
    <div style={{position:"relative"}}>
      {items.map((it,i)=>{
        const isDragging=dragIdx===i;
        let ty=0;
        if(dragIdx!=null){
          if(isDragging)ty=offset;
          else{
            const moveSlots=Math.round(offset/rowHeight);
            const targetIdx=Math.max(0,Math.min(items.length-1,dragIdx+moveSlots));
            if(dragIdx<targetIdx&&i>dragIdx&&i<=targetIdx)ty=-rowHeight;
            else if(dragIdx>targetIdx&&i>=targetIdx&&i<dragIdx)ty=rowHeight;
          }
        }
        /* WICHTIG: touchAction:"none" muss auf dem tatsaechlichen Griff-
           Element landen. Wird dieses Objekt an renderRow uebergeben und
           dort per {...dragHandlers} eingesetzt, darf DANACH kein eigenes
           style-Attribut mehr auf demselben Element folgen — das wuerde
           dieses style hier sonst komplett ueberschreiben statt zu mergen. */
        const dragHandlers={
          onTouchStart:e=>{e.stopPropagation();onStart(i,e.touches[0].clientY);},
          onTouchMove:e=>{e.preventDefault();e.stopPropagation();onMove(e.touches[0].clientY);},
          onTouchEnd:e=>{e.stopPropagation();onEnd();},
          style:{touchAction:"none",cursor:"grab"},
        };
        return(
          <div key={itemKey(it)} style={{position:"relative",zIndex:isDragging?10:1,
            transform:"translateY("+ty+"px)",
            transition:isDragging?"none":"transform .25s cubic-bezier(.32,.72,.28,1)",
            boxShadow:isDragging?"0 10px 26px rgba(0,0,0,.28)":"none"}}>
            {renderRow(it,i,dragHandlers)}
          </div>
        );
      })}
    </div>
  );
}

/* ===== DASHBOARD-WIDGETS =====
   Jedes Widget ist eine eigene, in sich geschlossene Komponente — sie holt
   sich ihre Daten selbst aus "data" und weiss nichts vom Dashboard-Container
   drumherum. So laesst sich spaeter ein neues Widget einfach ergaenzen,
   ohne bestehende Komponenten anzufassen.

   Alle Widgets teilen sich dieselbe Huelle (DashCard weiter unten), damit
   ueberall dieselbe Struktur gilt: Titel -> Hauptwert -> Erklaerung/
   Fortschritt -> naechster Schritt -> Info-Button. */

/* Zaehlt eine Zahl beim ersten Erscheinen/Aendern weich hoch, statt
   abrupt zu springen — kleines, aber spuerbares Premium-Detail. */
function AnimatedNumber({value,decimals=0,suffix=""}){
  const [display,setDisplay]=useState(value);
  const fromRef=useRef(value);
  useEffect(()=>{
    const from=fromRef.current,to=value,start=performance.now(),dur=550;
    if(from===to)return;
    let raf;
    const step=now=>{
      const t=Math.min(1,(now-start)/dur);
      const eased=1-Math.pow(1-t,3); // ease-out
      setDisplay(from+(to-from)*eased);
      if(t<1)raf=requestAnimationFrame(step);
      else fromRef.current=to;
    };
    raf=requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  },[value]);
  return <React.Fragment>{fmtNum(display,decimals)}{suffix}</React.Fragment>;
}

/* Dezenter Info-Punkt oben rechts in jeder Widget-Karte. stopPropagation,

/* Erklaer-Sheet: was zeigt dieses Widget, wie wird's berechnet, warum

/* Farblogik einheitlich fuer alle Widgets: Gruen = erreicht/positiv,
   Orange = Achtung/fast erreicht, Rot ist bewusst reserviert fuer wirklich
   wichtige Warnungen (hier: deutlich ueber Budget) — kein Ampel-Overkill. */
const SEM={good:"var(--good)",warn:"var(--amber)",bad:"#C0453E",neutral:"var(--ink)"};
/* goalStatusDisplay: siehe goal-engine.js (Phase 2E des Migrationsplans). */

/* ===== DashCard: einheitliche Huelle fuer alle Dashboard-Widgets =====
   Titel (+ optionalem Icon) mit Info-Punkt oben rechts, grosser animierter
   Hauptwert, kleine Erklaerung/Fortschrittsbalken, motivierender naechster
   Schritt. "size" steuert Gross/Klein aus der Personalisierung: bei "small"
   fallen Fortschrittsbalken und Zusatztext weg, nur das Wichtigste bleibt. */
function DashCard({title,icon,value,valueDecimals=0,valueSuffix="",valueColor,
  progress,progressColor,sub,cta,ctaColor,infoTitle,infoText,size="large",onNavigate}){
  const [showInfo,setShowInfo]=useState(false);
  return(
    <div className="card card-compact dc" onClick={()=>{tapH();onNavigate();}}>
      <div className="row" style={{marginBottom:size==="small"?"var(--sp-1)":"var(--sp-2)",alignItems:"flex-start"}}>
        <div className="lbl" style={{display:"flex",alignItems:"center",gap:"var(--sp-1)"}}>{icon&&<span>{icon}</span>}{title}</div>
        {infoText&&<InfoDot onOpen={()=>setShowInfo(true)}/>}
      </div>
      <div className="num" style={{fontSize:size==="small"?24:32,fontWeight:700,color:valueColor||"var(--ink)",letterSpacing:-.5}}>
        <AnimatedNumber value={value} decimals={valueDecimals} suffix={valueSuffix}/>
      </div>
      {size==="large"&&progress!=null&&(
        <div style={{background:"var(--card2)",height:7,borderRadius:99,overflow:"hidden",marginTop:"var(--sp-1)"}}>
          <div style={{height:"100%",width:Math.min(100,Math.max(0,progress*100))+"%",background:progressColor||"var(--accent)",borderRadius:99,transition:"width .6s cubic-bezier(.32,.72,.28,1)"}}/>
        </div>
      )}
      {size==="large"&&sub&&<div className="sub" style={{marginTop:"var(--sp-1)"}}>{sub}</div>}
      {cta&&<div style={{marginTop:size==="small"?"var(--sp-1)":"var(--sp-1)",fontSize:13,fontWeight:600,color:ctaColor||"var(--accent)",display:"flex",alignItems:"center",gap:4}}>{cta} <span style={{fontSize:15}}>→</span></div>}
      {showInfo&&<WidgetInfoSheet title={infoTitle||title} text={infoText} onClose={()=>setShowInfo(false)}/>}
    </div>
  );
}

/* Einheitlicher Leerzustand fuer alle Widgets ohne Daten — nie "Keine

function WeightWidget({data,goals,onNavigate,onEdit,size="large"}){
  /* Feste Zeitachse: IMMER die letzten 30 Kalendertage — nie mehr, nie
     weniger Punkte je nach Wiegefrequenz, aber der Zeitraum selbst bleibt
     konstant. Taeglich gewogen ergibt viele Punkte, woechentlich wenige,
     unregelmaessig entsprechend wenige — die Achse verschiebt sich nicht. */
  const wpts=useMemo(()=>{
    const arr=[];
    const it=new Date(NOW);
    for(let i=0;i<30;i++){
      const x=dayData(data,it.getFullYear(),it.getMonth(),it.getDate());
      if(x.weight>0)arr.unshift(x.weight);
      it.setDate(it.getDate()-1);
    }
    return arr;
  },[data]);
  /* Die grosse Zahl zeigt IMMER das zuletzt eingetragene Gewicht ueberhaupt
     — unabhaengig vom 30-Tage-Fenster fuer den Trend/das Diagramm. Wer z.B.
     seit 40 Tagen nicht gewogen hat, sieht trotzdem seinen letzten Wert. */
  const curW=lastWeight(data);
  const deltaW=wpts.length>1?curW-wpts[0]:0;
  const enoughData=wpts.length>=2;
  const [showInfo,setShowInfo]=useState(false);
  const infoText="Hier siehst du dein aktuelles Körpergewicht sowie die Entwicklung der letzten 30 Kalendertage.\n\nDer Trend vergleicht dein heutiges Gewicht mit dem ältesten Wert innerhalb dieses Zeitraums — bei täglichem Wiegen ergeben sich viele Punkte im Diagramm, bei selteneren Messungen entsprechend wenige. Der Zeitraum selbst bleibt aber immer 30 Tage.\n\nDie Farbe zeigt, ob du dich gerade in Richtung deines persönlichen Ziels bewegst — nicht pauschal 'runter = gut'. Bei einem Zunahme-Ziel ist mehr Gewicht z.B. genauso ein grüner Fortschritt.\n\nSchwankungen bis ±1,0 kg gelten als normal (Wasser, Salz, Verdauung) und werden neutral angezeigt — erst eine deutlichere Entwicklung färbt die Karte ein.";

  if(curW===0){
    return <EmptyWidgetCard title="⚖️ Dein Gewicht" onNavigate={onEdit}
      message="Trage dein erstes Gewicht ein, um deine Entwicklung zu sehen."
      ctaLabel="Gewicht eintragen" infoText={infoText}/>;
  }

  /* Farblogik anhand der persoenlichen Zielrichtung statt pauschal
     "runter=gut": bewegt sich das Gewicht auf ein aktives Zunehmen-Ziel
     zu, ist eine Gewichtszunahme genauso ein gruener Fortschritt wie eine
     Abnahme beim Abnehmen-Ziel. Toleranzbereich von ±1,0kg, damit normale
     Wasser-/Salz-/Verdauungsschwankungen die Karte nicht staendig zwischen
     Gruen und Orange hin- und herspringen lassen — erst eine wirklich
     erkennbare 30-Tage-Entwicklung darf die Farbe wechseln. Rot ist
     bewusst reserviert fuer echte Warnungen, nie fuer normale
     Gewichtsschwankungen. */
  const direction=inferWeightGoalDirection(goals,curW);
  const TOL=0.99; // bewusst knapp unter 1,0: ein angezeigtes "1,0 kg" soll
                   // immer eindeutig farbig sein, nie noch grau wirken
  const NEUTRAL="var(--ink2)";
  let trendColor;
  if(direction==="abnehmen"){
    trendColor=deltaW<=-TOL?SEM.good:deltaW>=TOL?SEM.warn:NEUTRAL;
  }else if(direction==="zunehmen"){
    trendColor=deltaW>=TOL?SEM.good:deltaW<=-TOL?SEM.warn:NEUTRAL;
  }else{ // Halten (auch Standard ohne erkennbares Ziel): innerhalb der
         // Toleranz ist das Ziel ja gerade erfuellt -> gruen statt neutral
    trendColor=Math.abs(deltaW)<=TOL?SEM.good:SEM.warn;
  }

  /* Reine Statuskarte statt Aktionskarte: kein CTA-Text, kein Button — die
     ganze Karte ist der Tipp-Bereich, oeffnet die Detailansicht/den
     Bearbeiten-Dialog. Struktur wie die Kalorienkarte: Titel -> Hauptwert
     -> Trend -> kleine Visualisierung. Die Zahl selbst bleibt IMMER in
     normaler Textfarbe, nur der Trend wird eingefaerbt. */
  return(
    <div className="card card-compact dc" onClick={()=>{tapH();onNavigate("verlauf","Gewicht");}}>
      <div className="row" style={{marginBottom:"var(--sp-1)",alignItems:"flex-start"}}>
        <div className="lbl">Gewicht</div>
        <InfoDot onOpen={()=>setShowInfo(true)}/>
      </div>
      <div className="row" style={{alignItems:"center"}}>
        <div>
          <div className="num" style={{fontSize:32,fontWeight:700,letterSpacing:-.5}}>
            <AnimatedNumber value={curW} decimals={1} suffix=" kg"/>
          </div>
          {enoughData?(
            <div className="sub" style={{fontWeight:600,color:trendColor,marginTop:"calc(var(--sp-2) + 9px)"}}>
              {deltaW>0?"+":""}{fmtNum(deltaW,1)} kg in den letzten 30 Tagen
            </div>
          ):(
            <div className="sub" style={{marginTop:"calc(var(--sp-2) + 9px)"}}>Noch nicht genügend Daten für einen 30-Tage-Trend.</div>
          )}
        </div>
        {/* Dieselbe trendColor fuer Trendtext, Linie UND Endpunkt — kein
            Remapping mehr, damit die Farbe garantiert konsistent ist.
            Versatz nach oben (-3px) fuer die Ausrichtung auf die Gewichts-
            zahl, nach rechts (6px) fuer mehr Luft zur Zahl links, plus 5%
            mehr Breite (140->147px) fuer einen natuerlicheren Linienverlauf. */}
        {enoughData&&<div style={{marginTop:-5,marginLeft:6}}><Spark points={wpts} w={147} color={trendColor}/></div>}
      </div>
      {showInfo&&<WidgetInfoSheet title="Dein Gewicht" text={infoText} onClose={()=>setShowInfo(false)}/>}
    </div>
  );
}

function PlanRing({progress,color,children}){
  const size=52,stroke=5,r=(size-stroke)/2,c=2*Math.PI*r;
  return(
    <div style={{position:"relative",width:size,height:size}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--card2)" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={c*(1-Math.min(Math.max(progress,0),1))}
          style={{transition:"stroke-dashoffset .6s cubic-bezier(.32,.72,.28,1)"}}/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,whiteSpace:"nowrap"}}>{children}</div>
    </div>
  );
}

function WeekGoalsWidget({data,mSet,goals,onNavigate,size="large"}){
  const weekGoals=goals.filter(g=>g.period==="week"&&g.active!==false);
  const [showInfo,setShowInfo]=useState(false);
  const infoText="Hier siehst du deinen Fortschritt bei deinen persönlichen Wochenzielen — zum Beispiel Spaziergänge, Krafttraining oder Fahrradtouren.\n\nDie Woche läuft immer von Montag bis Sonntag. Neue Ziele legst du im Ziele-Tab an.";
  if(weekGoals.length===0){
    return <EmptyWidgetCard title="🎯 Deine Wochenziele" onNavigate={()=>onNavigate("ziele")}
      message="Erstelle dein erstes Wochenziel, um deinen Fortschritt zu sehen."
      ctaLabel="Wochenziel erstellen" infoText={infoText}/>;
  }
  const doneCount=weekGoals.filter(g=>computeGoalProgress(g,data,mSet).done).length;
  const nearest=weekGoals.map(g=>({g,r:computeGoalProgress(g,data,mSet)})).filter(x=>!x.r.done).sort((a,b)=>b.r.prog-a.r.prog)[0];
  return(
    <div className="card card-compact dc" onClick={()=>{tapH();onNavigate("ziele");}}>
      <div className="row" style={{marginBottom:size==="small"?"var(--sp-1)":"var(--sp-2)",alignItems:"flex-start"}}>
        <div className="lbl">🎯 Deine Wochenziele</div>
        <InfoDot onOpen={()=>setShowInfo(true)}/>
      </div>
      <div className="num" style={{fontSize:size==="small"?24:32,fontWeight:700}}>
        <AnimatedNumber value={doneCount}/>/{weekGoals.length}
      </div>
      {size==="large"&&(
        <div style={{marginTop:"var(--sp-2)"}}>
          {weekGoals.map(g=>{
            const gt=GOAL_TYPES.find(t=>t.key===g.type)||GOAL_TYPES[0];
            const r=computeGoalProgress(g,data,mSet);
            return(
              <div key={g.id} className="row" style={{padding:"var(--sp-1) 0",borderBottom:"1px solid var(--line)"}}>
                <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0}}>
                  <span style={{fontSize:17,flexShrink:0}}>{gt.icon}</span>
                  <div style={{fontSize:13,fontWeight:600}}>{g.label||gt.label}</div>
                </div>
                <PlanRing progress={r.target?r.cur/r.target:0} color={r.done?SEM.good:(SPORT_COLORS[gt.sportType]||"var(--accent)")}>
                  {Math.round((r.target?r.cur/r.target:0)*100)}%
                </PlanRing>
              </div>
            );
          })}
        </div>
      )}
      <div style={{marginTop:"var(--sp-1)",fontSize:13,fontWeight:600,color:SEM.good,display:"flex",alignItems:"center",gap:4}}>
        {nearest?"Noch "+fmtNum(Math.max(nearest.r.target-nearest.r.cur,0),0)+" bis "+(nearest.g.label||GOAL_TYPES.find(t=>t.key===nearest.g.type).label):"Alle Wochenziele erreicht — stark!"} <span style={{fontSize:15}}>→</span>
      </div>
      {showInfo&&<WidgetInfoSheet title="Wochenziele" text={infoText} onClose={()=>setShowInfo(false)}/>}
    </div>
  );
}

function CaloriesWidget({data,mSet,onNavigate,size="large"}){
  const y=NOW.getFullYear(),m=NOW.getMonth(),d=NOW.getDate();
  const today=dayData(data,y,m,d);
  const tdee=tdeeOf(mSet,y,m);
  const eaten=today.kcalIn||0,burned=today.kcalBurned||0;
  const budget=tdee!=null?tdee+burned:null;
  const remaining=budget!=null?budget-eaten:null;
  const infoTitle="Kalorien heute";
  const infoText="Dein Budget setzt sich aus deinem Grundbedarf (Kalorien, die dein Körper auch in Ruhe verbraucht) plus zusätzlich verbrannten Kalorien durch Sport zusammen.\n\nBleibst du darunter, bist du im Defizit und nimmst tendenziell ab. Ein moderates Defizit ist gesünder als ein sehr großes.";
  if(budget==null){
    return <EmptyWidgetCard title="🔥 Deine Kalorien" onNavigate={()=>onNavigate("verlauf","Ernährung")}
      message="Lege deinen Grundbedarf fest, um dein Tagesbudget zu sehen."
      ctaLabel="Grundbedarf einrichten" infoTitle={infoTitle} infoText={infoText}/>;
  }
  const over=remaining<0;
  const nearLimit=!over&&remaining<budget*0.1;
  const color=over?SEM.warn:nearLimit?SEM.warn:SEM.good;
  return(
    <DashCard title="🔥 Deine Kalorien" size={size} onNavigate={()=>onNavigate("verlauf","Ernährung")}
      value={Math.abs(remaining)} valueColor={color}
      progress={budget?eaten/budget:0} progressColor={color}
      sub={eaten+" von "+budget+" kcal gegessen"}
      cta={over?"Etwas über dem Plan — morgen ist ein neuer Tag":"Noch "+remaining+" kcal verfügbar"}
      ctaColor={over?SEM.warn:SEM.good}
      infoTitle={infoTitle} infoText={infoText}/>
  );
}

function ActivityWidget({data,onNavigate,size="large"}){
  const {ps,pe}=periodRange("week");
  let days=0,mins=0,kcal=0,km=0;
  const it=new Date(ps);
  while(it<=pe&&it<=NOW){
    const x=dayData(data,it.getFullYear(),it.getMonth(),it.getDate());
    if(x.sports&&x.sports.length){
      days++;
      x.sports.forEach(s=>{
        if(s.type==="gym")mins+=(parseFloat(s.hours)||0)*60+(parseFloat(s.minutes)||0);
        else km+=s.km||0;
      });
    }
    kcal+=x.kcalBurned||0;
    it.setDate(it.getDate()+1);
  }
  const infoTitle="Aktivitäten";
  const infoText="Hier siehst du, an wie vielen Tagen dieser Woche du aktiv warst, wie lange und wie viele Kalorien du dabei verbrannt hast.\n\nRegelmäßige Bewegung erhöht deinen Tagesbedarf und macht ein Kaloriendefizit leichter erreichbar, ohne dass du beim Essen mehr einschränken musst.";
  const [showInfo,setShowInfo]=useState(false);
  if(days===0){
    return <EmptyWidgetCard title="🏃 Deine Aktivitäten" onNavigate={()=>onNavigate("verlauf","Sport")}
      message="Diese Woche noch nichts eingetragen." ctaLabel="Aktivität hinzufügen"
      infoTitle={infoTitle} infoText={infoText}/>;
  }
  return(
    <div className="card card-compact dc" onClick={()=>{tapH();onNavigate("verlauf","Sport");}}>
      <div className="row" style={{marginBottom:size==="small"?"var(--sp-1)":"var(--sp-2)",alignItems:"flex-start"}}>
        <div className="lbl">🏃 Deine Aktivitäten</div>
        <InfoDot onOpen={()=>setShowInfo(true)}/>
      </div>
      <div className="num" style={{fontSize:size==="small"?24:32,fontWeight:700,color:SEM.good}}><AnimatedNumber value={days}/>x diese Woche</div>
      {size==="large"&&(
        <div style={{display:"flex",justifyContent:"space-between",marginTop:"var(--sp-2)"}}>
          {[["Dauer",mins>0?fmtGym(mins):"–"],["Verbrannt",kcal+" kcal"],["Distanz",km>0?km.toFixed(1)+" km":"–"]].map(([l,v])=>(
            <div key={l} style={{textAlign:"center",flex:1}}>
              <div className="num" style={{fontSize:15,fontWeight:700}}>{v}</div>
              <div className="sub" style={{fontSize:10}}>{l}</div>
            </div>
          ))}
        </div>
      )}
      <div style={{marginTop:"var(--sp-1)",fontSize:13,fontWeight:600,color:SEM.good,display:"flex",alignItems:"center",gap:4}}>Weiter so — Aktivität eintragen <span style={{fontSize:15}}>→</span></div>
      {showInfo&&<WidgetInfoSheet title={infoTitle} text={infoText} onClose={()=>setShowInfo(false)}/>}
    </div>
  );
}

function StepsWidget({data,mSet,goals,onNavigate,size="large"}){
  const stepGoal=goals.find(g=>g.type==="steps"&&g.active!==false);
  const infoTitle="Schritte";
  const infoText="Schritte werden aktuell nicht automatisch erfasst — dazu bräuchte VITAL Zugriff auf die Health-/Schrittzähler-Daten deines Geräts, den es im Browser nicht gibt.\n\nDu kannst dir trotzdem ein Tagesziel setzen und den Wert manuell im Ziele-Tab eintragen, wenn dir das hilft, den Überblick zu behalten.";
  if(!stepGoal){
    return <EmptyWidgetCard title="👣 Deine Schritte" onNavigate={()=>onNavigate("ziele")}
      message="Lege dein Schritteziel fest, um deinen Fortschritt zu sehen."
      ctaLabel="Schritteziel festlegen" infoTitle={infoTitle} infoText={infoText}/>;
  }
  const r=computeGoalProgress(stepGoal,data,mSet);
  const remaining=Math.max(r.target-r.cur,0);
  return(
    <DashCard title="👣 Deine Schritte" size={size} onNavigate={()=>onNavigate("ziele")}
      value={r.cur} valueSuffix={" / "+fmtNum(r.target,0)}
      valueColor={r.done?SEM.good:undefined}
      progress={r.target?r.cur/r.target:0} progressColor={r.done?SEM.good:"var(--accent)"}
      sub="Manuell eingetragen — kein automatischer Schrittzähler verfügbar"
      cta={r.done?"Tagesziel erreicht — stark!":"Noch "+fmtNum(remaining,0)+" Schritte bis zum Ziel"}
      ctaColor={r.done?SEM.good:"var(--accent)"}
      infoTitle={infoTitle} infoText={infoText}/>
  );
}

/* Container: rendert alle aktivierten Widgets in der gespeicherten
   Reihenfolge. Neues Widget hinzufuegen = neuer Eintrag im WIDGET_MAP unten
   + Registry-Eintrag oben, hier muss sonst nichts geaendert werden.
   Das Dashboard liest nur — Erstellen/Bearbeiten/Loeschen von Zielen
   passiert ausschliesslich im Ziele-Tab (onNavigate wechselt dorthin). */
function DashboardSection({data,mSet,goals,refreshKey,onPersonalize,onNavigate,onEditWeight}){
  const [cfg,setCfg]=useState(()=>loadDashboardConfig());
  /* Laedt die Konfiguration neu, sobald sich refreshKey aendert — das
     passiert genau dann, wenn der Personalisieren-Screen mit "Fertig"
     gespeichert hat. Ohne dieses Nachladen wuerde diese Komponente auf
     ewig ihren allerersten (moeglicherweise laengst veralteten) Stand
     zeigen, weil sie waehrenddessen nie neu montiert wird. */
  useEffect(()=>{setCfg(loadDashboardConfig());},[refreshKey]);
  const renderWidget=w=>{
    const size=w.size||"large";
    switch(w.type){
      case "weight":return <WeightWidget data={data} goals={goals} onNavigate={onNavigate} onEdit={onEditWeight} size={size}/>;
      case "weekgoals":return <WeekGoalsWidget data={data} mSet={mSet} goals={goals} onNavigate={onNavigate} size={size}/>;
      case "calories":return <CaloriesWidget data={data} mSet={mSet} onNavigate={onNavigate} size={size}/>;
      case "activity":return <ActivityWidget data={data} onNavigate={onNavigate} size={size}/>;
      case "steps":return <StepsWidget data={data} mSet={mSet} goals={goals} onNavigate={onNavigate} size={size}/>;
      default:return null;
    }
  };
  return(
    <div>
      <div className="row" style={{margin:"var(--sp-3) 0 var(--sp-2)"}}>
        <div className="h1" style={{fontSize:"var(--fs-md)"}}>Mein Dashboard</div>
        <button className="pill on" style={{padding:"var(--sp-1) var(--sp-2)"}} onClick={()=>{tapH();onPersonalize();}}>Personalisieren</button>
      </div>
      {cfg.filter(w=>w.enabled).map(w=>(
        <React.Fragment key={w.type}>{renderWidget(w)}</React.Fragment>
      ))}
    </div>
  );
}

function DashboardPersonalizeSheet({onClose,onSaved}){
  const [cfg,setCfg]=useState(()=>loadDashboardConfig());
  /* Abbrechen (X oben) verwirft alle Aenderungen — speichert nichts, ruft
     nur das normale onClose auf. Erst "Fertig" schreibt in localStorage
     und informiert das Dashboard, dass es neu laden soll. */
  const handleDone=()=>{saveDashboardConfig(cfg);tapH();onSaved();};
  return(
    <Page onClose={onClose} title="Dashboard personalisieren">
      <div className="sub" style={{marginBottom:16}}>Am Griff ziehen, um die Reihenfolge zu ändern. Mit dem Schalter blendest du ein Widget aus, mit Groß/Klein die Ausführlichkeit. Änderungen gelten erst nach „Fertig".</div>
      <DragList items={cfg} itemKey={it=>it.type} rowHeight={98}
        onReorder={setCfg}
        renderRow={(it,i,dragHandlers)=>{
          const meta=DASHBOARD_WIDGETS[it.type]||{label:it.type,icon:"▫️"};
          return(
            <div className="card" style={{padding:"12px 16px",marginBottom:8}}>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
                {/* dragHandlers.style (enthaelt touchAction:"none") MUSS zuerst
                    stehen und darf nicht durch ein spaeteres style ueberschrieben
                    werden — sonst greift beim Ziehen wieder das native Scrollen
                    statt unserer Drag-Logik. Deshalb hier explizit gemergt. */}
                <div {...dragHandlers} style={{...dragHandlers.style,fontSize:19,color:"var(--ink3)",padding:"4px 8px",marginLeft:-8}}>☰</div>
                <span style={{fontSize:20}}>{meta.icon}</span>
                <div style={{flex:1,fontWeight:600,fontSize:14}}>{meta.label}</div>
                <button onClick={()=>setCfg(c=>c.map(x=>x.type===it.type?{...x,enabled:!x.enabled}:x))}
                  style={{width:46,height:27,borderRadius:99,border:"none",background:it.enabled?"var(--accent)":"var(--ink3)",position:"relative",flexShrink:0}}>
                  <span style={{position:"absolute",top:2,left:it.enabled?21:2,width:23,height:23,borderRadius:99,background:"#fff",transition:"left .2s"}}/>
                </button>
              </div>
              <div style={{display:"flex",gap:6,marginLeft:44}}>
                {[["large","Groß"],["small","Klein"]].map(([k,l])=>(
                  <button key={k} className={"pill"+((it.size||"large")===k?" on":"")} style={{padding:"6px 14px",fontSize:12}}
                    onClick={()=>setCfg(c=>c.map(x=>x.type===it.type?{...x,size:k}:x))}>{l}</button>
                ))}
              </div>
            </div>
          );
        }}/>
      <button className="btn" style={{marginTop:8}} onClick={handleDone}>Fertig</button>
    </Page>
  );
}

/* Detailansicht beim Antippen des Kalorienrings — schluesselt das Budget
   vollstaendig auf: Grundumsatz, Aktivitaetsumsatz, Sport, und leitet aus
   den aktiven Zielen ab, ob es gerade ums Abnehmen, Halten oder Zunehmen
   geht (ohne dass der Nutzer das explizit irgendwo einstellen muss). */
function CalorieBreakdownSheet({st,budget,eaten,burned,tdee,goals,data,onClose}){
  const bmr=calcBMR(st.weight,st.fat);
  const activityKcal=Math.max(tdee-bmr,0);
  const curW=lastWeight(data);
  const weightGoal=goals.find(g=>g.type==="weight"&&g.active!==false);
  let ziel="Halten";
  if(weightGoal&&curW>0){
    const target=parseFloat(weightGoal.target)||0;
    if(target<curW-0.3)ziel="Abnehmen";
    else if(target>curW+0.3)ziel="Zunehmen";
  }else{
    if(goals.some(g=>g.type==="deficit"&&g.active!==false))ziel="Abnehmen";
    else if(goals.some(g=>g.type==="surplus"&&g.active!==false))ziel="Zunehmen";
  }
  const rows=[
    ["Kalorienbudget",budget+" kcal"],
    ["Gegessen",eaten+" kcal"],
    ["Durch Sport verbrannt",burned+" kcal"],
    ["Grundumsatz",Math.round(bmr)+" kcal"],
    ["Aktivitätsumsatz",Math.round(activityKcal)+" kcal"],
    ["Ziel",ziel],
  ];
  return(
    <Sheet onClose={onClose} title="Kalorien im Detail">
      {rows.map(([l,v],i)=>(
        <div key={l} className="row" style={{padding:"13px 0",borderBottom:i<rows.length-1?"1px solid var(--line)":"none"}}>
          <span className="sub">{l}</span>
          <span className="num" style={{fontWeight:700}}>{v}</span>
        </div>
      ))}
      <div className="sub" style={{marginTop:16,fontSize:12,lineHeight:1.6}}>
        Grundumsatz + Aktivitätsumsatz ergeben deinen Tagesbedarf. Sport-Kalorien erhöhen dein Budget zusätzlich, damit du dich für zusätzliche Bewegung nicht extra einschränken musst.
      </div>
    </Sheet>
  );
}

function HeuteView({data,mSet,goals,dashRefresh,openDay,openSetup,openActivity,openMeal,openMealDetail,openPersonalize,onNavigate,onOpenWeightModal}){
  const y=NOW.getFullYear(),m=NOW.getMonth(),d=NOW.getDate();
  const today=dayData(data,y,m,d);
  const st=settingsOf(mSet,y,m);
  const tdee=st?Math.round(calcBMR(st.weight,st.fat)*ACT[st.activityIdx].f):null;
  const eaten=today.kcalIn||0, burned=today.kcalBurned||0;
  const budget=tdee!=null?tdee+burned:null;      // Sport erhoeht das Tagesbudget
  const dateStr=NOW.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  const todaySports=today.sports||[];
  const todayMeals=today.meals||{};
  /* Zeitabhaengige Begruessung */
  const hour=NOW.getHours();
  const greeting=hour<12?"Guten Morgen":hour<18?"Guten Tag":"Guten Abend";
  const [showCalInfo,setShowCalInfo]=useState(false);
  const [showCalDetail,setShowCalDetail]=useState(false);
  return(
    <div>
      <div style={{fontSize:22,fontWeight:700,marginBottom:4}}>{greeting} 👋</div>
      <div className="sub" style={{marginBottom:26,fontSize:14}}>{dateStr}</div>

      {!st&&(
        <div className="card card-hero" style={{textAlign:"center"}}>
          <div style={{fontSize:17,fontWeight:600,marginBottom:6}}>{Object.keys(mSet).length===0?"Willkommen bei VITAL":"Neuer Monat: "+MN[m]}</div>
          <div className="sub" style={{marginBottom:16}}>Trage deinen Grundbedarf für {MN[m]} ein, damit dein Tagesbudget berechnet werden kann.</div>
          <button className="btn" onClick={()=>openSetup(y,m)}>Grundbedarf einrichten</button>
        </div>
      )}

      {st&&(()=>{
        /* Makro-Ziele nach Koerpergewicht statt Faustregel-Prozenten:
           Eiweiss 2,0 g/kg Magermasse, Fett 0,9 g/kg Gesamtgewicht,
           Kohlenhydrate fuellen den Rest des Budgets. */
        const macros=macroTargets(st.weight,st.fat,budget);
        const bilanz=budget!=null?eaten-budget:0;   // negativ=Defizit, positiv=Ueberschuss, 0=ausgeglichen
        const isBalanced=bilanz===0;
        const isDeficit=bilanz<0;
        const pct=budget?eaten/budget:0;
        /* Ring-/Zahlfarbe: Defizit = Vital-Gruen, Ueberschuss = Orange, erst
           bei deutlichem Ueberschuss Rot (gleiche Schwelle wie sonst in der
           App), exakt ausgeglichen = neutrale Farbe statt Gruen oder Orange.
           Das Vorzeichen + diese Farbe allein vermitteln Defizit/Ueberschuss
           — kein ausgeschriebenes Wort mehr im Zentrum noetig. */
        const bilanzColor=isBalanced?"var(--ink)":isDeficit?"var(--good)":pct>1.15?"#C0453E":"var(--amber)";
        return(
        <div className="card card-hero">
          <div style={{display:"flex",justifyContent:"flex-end"}}>
            <InfoDot onOpen={()=>setShowCalInfo(true)}/>
          </div>
          {/* Vollstaendiger Ring: zeigt einzig die Tagesbilanz, sonst nichts
              im Zentrum. Anklickbar fuer die detaillierte Aufschluesselung. */}
          <div style={{display:"flex",justifyContent:"center"}}>
            <Gauge progress={pct} color={bilanzColor} onClick={()=>{tapH();setShowCalDetail(true);}}>
              <div className="num" style={{fontSize:"var(--fs-hero)",fontWeight:700,letterSpacing:-1.2,color:bilanzColor}}>
                {isBalanced?"0":(isDeficit?"−":"+")+Math.abs(bilanz)}
              </div>
              <div className="sub" style={{fontSize:16,fontWeight:600,marginTop:"var(--sp-1)"}}>kcal</div>
            </Gauge>
          </div>
          {/* Gegessen/Verbraucht direkt unter dem Ring — Zahl gross und oben,
              Beschriftung klein darunter. Trennung ausschliesslich ueber
              Weissraum, bewusst ohne Linien, Rahmen oder Icons. */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",marginTop:"var(--sp-4)"}}>
            <div style={{textAlign:"center"}}>
              <div className="num" style={{fontSize:"var(--fs-lg)",fontWeight:700}}>{eaten} kcal</div>
              <div className="sub" style={{fontWeight:600,color:"var(--ink2)",marginTop:"var(--sp-1)"}}>Gegessen</div>
            </div>
            <div style={{textAlign:"center"}}>
              <div className="num" style={{fontSize:"var(--fs-lg)",fontWeight:700}}>{burned} kcal</div>
              <div className="sub" style={{fontWeight:600,color:"var(--ink2)",marginTop:"var(--sp-1)"}}>Verbraucht</div>
            </div>
          </div>
          <div style={{display:"flex",gap:"var(--sp-2)",marginTop:"var(--sp-4)"}}>
            <MacroBar label="Kohlenhydrate" value={today.carbsIn||0} target={macros.carbs} color="#4E93AE"/>
            <MacroBar label="Eiweiß" value={today.proteinIn||0} target={macros.protein} color="var(--accent)"/>
            <MacroBar label="Fett" value={today.fatIn||0} target={macros.fat} color="var(--amber)"/>
          </div>
          {showCalInfo&&<WidgetInfoSheet title="Kalorien heute" onClose={()=>setShowCalInfo(false)}
            text={"Defizit bedeutet: Du hast weniger Kalorien gegessen, als du heute insgesamt verbraucht hast — das führt tendenziell zu Gewichtsabnahme.\n\nÜberschuss bedeutet: Du hast mehr gegessen, als du verbraucht hast — das führt tendenziell zu Gewichtszunahme.\n\nDie Tagesbilanz berechnet sich aus: Gegessen − Kalorienziel − Sport.\n\n'Gegessen' sind alle Kalorien aus deinen eingetragenen Mahlzeiten. 'Sport' sind die Kalorien, die du zusätzlich durch Aktivität verbrannt hast — sie werden zu deinem Grundbedarf addiert.\n\nEinzelne Tage schwanken normal. Bewerte deinen Fortschritt lieber über mehrere Tage oder Wochen als anhand eines einzelnen Tageswerts."}/>}
          {showCalDetail&&<CalorieBreakdownSheet st={st} budget={budget} eaten={eaten} burned={burned} tdee={tdee} goals={goals} data={data} onClose={()=>setShowCalDetail(false)}/>}
        </div>
        );
      })()}

      {/* Kompakte Gewichts-Karte — oeffnet ein Modal mit waehlbarem Datum,
          steht selbst nie ein Eingabefeld offen auf der Seite. */}
      <div className="card card-compact dc row" style={{marginTop:"var(--sp-3)"}}
        onClick={()=>{tapH();onOpenWeightModal();}}>
        <div>
          <div className="lbl" style={{marginBottom:"var(--sp-1)"}}>⚖️ Gewicht heute</div>
          {today.weight>0?(
            <React.Fragment>
              <div className="num" style={{fontSize:20,fontWeight:700}}>{fmtNum(today.weight)} kg</div>
              <div className="sub" style={{marginTop:"var(--sp-1)"}}>Letzte Messung: heute</div>
            </React.Fragment>
          ):(
            <div className="sub">Noch nicht eingetragen</div>
          )}
        </div>
        <div className="pill on" style={{padding:"var(--sp-1) var(--sp-2)",flexShrink:0}}>{today.weight>0?"Bearbeiten":"＋ Eintragen"}</div>
      </div>

      {st&&(
        <div>
          <div className="row" style={{margin:"var(--sp-3) 0 var(--sp-2)"}}>
            <div className="h1" style={{fontSize:"var(--fs-md)"}}>Ernährung</div>
          </div>
          <div className="card" style={{padding:0,overflow:"hidden"}}>
            {MEALS.map((meal,i)=>{
              const mealBudget=budget?Math.round(budget*meal.share):0;
              const items=todayMeals[meal.key]||[];
              const mealKcal=items.reduce((s,it)=>s+(it.kcal||0),0);
              return(
                <div key={meal.key} className="row" style={{padding:"var(--sp-2)",borderBottom:i<MEALS.length-1?"1px solid var(--line)":"none"}}
                  onClick={()=>{tapH();openMealDetail(y,m,d,meal.key);}}>
                  <div style={{display:"flex",alignItems:"center",gap:"var(--sp-2)"}}>
                    <div style={{width:44,height:44,borderRadius:99,background:"var(--card2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>{meal.icon}</div>
                    <div>
                      <div style={{fontSize:"var(--fs-desc)",fontWeight:600}}>{meal.label}</div>
                      <div className="sub">{mealKcal} / {mealBudget} kcal</div>
                    </div>
                  </div>
                  <button className="dc" style={{width:34,height:34,borderRadius:99,background:"var(--accent)",color:"#fff",border:"none",fontSize:18,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}
                    onClick={e=>{e.stopPropagation();tapH();openMeal(y,m,d,meal.key);}}>+</button>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div>
        <div className="row" style={{margin:"var(--sp-3) 0 var(--sp-2)"}}>
          <div className="h1" style={{fontSize:"var(--fs-md)"}}>Aktivitäten</div>
        </div>

          {todaySports.length===0&&<div className="sub" style={{textAlign:"center",padding:"var(--sp-2) 0"}}>Heute noch keine Aktivität — dein Ruhetag oder noch was vor?</div>}
          {todaySports.map((s,i)=>{
            const sp=SPORTS.find(x=>x.key===s.type)||{};
            const c=SPORT_COLORS[s.type];
            const km=s.type==="gym"?fmtGym((parseFloat(s.hours)||0)*60+(parseFloat(s.minutes)||0)):(s.km!=null?s.km+" km":"–");
            return(
              <div key={i} className="dc" onClick={()=>{tapH();openActivity(y,m,d,i);}}
                style={{display:"flex",alignItems:"center",gap:"var(--sp-2)",padding:"var(--sp-1)",borderBottom:i<todaySports.length-1?"1px solid var(--line)":"none"}}>
                <div style={{width:60,height:60,flexShrink:0,borderRadius:14,background:c,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:0}}>
                  <div style={{fontSize:15}}>{sp.icon}</div>
                  <div className="num" style={{fontSize:11,fontWeight:700,color:"#fff",lineHeight:1.2}}>{s.kcal||0}</div>

    </div>
  );
}

/* ===== TAB 2: VERLAUF — Kalender, Wochen, Gewicht, Sport, Jahr als Segmente ===== */
/* ===== Interaktives Gewichts-Diagramm =====
   Grosses, minimalistisches Diagramm als eigenstaendige Komponente. Beim
   Ziehen/Druecken ueber die Zeichenflaeche erscheinen eine vertikale
   Hilfslinie, ein hervorgehobener Punkt und Datum+Gewicht oberhalb —
   aehnlich wie bei Apple Health. Touch- UND Maus-Ereignisse werden
   unterstuetzt. */
/* Horizontale Zeitraum-Auswahl fuer die Gewichtsanalyse — ausschliesslich

function WeightTrendChart({w,sy,sm}){
  const svgRef=useRef(null);
  const [selIdx,setSelIdx]=useState(null);
  const [releasing,setReleasing]=useState(false);
  const lastHapticIdx=useRef(null); // verhindert Dauer-Vibrieren waehrend des Ziehens
  const W=320,H=262,PX=18,PT=14,PB=22;
  const cw=W-PX*2, ch=H-PT-PB;
  const mn=Math.min(...w.map(x=>x.w))-0.5, mx=Math.max(...w.map(x=>x.w))+0.5;
  /* Zeitstempel-basierte X-Achse statt "Tag im Monat" — funktioniert dadurch
     unveraendert auch ueber Monats-/Jahresgrenzen hinweg (Quartal, Halbjahr,
     Jahr, Gesamt), ohne die Logik zu verzweigen. */
  const tsMin=w[0].ts,tsMax=w[w.length-1].ts;
  const X=ts=>PX+((ts-tsMin)/Math.max(tsMax-tsMin,1))*cw;
  const Y=v=>PT+ch-((v-mn)/(mx-mn))*ch;
  const path=w.map((p,i)=>(i===0?"M":"L")+X(p.ts)+","+Y(p.w)).join(" ");
  const lastIdx=w.length-1;
  const rNormal=2.2,rLast=2.5; // ~14% groesser, bewusst subtil statt auffaellig

  /* Snapt IMMER auf einen tatsaechlich vorhandenen (bzw. dargestellten
     aggregierten) Messpunkt — steht nie frei zwischen zwei Punkten. */
  const nearestIdx=svgX=>{
    let best=0,bestDist=Infinity;
    w.forEach((p,i)=>{const dist=Math.abs(X(p.ts)-svgX);if(dist<bestDist){bestDist=dist;best=i;}});
    return best;
  };
  const selectIdx=idx=>{
    setSelIdx(idx);
    /* Haptik ausschliesslich beim WECHSEL auf einen neuen Punkt, nicht bei
       jedem Touch-/Mausevent waehrend des Ziehens ueber demselben Punkt. */
    if(idx!==lastHapticIdx.current){
      tapH();
      lastHapticIdx.current=idx;
    }
  };
  const handleAt=clientX=>{
    if(!svgRef.current)return;
    setReleasing(false); // falls waehrend eines noch laufenden Ausblendens erneut beruehrt wird
    const rect=svgRef.current.getBoundingClientRect();
    const relX=Math.min(1,Math.max(0,(clientX-rect.left)/rect.width));
    selectIdx(nearestIdx(relX*W));
  };
  const endSelection=()=>{
    /* Weich ausblenden statt abrupt verschwinden: die Markierung bleibt
       kurz sichtbar und faedet erst dann aus, bevor der State wirklich
       geleert wird. */
    setReleasing(true);
    setTimeout(()=>{setSelIdx(null);setReleasing(false);lastHapticIdx.current=null;},160);
  };
  const onTouchStart=e=>handleAt(e.touches[0].clientX);
  const onTouchMove=e=>{e.preventDefault();handleAt(e.touches[0].clientX);};
  const onMouseDown=e=>handleAt(e.clientX);
  const onMouseMove=e=>{if(e.buttons===1)handleAt(e.clientX);};

  const sel=selIdx!=null?w[selIdx]:null;
  const selIsToday=sel&&!sel.isAgg&&sy===sel.y&&sm===sel.m&&sel.d===NOW.getDate()&&sel.y===NOW.getFullYear()&&sel.m===NOW.getMonth();
  /* Bei aggregierten Punkten ("Ø 12.–18. Aug") ehrlich kennzeichnen statt
     so zu tun, als sei es eine einzelne Messung. */
  const selLabel=sel?(sel.isAgg?sel.label:(selIsToday?"Heute":sel.d+". "+MN[sel.m]+(sel.y!==NOW.getFullYear()?" "+sel.y:""))):"";

  return(
    <div className="card" style={{padding:"14px 6px 10px",animation:"fadeUp .18s cubic-bezier(.32,.72,.28,1)"}}>
      {/* Fest reservierte Hoehe, damit das Diagramm beim Ein-/Ausblenden
          des Tooltips nicht springt. key=selIdx laesst Datum+Gewicht bei
          jedem Punktwechsel weich ein- statt abrupt umspringen. Gewicht
          staerker betont (700), Datum dezenter (ink2, 500). */}
      <div style={{height:22,textAlign:"center",fontSize:13,opacity:releasing?0:1,transition:"opacity .16s ease-out"}}>
        {sel&&(
          <span key={selIdx} className="tooltip-fade">
            <span style={{color:"var(--ink2)",fontWeight:500}}>{selLabel}</span>
            <span style={{color:"var(--ink2)"}}>{"  ·  "}</span>
            <span style={{fontWeight:700}}>{fmtNum(sel.w,1)} kg</span>
          </span>
        )}
      </div>
      <svg ref={svgRef} viewBox={"0 0 "+W+" "+H} style={{width:"100%",display:"block",touchAction:"none"}}
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={endSelection}
        onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={endSelection} onMouseLeave={endSelection}>
        {[0,.5,1].map(t=>{
          const yy=PT+ch*(1-t);
          return <g key={t}><line x1={PX} y1={yy} x2={PX+cw} y2={yy} stroke="var(--line)"/><text x={PX} y={yy-3} fill="var(--ink3)" fontSize="9" opacity=".65">{(mn+(mx-mn)*t).toFixed(1)}</text></g>;
        })}
        <path d={path+" L"+X(tsMax)+","+(PT+ch)+" L"+X(tsMin)+","+(PT+ch)+" Z"} fill="var(--accent-soft)"/>
        {/* Linie kraeftig, keine konkurrierende Trendlinie mehr. Zeichnet
            sich beim Erscheinen (Zeitraumwechsel) sanft nach, statt abrupt
            zu springen. */}
        <path className="chart-draw" d={path} fill="none" stroke="var(--accent)" strokeWidth="3" strokeLinejoin="round" strokeLinecap="round"/>
        {w.map((p,i)=><circle key={p.ts} cx={X(p.ts)} cy={Y(p.w)} r={i===lastIdx?rLast:rNormal} fill="var(--accent)" stroke="var(--card)" strokeWidth={i===lastIdx?1.5:1}/>)}
        {/* Vertikale Hilfslinie + hervorgehobener Punkt waehrend der Auswahl.
            key=selIdx sorgt dafuer, dass der Marker bei jedem Punktwechsel
            frisch gemountet wird und die Pop-Animation erneut abspielt. */}
        {sel&&(
          <g key={selIdx} style={{opacity:releasing?0:1,transition:"opacity .16s ease-out"}}>
            <line x1={X(sel.ts)} y1={PT} x2={X(sel.ts)} y2={PT+ch} stroke="var(--ink2)" strokeWidth="1" strokeDasharray="3,3"/>
            <circle className="marker-pop" cx={X(sel.ts)} cy={Y(sel.w)} r="6" fill="var(--accent)" stroke="var(--card)" strokeWidth="2"/>
          </g>
        )}
      </svg>
    </div>
  );
}

/* Uebersetzt AUSSCHLIESSLICH die tatsaechlichen reasons/requirements aus
   calculateCurrentMonthForecast() in Text — keine erfundene Anforderung
   (fruehere Version behauptete pauschal "3-5 Gewichtseintraege", was
   fachlich falsch war: die Engine verlangt je nach Fall einen gueltigen
   Monatsbedarf, ein aktuelles Gewicht ODER mindestens sieben vollstaendige
   Ernaehrungstage — nie alles gleichzeitig, nie eine feste Gewichtsanzahl). */
function forecastEmptyStateText(forecast){
  const reason = forecast&&forecast.reasons&&forecast.reasons[0];
  switch(reason){
    case "no_monthly_tdee":
      return "Richte zuerst deinen Bedarf für diesen Monat ein.";
    case "missing_anchor_weight":
      return "Trage ein aktuelles Gewicht ein, damit die Prognose starten kann.";
    case "anchor_weight_too_old":
      return "Aktualisiere dein Gewicht, damit die Prognose neu berechnet werden kann.";
    case "not_enough_valid_log_days": {
      const req = forecast.requirements||{};
      const remaining = Math.max(0,(req.validDaysRequired||7)-(req.validDaysAvailable||0));
      return "Logge noch "+remaining+" vollständige Ernährungstage für eine zuverlässige Prognose.";
    }
    case "month_already_ended":
      return "Für diesen Monat liegt kein Prognosezeitraum mehr vor.";
    default:
      return "Deine Daten reichen aktuell noch nicht für eine zuverlässige Prognose.";
  }
}

/* ===== TEMPORAERES DIAGNOSE-SHEET fuer die Live-Prognose =====
   Nur zur Fehlersuche der kalenderuebergreifenden Datenauswahl gedacht —
   NACH ABSCHLUSS DER FEHLERSUCHE WIEDER ENTFERNEN (inkl. der antippbaren
   "Live-Prognose"-Ueberschrift in VerlaufView, showForecastDiag-State,
   debugRecentForecastDays/buildDayForecastDiagnostic/FORECAST_BUILD_ID in
   forecast-engine.js). Liest tracker_data/tracker_mset/
   tracker_forecast_calibration/tracker_weight_confirmations DIREKT per
   load() aus localStorage — unabhaengig von React-Props/State, damit
   zweifelsfrei die tatsaechlich gespeicherten Rohdaten gezeigt werden statt
   einer moeglicherweise veralteten Zwischenkopie. Zeigt NUR an, veraendert
   nichts. "forecast" wird NICHT neu berechnet, sondern 1:1 als Prop
   uebernommen — exakt dasselbe Objekt, aus dem auch die sichtbare
   Live-Prognose-Karte bzw. der Leerzustand-Text erzeugt werden. */
function ForecastDiagnosticSheet({forecast,currentDay,onClose}){
  const rawData=load("tracker_data",{});
