  const rawCalib=load("tracker_forecast_calibration",null);
  const rawConfirmations=load("tracker_weight_confirmations",[]);
  const {dailyData,monthlySettings}=buildEngineInputsFor(currentDay,rawData,rawMSet);
  const trace=debugRecentForecastDays({now:currentDay,dailyData,monthlySettings});

  const curY=currentDay.getFullYear(),curM=currentDay.getMonth();
  const prevYM=addMonthsSimple(curY,curM,-1);
  const monthInfo=(y,m)=>({
    label:MN[m]+" "+y, monthId:monthIdOf(y,m),
    presentInTrackerMSet:!!rawMSet[y+"-"+m],
    tdee:getMonthlyTdee(y,m,monthlySettings),
  });
  const curMonthInfo=monthInfo(curY,curM);
  const prevMonthInfo=monthInfo(prevYM.y,prevYM.m);

  // Fest benannter, konkret gemeldeter Zeitraum.
  const KNOWN_DATES=[{y:2026,m:6,d:29},{y:2026,m:6,d:30},{y:2026,m:6,d:31},{y:2026,m:7,d:1},{y:2026,m:7,d:2},{y:2026,m:7,d:3}];
  const knownChecks=KNOWN_DATES.map(({y,m,d})=>{
    const diag=buildDayForecastDiagnostic(y,m,d,dailyData,monthlySettings);
    const otherM=m===6?7:6;
    const altKey=dayKey(y,otherM,d);
    const altRecord=rawData[altKey];
    return {...diag,label:String(d).padStart(2,"0")+"."+String(m+1).padStart(2,"0")+"."+y,altKey,altRecordExists:!!altRecord};
  });

  const KV=({k,v})=>(
    <div style={{display:"flex",justifyContent:"space-between",gap:8,padding:"3px 0",fontSize:12}}>
      <span className="sub">{k}</span><span style={{fontWeight:600,textAlign:"right",wordBreak:"break-all"}}>{String(v)}</span>
    </div>
  );

  return(
    <Sheet onClose={onClose} title="🩺 Live-Prognose Diagnose (temporär)">
      <div className="sub" style={{marginBottom:14}}>
        Nur zur Fehlersuche. Zeigt ausschließlich bereits gespeicherte Daten — nichts wird verändert.
      </div>

      <div className="card" style={{marginBottom:12,padding:"12px 14px"}}>
        <div className="lbl" style={{marginBottom:6}}>Engine-Status (exakt dasselbe forecast-Objekt wie die Karte)</div>
        <KV k="Engine-Datum (currentDay)" v={currentDay.toString()}/>
        <KV k="forecastBuildId" v={forecast.forecastBuildId||"(fehlt — alter Build?)"}/>
        <KV k="modelVersion" v={forecast.modelVersion!=null?forecast.modelVersion:"–"}/>
        <KV k="status" v={forecast.status}/>
        <KV k="reasons" v={(forecast.reasons||[]).join(", ")||"–"}/>
        <KV k="validDaysRequired" v={forecast.requirements?forecast.requirements.validDaysRequired:"–"}/>
        <KV k="validDaysAvailable" v={forecast.requirements?forecast.requirements.validDaysAvailable:"–"}/>
        <KV k="Ankerdatum (anchorDate)" v={forecast.anchorDate||"–"}/>
        <KV k="Ankergewicht (anchorWeightKg)" v={forecast.anchorWeightKg!=null?forecast.anchorWeightKg+" kg":"–"}/>
        <KV k="Suchhorizont (Kalendertage rückwärts)" v={FORECAST_CONFIG.recentValidDaysSearchHorizonDays}/>
        <KV k="Sichtbarer Text" v={forecast.status!=="ok"?forecastEmptyStateText(forecast):"(reguläre Karte, kein Leerzustand-Text)"}/>
      </div>

      <div className="card" style={{marginBottom:12,padding:"12px 14px"}}>
        <div className="lbl" style={{marginBottom:6}}>Monatseinstellungen (buildEngineMonthlySettings)</div>
        {[curMonthInfo,prevMonthInfo].map(mi=>(
          <div key={mi.monthId} style={{marginBottom:8,paddingBottom:8,borderBottom:"1px solid var(--line)"}}>
            <div style={{fontWeight:700,fontSize:13}}>{mi.label} ({mi.monthId})</div>
            <KV k="in tracker_mset vorhanden" v={mi.presentInTrackerMSet?"ja":"NEIN"}/>
            <KV k="TDEE (getMonthlyTdee)" v={mi.tdee!=null?mi.tdee+" kcal":"fehlt"}/>
          </div>
        ))}
      </div>

      <div className="card" style={{marginBottom:12,padding:"12px 14px"}}>
        <div className="lbl" style={{marginBottom:6}}>Gemeldeter Zeitraum 29.07.–03.08.2026 im Detail</div>
        {knownChecks.map(c=>(
          <div key={c.dayKey} style={{marginBottom:8,paddingBottom:8,borderBottom:"1px solid var(--line)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontWeight:700,fontSize:13}}>{c.label}</span>
              <span style={{fontWeight:700,fontSize:12,color:c.valid?"var(--good)":"var(--amber)"}}>{c.valid?"✔ gültig":"✖ abgelehnt"}</span>
            </div>
            <KV k="erwarteter dayKey" v={c.dayKey}/>
            <KV k="monthId" v={c.monthId}/>
            <KV k="Datensatz vorhanden" v={c.dayExists?"ja":"NEIN"}/>
            <KV k="logged" v={String(c.logged)}/>
            <KV k="kcalIn" v={c.kcalIn==null?"–":c.kcalIn}/>
            <KV k="kcalBurned" v={c.kcalBurned==null?"–":c.kcalBurned}/>
            <KV k="Monats-TDEE" v={c.monthlyTdee==null?"fehlt":c.monthlyTdee}/>
            {!c.valid&&<KV k="Ablehnungsgrund(e)" v={c.rejectionReasons.join(", ")}/>}
            <KV k={"Prüfung auf falschen Monat ("+c.altKey+")"} v={c.altRecordExists?"⚠️ Datensatz unter diesem Key gefunden":"kein Datensatz unter diesem Key"}/>
          </div>
        ))}
      </div>

      <div className="card" style={{padding:"12px 14px"}}>
        <div className="lbl" style={{marginBottom:6}}>Alle geprüften Tage im 60-Tage-Suchhorizont ({trace.length})</div>
        {trace.slice().reverse().map(t=>(
          <div key={t.dayKey} style={{display:"flex",justifyContent:"space-between",gap:6,padding:"4px 0",borderBottom:"1px solid var(--line)",fontSize:11}}>
            <span style={{flexShrink:0,width:74}}>{t.date.getDate()+"."+(t.date.getMonth()+1)+"."+t.date.getFullYear()}</span>
            <span className="sub" style={{flexShrink:0,width:64}}>{t.dayKey}</span>
            <span className="sub" style={{flexShrink:0,width:56}}>{t.monthId}</span>
            <span style={{flexShrink:0,width:16,textAlign:"center"}}>{t.dayExists?"✓":"–"}</span>
            <span style={{flex:1,textAlign:"right",fontWeight:600,color:t.valid?"var(--good)":(t.dayExists?"var(--amber)":"var(--ink3)")}}>
              {t.valid?"gültig":(t.dayExists?t.rejectionReasons.join(","):"–")}
            </span>
          </div>
        ))}
      </div>

      <div className="card" style={{marginTop:12,padding:"12px 14px"}}>
        <div className="lbl" style={{marginBottom:6}}>Rohdaten (nur Anzeige)</div>
        <KV k="tracker_forecast_calibration vorhanden" v={rawCalib?"ja":"nein"}/>
        <KV k="tracker_weight_confirmations Anzahl" v={(rawConfirmations||[]).length}/>
        <KV k="tracker_data Anzahl Tage gesamt" v={Object.keys(rawData).length}/>
        <KV k="tracker_mset Anzahl Monate gesamt" v={Object.keys(rawMSet).length}/>
      </div>
    </Sheet>
  );
}

function VerlaufView({data,mSet,goals,calibProfile,weightConfirmations,currentDay,initialSeg,openDay,openSetup}){
  const [seg,setSeg]=useState(initialSeg||"Kalender");
  const [sy,setSy]=useState(NOW.getFullYear());
  const [sm,setSm]=useState(NOW.getMonth());
  const [sport,setSport]=useState("bike");
  /* TEMPORAER (Fehlersuche kalenderuebergreifende Live-Prognose): "Live-
     Prognose"-Ueberschrift antippbar, oeffnet ein Diagnose-Sheet. Nach
     Abschluss der Fehlersuche wieder entfernen (siehe ForecastDiagnosticSheet). */
  const [showForecastDiag,setShowForecastDiag]=useState(false);
  /* Zeitraum-Auswahl der Gewichtsanalyse — eigener, von der Monats-Navigation
     (sy/sm, von Kalender/Sport/Jahr mitgenutzt) UNABHAENGIGER Anker, damit
     das Umschalten auf Quartal/Halbjahr/Jahr die anderen Verlauf-Reiter
     nicht durcheinanderbringt. Ungueltige/alte gespeicherte Werte fallen
     automatisch auf "month" zurueck. */
  const [wRange,setWRange]=useState(()=>{
    const saved=load("tracker_weight_range",null);
    return WEIGHT_RANGES.some(r=>r.key===saved)?saved:"month";
  });
  const [wAnchor,setWAnchor]=useState({y:NOW.getFullYear(),m:NOW.getMonth(),d:NOW.getDate()});
  const nav=dir=>{let m=sm+dir,y=sy;if(m>11){m=0;y++;}if(m<0){m=11;y--;}setSm(m);setSy(y);};
  const tdee=tdeeOf(mSet,sy,sm);
  const dim=daysIn(sy,sm),fd=firstDay(sy,sm);
  const days=useMemo(()=>Array.from({length:dim},(_,i)=>({d:i+1,...dayData(data,sy,sm,i+1)})),[data,sy,sm,dim]);
  const lg=days.filter(isDayLogged);
  const totDef=lg.reduce((s,x)=>s+(x.kcalIn||0)-(tdee||0)-(x.kcalBurned||0),0);
  const isToday=d=>d===NOW.getDate()&&sm===NOW.getMonth()&&sy===NOW.getFullYear();

  /* Forecast-Engine memoisiert: calculateCurrentMonthForecast() ist
     rechnerisch nicht trivial (mehrere verschachtelte Schleifen ueber
     Tage/Gewichtseintraege) und wurde bisher bei JEDEM Render von
     VerlaufView neu ausgefuehrt — auch wenn nur ein voellig unabhaengiger
     UI-State wie ein geoeffnetes Sheet in einer Elternkomponente sich
     geaendert hat. useMemo sorgt dafuer, dass die Berechnung wirklich nur
     dann erneut laeuft, wenn sich eine der tatsaechlich prognoserelevanten
     Abhaengigkeiten geaendert hat: Ernaehrung/Aktivitaet/Gewicht (alle in
     "data"), Monatsbedarf ("mSet"), das Kalibrierungsprofil, die
     Bestaetigungen auffaelliger Gewichtseintraege ODER ein echter
     Tageswechsel. Nutzt bewusst currentDay (siehe useCurrentDay in App())
     statt der eingefrorenen globalen NOW-Konstante — sonst wuerde die
     Prognose in einer sehr lange offenen Sitzung nie ueber Mitternacht
     hinaus neu rechnen. Als Abhaengigkeit dient currentDayKey (ein
     simpler "YYYY-MM-DD"-String) statt des kompletten Date-Objekts, damit
     nicht schon durch kleinste Millisekunden-Unterschiede unnoetig neu
     gerechnet wird.
     WICHTIG: Nur der Engine-Aufruf selbst ist memoisiert — die Berechnungs-
     LOGIK innerhalb der Engine (calculateCurrentMonthForecast) wurde dabei
     nicht angefasst. */
  const currentDayKey=dateToIso(currentDay);
  const forecast=useMemo(()=>{
    const {dailyData,monthlySettings,weightEntries}=buildEngineInputsFor(currentDay,data,mSet);
    return calculateCurrentMonthForecast({now:currentDay,dailyData,monthlySettings,weightEntries,calibrationProfile:calibProfile,weightConfirmations});
    // eslint-disable-next-line
  },[data,mSet,calibProfile,weightConfirmations,currentDayKey]);

  return(
    <div className="vl-screen">
      <div className="h1 vl-title">Verlauf</div>
      <Seg items={["Kalender","Rückblick","Gewicht","Sport","Jahr"]} val={seg} onChange={setSeg} variant="hero"/>

      {/* --- KALENDER ---
          Redesign nach Referenzbild (Screenshot einer Ziel-App): Titel/
          Segment-Regler/Monatsnavigation/KPI-Karten/Kalendergitter komplett
          neu angeordnet und gestylt. Ausschliesslich Darstellung/Struktur
          geaendert — KEINE der zugrunde liegenden Berechnungen (totDef,
          Katch-McArdle/TDEE, Gewichts-/Bilanz-Werte je Tag,
          inferWeightGoalDirection) wurde angefasst. Bestehende Handler
          (nav, openDay, openSetup, setSeg) unveraendert weiterverwendet. */}
      {seg==="Kalender"&&(
        <div>
          <MonthNav y={sy} m={sm} onPrev={()=>nav(-1)} onNext={()=>nav(1)} variant="hero"/>
          {/* Grundbedarf laesst sich hier auch nachtraeglich fuer JEDEN
              navigierten Monat einrichten (nicht nur den aktuellen) — ohne
              TDEE lassen sich Tagesbilanzen fuer diesen Monat nicht sinnvoll
              bewerten. */}
          {!tdee&&(
            <div className="card card-compact" style={{textAlign:"center",marginBottom:14}}>
              <div className="sub" style={{marginBottom:10}}>Für {MN[sm]} {sy} ist noch kein Grundbedarf eingerichtet — Tagesbilanzen für diesen Monat können erst danach berechnet werden.</div>
              <button className="btn btn2" onClick={()=>openSetup(sy,sm)}>Grundbedarf für {MN[sm]} einrichten</button>
            </div>
          )}
          {/* --- KPI-KARTEN ---
              Dieselben drei bereits vorhandenen Werte (Ø Kalorien/
              Kalorienbilanz/dritte Kachel), IDENTISCH berechnet wie zuvor
              (keine Formel/Rundung/Vorzeichen-Logik veraendert). Icon+
              Label in einer Zeile, grosse Zahl+Einheit in der Zeile
              darunter.
              FARBLOGIK (bewusst, explizite Vorgabe "Alle Hauptwerte in
              Weiß darstellen, keine gelbe oder grüne Schrift"): die
              Hauptzahl ist jetzt bei ALLEN drei Karten neutral weiss
              (valueColor:"var(--ink)"), unabhaengig von Defizit/
              Ueberschuss oder Zielerreichung. Damit entfaellt die zuvor
              gebaute Erfolgs-/Warnfarblogik (gruen=Ziel erreicht, amber=
              Ziel nicht erreicht) fuer die ZAHL — das war zuvor bewusst
              zwecks eines Referenzbilds so gebaut, wird hier aber durch
              die aktuelle, explizite Anweisung ersetzt. Icon-Badge/obere
              Randlinie jeder Karte (accent/accentSoft) behalten dagegen
              unveraendert ihre Farbe — nur "Icons"/"Farbakzente", nicht
              die Zahl, sollen laut Vorgabe farbig bleiben. Die dynamische
              Ziel-Logik der dritten Kachel (Fettverlust/Gewichtsveränderung
              je nach inferWeightGoalDirection) bleibt davon unabhaengig
              vollstaendig erhalten.
              FARBTAUSCH (explizite Vorgabe "Kalorienbilanz sollte gruen
              sein — einfach nur tauschen"): Karte 2 ("Kalorienbilanz")
              ist jetzt gruen (--good) statt orange.
              Karte 3 (explizite Vorgabe "Fettverlust sollte violett
              sein"): einheitlich violett (--violet, neues Token analog
              zu --accent/--good) in ALLEN drei Zielrichtungen
              (Fettverlust/Gewichtszunahme-Zustand/Halten-Zustand) — wie
              bei Karte 1 (blau) und Karte 2 (gruen) eine feste
              Kartenidentitaet, unabhaengig vom Inhalt. */}
          {lg.length>0&&(()=>{
            const goalDirection=inferWeightGoalDirection(goals,lastWeight(data));
            const theoreticalKg="≈ "+(totDef<0?"−":"+")+(Math.abs(totDef)/KCAL_PER_KG).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});
            const thirdTile=goalDirection==="zunehmen"
              ? {icon:(
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="3 17 9 11 13 15 21 6"/><polyline points="21 10 21 6 17 6"/>
                  </svg>
                ),l:"Gewichtsveränderung",v:theoreticalKg,unit:"kg",accent:"var(--violet)",accentSoft:"var(--violet-soft)",valueColor:"var(--ink)"}
              : goalDirection==="halten"
              ? {icon:(
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M12 3v18"/><path d="M5 8h14"/><path d="M5 8l-3 6a3 3 0 0 0 6 0Z"/><path d="M19 8l-3 6a3 3 0 0 0 6 0Z"/>
                  </svg>
                ),l:"Gewichtsveränderung",v:theoreticalKg,unit:"kg",accent:"var(--violet)",accentSoft:"var(--violet-soft)",valueColor:"var(--ink)"}
              : {icon:(
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                  </svg>
                ),l:"Fettverlust",v:theoreticalKg,unit:"kg",accent:"var(--violet)",accentSoft:"var(--violet-soft)",valueColor:"var(--ink)"};
            const kpis=[
              {icon:(
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M3 2v7c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
                </svg>
              ),l:"Ø Kalorien",v:lg.length?Math.round(lg.reduce((s,x)=>s+(x.kcalIn||0),0)/lg.length):0,unit:"kcal",accent:"var(--accent)",accentSoft:"var(--accent-soft)",valueColor:"var(--ink)"},
              {icon:(
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
                </svg>
              ),l:"Kalorienbilanz",v:(totDef<0?"−":"+")+Math.abs(totDef).toLocaleString("de-DE"),unit:"kcal",accent:"var(--good)",accentSoft:"var(--good-soft)",valueColor:"var(--ink)"},
              thirdTile,
            ];
            return(
            <div className="vl-kpi-grid" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
              {kpis.map(k=>(
                <div key={k.l} className="vl-kpi-card" style={{background:"linear-gradient(160deg,var(--card2),"+k.accentSoft+")",borderTop:"3px solid "+k.accent}}>
                  {/* Zeile 1: Icon + Label nebeneinander (Label steht IMMER
                      rechts vom Icon, bricht nie darunter um).
                      "Gewichtsveränderung" (19 Zeichen) ist laenger als
                      "Kalorienbilanz" (14, die Referenzgroesse fuer den
                      Basis-clamp) und wuerde ihn neben dem groesseren Icon
                      sonst ueberragen — calc() auf dem Basis-clamp haelt
                      die Schrumpfung responsiv UND laengenabhaengig
                      zugleich, empirisch bei 300-430px mit allen vier
                      moeglichen Labels verifiziert (kein Umbruch, kein
                      Abschneiden). */}
                  <div className="vl-kpi-row1">
                    <div className="vl-kpi-icon" style={{color:k.accent,background:k.accentSoft}}>{k.icon}</div>
                    <div className="vl-kpi-label" style={k.l.length>14?{fontSize:"calc(clamp(5px,calc(4.3vw - 7.7px),12.5px) * 0.65)"}:undefined}>{k.l}</div>
                  </div>
                  {/* Zeile 2: grosse Zahl + Einheit nebeneinander, direkt
                      unter Zeile 1 (minimaler Abstand, siehe .vl-kpi-card
                      gap) — keine dritte Textzeile. */}
                  <div className="vl-kpi-row2">
                    <span className="num vl-kpi-value" style={{color:k.valueColor}}>{k.v}</span>
                    {k.unit&&<span className="vl-kpi-unit">{k.unit}</span>}
                  </div>
                </div>
              ))}
            </div>
            );
          })()}
          <div style={{display:"flex",justifyContent:"center",gap:14,marginBottom:16,flexWrap:"wrap"}}>
            {[["Gewicht","var(--amber)"],["Defizit / Überschuss","var(--good)"]].map(([l,c])=>(
              <div key={l} style={{display:"flex",alignItems:"center",gap:6}}>
                <div style={{width:8,height:8,borderRadius:99,background:c}}/>
                <span className="sub" style={{fontSize:12}}>{l}</span>
              </div>
            ))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6,marginBottom:6}}>
            {DS.map(x=><div key={x} className="sub" style={{textAlign:"center",fontSize:12}}>{x}</div>)}
          </div>
          {/* Tageszellen: Farbe der Kalorienbilanz jetzt zielabhaengig statt
              nur nach Vorzeichen. Wiederverwendet dieselbe, bereits an
              anderer Stelle in dieser Komponente etablierte Bewertungslogik
              (inferWeightGoalDirection + 150-kcal-Toleranz fuer "halten",
              siehe dayGoalColor im Rueckblick-Segment weiter unten) — bewusst
              hier als eigene lokale Kopie belassen statt die Definitionen
              nach oben zu verschieben, da diese Aufgabe sich ausdruecklich
              NUR auf die Kalendertage bezieht und keine anderen Codestellen
              angefasst werden sollen. Keine neue Berechnung: totDef/tdee/
              kcalIn/kcalBurned bleiben exakt wie zuvor, nur die Farbzuordnung
              fuer den bereits berechneten Tageswert "def" aendert sich. */}
          {(()=>{
            const goalDirection=inferWeightGoalDirection(goals,lastWeight(data));
            const MAINTAIN_TOLERANCE_KCAL=150;
            const dayGoalColor=bilanz=>{
              if(goalDirection==="abnehmen")return bilanz<0?"var(--good)":"var(--amber)";
              if(goalDirection==="zunehmen")return bilanz>0?"var(--good)":"var(--amber)";
              return Math.abs(bilanz)<=MAINTAIN_TOLERANCE_KCAL?"var(--good)":"var(--amber)";
            };
            return(
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6,marginBottom:14}}>
              {monthGridDays(sy,sm,data).map((x,i)=>{
                const def=isDayLogged(x)&&x.own&&tdee?(x.kcalIn||0)-tdee-(x.kcalBurned||0):null;
                const isT=x.own&&isToday(x.d);
                return(
                  <div key={i} className="cell" onClick={()=>{if(x.own){tapH();openDay(sy,sm,x.d);}}}
                    style={{minHeight:86,justifyContent:"flex-start",gap:2,paddingTop:8,opacity:x.own?1:.35,
                      ...(isT?{boxShadow:"0 0 0 2px var(--accent)",background:"var(--accent-soft)"}:{})}}>
                    <div style={{fontSize:14,fontWeight:isT?700:500,color:isT?"var(--accent)":isDayLogged(x)?"var(--ink)":"var(--ink3)"}}>{x.d}</div>
                    {x.weight>0&&<div className="num" style={{fontSize:11,fontWeight:600,color:"var(--amber)"}}>{x.weight}</div>}
                    {def!==null&&<div className="num" style={{fontSize:12,fontWeight:700,marginTop:"auto",color:dayGoalColor(def)}}>{def<0?"−":"+"}{Math.abs(def)}</div>}
                  </div>
                );
              })}
            </div>
            );
          })()}

          {/* --- ABSCHNITT "WOCHENÜBERSICHT" ---
              UX-Verbesserung: soll eindeutig als neuer Hauptabschnitt
              wahrgenommen werden, mit derselben optischen Wertigkeit wie
              die grossen Seitentitel der App ("Verlauf", "Ziele", "Mehr" —
              className="h1" OHNE fontSize-Override, also volle
              --fs-title-Groesse 24-28px, font-weight 700, Primaertextfarbe
              --ink, linksbuendig). Abstand zum Kalender ergibt sich aus dem
              marginBottom des Kalendergitters (14px) + marginTop hier
              (var(--sp-3)=24px) = 38px. Abstand zur ersten Wochenkarte:
              var(--sp-2)=16px. */}
          <div className="h1" style={{marginTop:"var(--sp-3)",marginBottom:"var(--sp-2)"}}>Wochenübersicht</div>

          {/* --- WOCHENKARTEN (vormals eigener Tab "Rückblick") ---
              UI-Refactoring: der Kalender ist jetzt die vollstaendige
              Monatsuebersicht, die Wochenkarten gehoeren logisch direkt
              darunter. Unveraendert uebernommen — nur der Ort im Layout
              hat sich geaendert, keine Berechnung/Komponente wurde neu
              gebaut oder dupliziert. Der eigene MonthNav dieses Blocks
              entfaellt bewusst (die Monatsnavigation oben steuert bereits
              dieselben sy/sm und damit auch diese Wochenkarten). Nicht mehr
              antippbar (siehe unten) — der Logging-Status ist bereits am
              Tagesbalken sichtbar, das bisherige Week-Detail-Sheet bot
              keinen ausreichenden Mehrwert. */}
          {(()=>{
            /* Zielrichtung EINMAL pro Ansicht bestimmen (nicht pro Tag) —
               dieselbe Funktion, die auch die Live-Prognose und das
               Gewichts-Widget nutzen, damit die Bewertung app-weit konsistent
               bleibt. Liefert "abnehmen" | "zunehmen" | "halten". */
            const goalDirection=inferWeightGoalDirection(goals,lastWeight(data));
            /* Toleranz fuer "Halten": ein Tag gilt als Erfolg, wenn die
               Tagesbilanz innerhalb dieses kcal-Bereichs um 0 liegt. Bewusst
               grosszuegig ("kleine Fortschritte zaehlen", keine
               Perfektionsforderung) statt eng gefasst. */
            const MAINTAIN_TOLERANCE_KCAL=150;
            /* Reine Bewertungsfunktion: unterstuetzt die Tagesbilanz das
               aktuelle Ziel? Nur zwei moegliche Farben (gruen/orange), nie
               Rot — die App bewertet, bestraft aber nicht. Auf Modul-Ebene
               (VOR der Rueckkehr-JSX) definiert, damit sowohl die
               Wochenkarten ALS AUCH die grosse Wochenbilanz-Zahl exakt
               dieselbe Funktion bekommen — kein zweites Mal implementiert. */
            const dayGoalColor=(bilanz)=>{
              if(goalDirection==="abnehmen")return bilanz<0?"var(--good)":"var(--amber)";
              if(goalDirection==="zunehmen")return bilanz>0?"var(--good)":"var(--amber)";
              return Math.abs(bilanz)<=MAINTAIN_TOLERANCE_KCAL?"var(--good)":"var(--amber)";
            };
            /* Dieselbe Zielbewertung auch fuer die grosse Wochenbilanz-Zahl —
               bei null geloggten Tagen bewusst KEINE Farbaussage (neutral),
               damit eine leere Woche nicht wie eine Warnung wirkt, nur weil
               der mathematische Wert zufaellig 0 ist. */
            const weekGoalColor=(wdVal,loggedCount,dayCount)=>{
              if(loggedCount===0)return SEM.neutral;
              if(goalDirection==="abnehmen")return wdVal<0?"var(--good)":"var(--amber)";
              if(goalDirection==="zunehmen")return wdVal>0?"var(--good)":"var(--amber)";
              return Math.abs(wdVal)<=MAINTAIN_TOLERANCE_KCAL*dayCount?"var(--good)":"var(--amber)";
            };
            const weeks=groupByWeekSorted(days,x=>({y:sy,m:sm,d:x.d}));
            /* Fuer jede Woche slots+summary EINMAL hier berechnen (statt wie
               zuvor nur innerhalb der Kartenschleife) — dieselben
               buildWeekSlots()/buildIsoWeekSummary()-Aufrufe wie bisher,
               nur einmal zentral statt implizit dupliziert, damit sowohl die
               Wochenkarten ALS AUCH die Wochenstatistik im Monatsfazit
               unten (Abschnitt 6) exakt dieselben Werte verwenden — keine
               zweite/neue Bilanzlogik. */
            const weekSummaries=weeks.map(({kw,start})=>{
              const slots=buildWeekSlots(data,mSet,start,sy,sm);
              return {kw, slots, summary:buildIsoWeekSummary(slots,dayGoalColor,weekGoalColor)};
            });
            const weeksInDeficitCount=weekSummaries.filter(w=>w.summary.totalBalanceKcal<0).length;
            /* Durchschnittliche Tagesbilanz ueber die bereits vorhandenen
               lg/totDef (siehe KPI-Bereich oben) — reine Division derselben
               beiden Werte, keine neue Berechnung. */
            const avgDailyBalance=lg.length?Math.round(totDef/lg.length):0;
            return(
            <React.Fragment>
              <div>
                {weekSummaries.map(({kw,slots,summary})=>(
                    <div key={kw} className="card card-compact">
                      <div className="row" style={{marginBottom:8,alignItems:"flex-start"}}>
                        <div>
                          <div style={{fontSize:19,fontWeight:700}}>KW {kw}</div>
                          <div className="sub">{summary.loggedDayCount}/7 Tage geloggt · Ø {summary.averageLoggedKcal||"–"} kcal</div>
                        </div>
                        <div style={{textAlign:"right"}}>
                          <div className="num" style={{fontSize:19,fontWeight:700,color:summary.goalStatus}}>{summary.totalBalanceKcal<0?"−":"+"}{Math.abs(summary.totalBalanceKcal).toLocaleString("de-DE")} kcal</div>
                          <div className="sub">≈ {summary.totalBalanceKcal<0?"−":"+"}{Math.abs(summary.theoreticalWeightChangeKg).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})} kg</div>
                        </div>
                      </div>
                      <div style={{display:"flex",gap:4}}>
                        {slots.map((x,i)=>{
                          const s=summary.dayStates[i];
                          return <div key={i} style={{flex:1,height:6,borderRadius:3,background:s.background,opacity:s.opacity}}/>;
                        })}
                      </div>
                      <div style={{display:"flex",gap:4,marginTop:3}}>
                        {slots.map((x,i)=>{
                          const s=summary.dayStates[i];
                          return <div key={i} className="sub" style={{flex:1,textAlign:"center",fontSize:10,color:s.logged?"var(--ink)":s.background,opacity:s.opacity}}>{x.d}</div>;
                        })}
                      </div>
                    </div>
                  ))}
              </div>

              {/* --- MONATSFAZIT (vormals im entfallenen Monatsabschluss-Dialog) ---
                  Checklisten-Format nach UI-Update-Vorlage: Icon-Badge +
                  Kopfzeile, darunter 4 Zeilen mit Haken-Icon. Jede Kennzahl
                  ist entweder bereits an anderer Stelle im Kalender-Segment
                  berechnet (lg/totDef/dim aus dem KPI-Bereich oben,
                  weekSummaries/weeksInDeficitCount aus den Wochenkarten
                  direkt darueber) oder eine reine Division/Prozentrechnung
                  bestehender Werte (avgDailyBalance, loggedPct) — keine
                  neue Fachlogik, keine neuen gespeicherten Daten. Abstand
                  zur letzten Wochenkarte: deren eigenes marginBottom (16px,
                  .card-Klasse) + marginTop hier (16px) = 32px. */}
              {lg.length>0&&(()=>{
                const loggedPct=dim?Math.round(lg.length/dim*100):0;
                const fazitLines=[
                  lg.length+" / "+dim+" Tage geloggt ("+loggedPct+"%)",
                  weeksInDeficitCount+" / "+weekSummaries.length+" Wochen im Defizit",
                  avgDailyBalance<0?"Ø "+Math.abs(avgDailyBalance)+" kcal Defizit pro Tag":avgDailyBalance>0?"Ø "+Math.abs(avgDailyBalance)+" kcal Überschuss pro Tag":"Ø ausgeglichene Tagesbilanz",
                  "≈ "+(Math.abs(totDef)/KCAL_PER_KG).toFixed(2)+" kg Fett "+(totDef<0?"verloren":totDef>0?"zugenommen":"gehalten"),
                ];
                return(
                  <div className="card" style={{marginTop:"var(--sp-2)",marginBottom:12}}>
                    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
                      <div style={{width:36,height:36,borderRadius:10,background:totDef<0?"var(--good-soft)":totDef>0?"var(--amber-soft)":"var(--card2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>
                        {totDef<0?"🏆":totDef===0?"⚖️":"💪"}
                      </div>
                      <div style={{fontSize:17,fontWeight:700}}>{totDef<0?"Sehr guter Monat!":totDef===0?"Ausgeglichener Monat":"Herausfordernder Monat"}</div>
                    </div>
                    {fazitLines.map((line,i)=>(
                      <div key={i} className="row" style={{justifyContent:"flex-start",gap:8,padding:"6px 0"}}>
                        <span style={{color:"var(--good)",flexShrink:0}}>✅</span>
                        <span className="sub" style={{color:"var(--ink)"}}>{line}</span>
                      </div>
                    ))}
                  </div>
                );
              })()}
            </React.Fragment>
            );
          })()}
        </div>
      )}

      {/* --- RÜCKBLICK ---
          UI-Refactoring: bewusst leer gelassen. Die Wochenkarten stehen
          jetzt unter dem Kalender (siehe oben), der bisherige Inhalt dieses
          Tabs wurde dorthin verschoben. Dieser Tab wird in einer spaeteren
          Phase vollstaendig neu als Analyse-/Insights-Bereich aufgebaut —
          bis dahin bewusst ohne Platzhalter/Dummy-Inhalte. */}
      {seg==="Rückblick"&&<div/>}

      {/* --- GEWICHT --- */}
      {seg==="Gewicht"&&(
        <div>
          {/* Zeitraum-Pills — bewusst OHNE eigene Ueberschrift mehr, die Chips
              erklaeren sich selbst. ~24px Abstand zur Hauptnav oben (die hat
              bereits 16px eigenen Rand, hier +8px extra). */}
          <div style={{marginTop:8}}>
            <RangePillBar value={wRange} onChange={r=>{
              setWRange(r);save("tracker_weight_range",r);
              setWAnchor({y:sy,m:sm,d:NOW.getDate()}); // beim Wechseln nahtlos beim aktuell betrachteten Monat anknuepfen
            }}/>
          </div>
          {(()=>{
            const bounds=wRange==="all"?null:weightRangeBounds(wRange,wAnchor.y,wAnchor.m,wAnchor.d);
            const inRangeFn=bounds
              ? (y,m2,d)=>{
                  const ts=new Date(y,m2,d).getTime();
                  const startTs=new Date(bounds.sy,bounds.sm,bounds.sd).getTime();
                  const endTs=new Date(bounds.ey,bounds.em,bounds.ed).getTime();
                  return ts>=startTs&&ts<=endTs;
                }
              : ()=>true;
            const rawPts=collectWeightPointsInRange(data,inRangeFn);
            /* Es wird nicht mehr aggregiert — jede vorhandene Messung wird
               gezeigt, in jedem Zeitraum. */
            const pts=rawPts;
            const rangeLabel=weightRangeLabel(wRange,bounds);
            /* Zukuenftige Zeitraeume ohne sinnvolle Daten duerfen nicht
               geoeffnet werden koennen — Pfeil dann dezent deaktiviert. */
            const canGoNext=wRange!=="all"&&(()=>{
              const na=navWeightRange(wRange,wAnchor.y,wAnchor.m,wAnchor.d,1);
              const nb=weightRangeBounds(wRange,na.y,na.m,na.d);
              return new Date(nb.sy,nb.sm,nb.sd)<=NOW;
            })();

            return(
              <div>
                {/* ~24px Abstand von den Pills bis hierher. */}
                <div style={{marginTop:24,marginBottom:14}}>
                  {wRange!=="all"?(
                    <div style={{display:"grid",gridTemplateColumns:"36px 1fr 36px",alignItems:"center"}}>
                      <button className="nav" onClick={()=>{tapH();setWAnchor(navWeightRange(wRange,wAnchor.y,wAnchor.m,wAnchor.d,-1));}} style={{justifySelf:"end",fontSize:17,color:"var(--ink3)"}}>‹</button>
                      <div style={{fontSize:22,fontWeight:700,textAlign:"center",letterSpacing:-.3}}>{rangeLabel}</div>
                      <button className="nav" disabled={!canGoNext} onClick={()=>{if(canGoNext){tapH();setWAnchor(navWeightRange(wRange,wAnchor.y,wAnchor.m,wAnchor.d,1));}}}
                        style={{justifySelf:"start",fontSize:17,color:"var(--ink3)",opacity:canGoNext?1:.3}}>›</button>
                    </div>
                  ):(
                    <div style={{textAlign:"center",fontSize:22,fontWeight:700,letterSpacing:-.3}}>{rangeLabel}</div>
                  )}
                </div>

                {pts.length===0?(
                  <div className="card" style={{textAlign:"center",padding:"32px 20px"}}>
                    <div className="sub" style={{marginBottom:14}}>In diesem Zeitraum gibt es noch keine Gewichtsmessungen.</div>
                    <button className="btn btn2" onClick={()=>{
                      /* Sinnvolles Datum statt immer "heute": Start des
                         betrachteten Zeitraums, bei "Gesamt" tatsaechlich heute. */
                      const d2=bounds?{y:bounds.sy,m:bounds.sm,d:bounds.sd}:{y:NOW.getFullYear(),m:NOW.getMonth(),d:NOW.getDate()};
                      openDay(d2.y,d2.m,d2.d);
                    }}>Gewicht eintragen</button>
                  </div>
                ):pts.length===1?(
                  <div className="card" style={{textAlign:"center",padding:"24px 20px"}}>
                    <div className="num" style={{fontSize:32,fontWeight:700}}>{fmtNum(pts[0].w,1)} kg</div>
                    <div className="sub" style={{marginTop:6}}>Einzelne Messung — noch kein Verlauf darstellbar.</div>
                  </div>
                ):(
                  <div>
                    {/* Grosses, interaktives Diagramm — das eigentliche Zentrum
                        der Seite. Keine Legende mehr, erklaert sich selbst.
                        key erzwingt Neustart der Eintritts-/Zeichenanimation
                        bei jedem Zeitraum-/Periodenwechsel. */}
                    <WeightTrendChart key={wRange+"-"+wAnchor.y+"-"+wAnchor.m+"-"+wAnchor.d} w={pts} sy={wAnchor.y} sm={wAnchor.m}/>
                    {/* Eine gemeinsame Statistikleiste statt drei einzelner
                        Karten — Beschriftung passt sich dem Zeitraum an. */}
                    <div className="card" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",padding:"22px 0"}}>
                      {(()=>{
                        const diff=pts[pts.length-1].w-pts[0].w;
                        return [
                          [wRange==="all"?"Erstes Gewicht":"Start",pts[0].w.toFixed(1)+" kg","var(--ink)"],
                          ["Aktuell",pts[pts.length-1].w.toFixed(1)+" kg","var(--ink)"],
                          [WEIGHT_STAT_DELTA_LABEL[wRange],(diff>0?"+":"")+diff.toFixed(1)+" kg",diff<=0?"var(--good)":"var(--amber)"],
                        ];
                      })().map(([l,v,c],i)=>(
                        <div key={l} style={{textAlign:"center",position:"relative"}}>
                          {i>0&&<div style={{position:"absolute",left:0,top:"50%",transform:"translate(-50%,-50%)",width:1,height:22,background:"var(--line)",opacity:.5}}/>}
                          <div className="num" style={{fontSize:17,fontWeight:700,color:c}}>{v}</div>
                          <div className="sub" style={{fontSize:11,marginTop:5}}>{l}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            );
          })()}
          {/* Live-Prognose als Coach — gespeist aus dem oben memoisierten
              "forecast" (useMemo). Keine parallele Berechnung von
              Durchschnittsbilanz, Ankergewicht, Prognosewert ODER
              Zielbewertung mehr hier in der UI — evaluateForecastAgainstGoal()
              in der Engine ist die einzige fachliche Quelle fuer Richtung,
              "Ziel erreicht", Distanz und Deadline-Status. Die UI
              uebersetzt dessen Codes nur noch in Text (goalStatusDisplay
              unten), berechnet selbst nichts mehr. */}
          {(()=>{
            if(forecast.status!=="ok")return(
              <div className="card" style={{animation:"fadeUp .2s cubic-bezier(.32,.72,.28,1)"}}>
                <div className="lbl" style={{marginBottom:6,cursor:"pointer"}} onClick={()=>setShowForecastDiag(true)}>Live-Prognose</div>
                <div className="sub" style={{fontWeight:600}}>{forecastEmptyStateText(forecast)}</div>
              </div>
            );

            const curW=forecast.anchorWeightKg;
            const avgDef=forecast.averageDailyBalanceKcal;
            const inDef=avgDef<0;
            const projW=forecast.forecastWeightKg;
            const horizonLabel="Ende "+MN[currentDay.getMonth()];
            const dLeft=Math.max(0,daysBetween(currentDay,new Date(currentDay.getFullYear(),currentDay.getMonth()+1,0)));

            /* Normalisiertes Ziel-Objekt fuer die Engine — reine
               Datenzuordnung (App-Zielformat -> Engine-Eingabeform), KEINE
               fachliche Berechnung. Die eigentliche Bewertung passiert
               ausschliesslich in evaluateForecastAgainstGoal(). */
            const weightGoal=goals.find(g=>g.type==="weight"&&g.active!==false);
            const normalizedGoal=weightGoal?{targetWeightKg:parseFloat(weightGoal.target),deadline:weightGoal.deadline||null}:null;
            const goalEval=evaluateForecastAgainstGoal({forecast,goal:normalizedGoal,now:currentDay});
            const status=goalStatusDisplay(goalEval,avgDef);
            /* Prognose-Sicherheit kommt direkt aus der Engine
               (dataQuality.stage) statt aus einer eigenen Dichte-Formel. */
            const confidence=(()=>{
              const s=forecast.dataQuality.stage;
              if(s==="good"||s==="personalized")return {emoji:"🟢",label:"Hoch"};
              if(s==="provisional")return {emoji:"🟡",label:"Mittel"};
              return {emoji:"🔴",label:"Niedrig"};
            })();

            return(
              <div className="card" style={{animation:"fadeUp .2s cubic-bezier(.32,.72,.28,1)"}}>
                <div className="lbl" style={{marginBottom:2,cursor:"pointer"}} onClick={()=>setShowForecastDiag(true)}>Live-Prognose</div>
                <div className="sub" style={{marginBottom:12}}>Basis: Ø der letzten {forecast.validBalanceDays} geloggten Tage — je mehr Daten, desto verlässlicher.</div>
                <div className="row" style={{padding:"8px 0",borderBottom:"1px solid var(--line)"}}>
                  <span className="sub">Ø Bilanz / Tag</span>
                  <span className="num" style={{fontWeight:700,color:inDef?"var(--good)":"var(--amber)"}}>{inDef?"−":"+"}{Math.abs(Math.round(avgDef))} kcal</span>
                </div>
                <div className="row" style={{padding:"8px 0",borderBottom:"1px solid var(--line)"}}>
                  <span className="sub">Aktuell</span>
                  <span className="num" style={{fontSize:18,fontWeight:700}}>{curW.toFixed(1)} kg</span>
                </div>
                <div className="row" style={{padding:"8px 0"}}>
                  <span className="sub">{horizonLabel} (in {dLeft} Tagen)</span>
                  <span className="num" style={{fontSize:18,fontWeight:700,color:inDef?"var(--good)":"var(--amber)"}}>≈ {projW.toFixed(1)} kg</span>
                </div>

                {/* Automatisch erzeugte Einschaetzung — motivierend, aber
                    sachlich, ausschliesslich aus den echten Daten oben
                    abgeleitet. */}
                <div style={{marginTop:12,padding:12,borderRadius:14,background:"var(--card2)"}}>
                  <div style={{fontSize:13,fontWeight:600,lineHeight:1.5}}>{status.emoji} {status.text}</div>
                </div>
                <div className="row" style={{marginTop:10}}>
                  <span className="sub">Prognose-Sicherheit</span>
                  <span className="sub" style={{fontWeight:600}}>{confidence.emoji} {confidence.label}</span>
                </div>

                {weightGoal&&goalEval.status==="ok"&&(
                  <div style={{marginTop:12,padding:12,borderRadius:14,background:goalEval.goalReached?"var(--good-soft)":status.tone===SEM.bad?"rgba(192,69,62,.10)":status.tone===SEM.warn?"var(--amber-soft)":"var(--good-soft)",textAlign:"center"}}>
                    <div className="sub" style={{marginBottom:4}}>Ziel {weightGoal.label?weightGoal.label+" ("+normalizedGoal.targetWeightKg+" kg)":normalizedGoal.targetWeightKg+" kg"}</div>
                    {goalEval.goalReached?(
                      <div style={{fontWeight:700,color:"var(--good)"}}>🎉 Ziel erreicht</div>
                    ):(
                      <div style={{fontSize:14,fontWeight:700,color:status.tone}}>
                        {status.tone===SEM.good?"🟢 Ziel im Plan":status.tone===SEM.warn?"🟡 Leicht hinter Plan":"🔴 Deutlich hinter Plan"}
                      </div>
                    )}
                    {!goalEval.goalReached&&<div className="sub" style={{marginTop:4}}>noch {Math.abs(goalEval.distanceKg).toFixed(1)} kg</div>}
                  </div>
                )}
              </div>
            );
          })()}
        </div>
      )}

      {/* --- SPORT --- */}
      {seg==="Sport"&&(
        <div>
          <MonthNav y={sy} m={sm} onPrev={()=>nav(-1)} onNext={()=>nav(1)}/>
          <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:4,marginBottom:14}}>
            {SPORTS.map(sp=>(
              <button key={sp.key} className={"pill"+(sport===sp.key?" on":"")} style={{whiteSpace:"nowrap",padding:"10px 14px"}} onClick={()=>{tapH();setSport(sp.key);}}>
                {sp.icon} {sp.label}
              </button>
            ))}
          </div>
          {(()=>{
            const sp=SPORTS.find(s=>s.key===sport);
            const isGym=sport==="gym";
            const mv=isGym?gymMonthMins(data,sy,sm):monthKm(data,sport,sy,sm);
            const yv=Array.from({length:12},(_,m2)=>isGym?gymMonthMins(data,sy,m2):monthKm(data,sport,sy,m2));
            const yTot=yv.reduce((s,v)=>s+v,0);
            const mx=Math.max(...yv,1);
            return(
              <div>
                <div className="card" style={{textAlign:"center",padding:"26px 18px"}}>
                  <div style={{fontSize:34,marginBottom:4}}>{sp.icon}</div>
                  <div className="num" style={{fontSize:40,fontWeight:700,color:SPORT_COLORS[sport]}}>
                    {isGym?(mv>0?fmtGym(mv):"–"):mv.toFixed(1)+" km"}
                  </div>
                  <div className="sub">{sp.label} · {MN[sm]}</div>
                </div>
                <div className="card">
                  <div className="row" style={{marginBottom:12}}>
                    <span className="lbl">Jahr {sy}</span>
                    <span className="num" style={{fontWeight:700,color:SPORT_COLORS[sport]}}>{isGym?fmtGym(yTot):yTot.toFixed(1)+" km"}</span>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(12,1fr)",gap:3,alignItems:"end"}}>
                    {yv.map((v,m2)=>(
                      <div key={m2} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                        <div style={{width:"100%",height:44,display:"flex",alignItems:"flex-end"}}>
                          <div style={{width:"100%",height:Math.max(v/mx*44,v>0?4:2),borderRadius:3,background:SPORT_COLORS[sport],opacity:v>0?1:.15,transition:"height .5s cubic-bezier(.32,.72,.28,1)"}}/>
                        </div>
                        <div className="sub" style={{fontSize:9}}>{MN[m2].slice(0,1)}</div>
                      </div>
                    ))}
                  </div>
                </div>
                <div className="card" style={{padding:"6px 18px"}}>
                  {(()=>{
                    const wm={};
                    days.forEach(x=>{const kw=isoWeek(sy,sm,x.d);if(!wm[kw])wm[kw]=[];wm[kw].push(x);});
                    return Object.entries(wm).sort((a,b)=>Number(a[0])-Number(b[0])).map(([kw,ds],i,arr)=>{
                      const v=ds.filter(isDayLogged).reduce((s,x)=>s+(isGym?dayGymMins(x):dayKm(x,sport)),0);
                      return(
                        <div key={kw} className="row" style={{padding:"10px 0",borderBottom:i<arr.length-1?"1px solid var(--line)":"none"}}>
                          <span className="sub">KW {kw}</span>
                          <span className="num" style={{fontWeight:700,color:v>0?SPORT_COLORS[sport]:"var(--ink3)"}}>{v>0?(isGym?fmtGym(v):v.toFixed(1)+" km"):"–"}</span>
                        </div>
                      );
                    });
                  })()}
                </div>
              </div>
            );
          })()}
        </div>
      )}

      {/* --- JAHR --- */}
      {seg==="Jahr"&&(
        <div>
          <div className="row" style={{marginBottom:14}}>
            <button className="nav" onClick={()=>setSy(y=>y-1)}>‹</button>
            <div style={{fontSize:17,fontWeight:700}}>{sy}</div>
            <button className="nav" onClick={()=>setSy(y=>y+1)}>›</button>
          </div>
          {/* Gewichtsverlauf uebers Jahr */}
          {(()=>{
            const pts=[];
            for(let m2=0;m2<12;m2++)for(let d2=1;d2<=daysIn(sy,m2);d2++){
              const x=dayData(data,sy,m2,d2);
              if(x.weight>0)pts.push({m:m2,w:x.weight});
            }
            if(pts.length<2)return null;
            const W=320,H=150,P=30,cw=W-P*2,ch=H-P*2;
            const mn=Math.min(...pts.map(p=>p.w))-0.5,mx=Math.max(...pts.map(p=>p.w))+0.5;
            const X=i=>P+(i/(pts.length-1))*cw;
            const Y=v=>P+ch-((v-mn)/(mx-mn))*ch;
            const path=pts.map((p,i)=>(i===0?"M":"L")+X(i)+","+Y(p.w)).join(" ");
            const tr=pts.map((p,i)=>{const win=pts.slice(Math.max(0,i-29),i+1);return win.reduce((s,x)=>s+x.w,0)/win.length;});
            const trPath=tr.map((v,i)=>(i===0?"M":"L")+X(i)+","+Y(v)).join(" ");
            const diff=pts[pts.length-1].w-pts[0].w;
            const marks=[];pts.forEach((p,i)=>{if(i===0||pts[i-1].m!==p.m)marks.push({i,m:p.m});});
            return(
              <div className="card">
                <div className="row" style={{marginBottom:10}}>
                  <span className="lbl">Gewicht {sy}</span>
                  <span className="num" style={{fontWeight:700,color:diff<=0?"var(--good)":"var(--amber)"}}>{diff>0?"+":""}{diff.toFixed(1)} kg</span>
                </div>
                <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",display:"block"}}>
                  {marks.map(mk=><g key={mk.m}><line x1={X(mk.i)} y1={P} x2={X(mk.i)} y2={P+ch} stroke="var(--line)" strokeDasharray="3,3"/><text x={X(mk.i)+2} y={H-4} fill="var(--ink3)" fontSize="8">{MN[mk.m].slice(0,3)}</text></g>)}
                  <path d={path+" L"+X(pts.length-1)+","+(P+ch)+" L"+X(0)+","+(P+ch)+" Z"} fill="var(--accent-soft)"/>
                  <path d={path} fill="none" stroke="var(--accent)" strokeWidth="2" strokeLinejoin="round"/>
                  <path d={trPath} fill="none" stroke="var(--ink3)" strokeWidth="1.8" strokeDasharray="5,4"/>
                </svg>
                <div className="sub" style={{textAlign:"center",marginTop:4}}>┄ 30-Tage-Trend</div>
              </div>
            );
          })()}
          {/* Sport-Jahressummen */}
          <div className="card" style={{padding:"6px 18px"}}>
            {SPORTS.map((sp,i)=>{
              const isGym=sp.key==="gym";
              const tot=isGym?Array.from({length:12},(_,m2)=>gymMonthMins(data,sy,m2)).reduce((s,v)=>s+v,0):Array.from({length:12},(_,m2)=>monthKm(data,sp.key,sy,m2)).reduce((s,v)=>s+v,0);
              return(
                <div key={sp.key} className="row" style={{padding:"11px 0",borderBottom:i<SPORTS.length-1?"1px solid var(--line)":"none"}}>
                  <span style={{fontSize:15}}>{sp.icon} {sp.label}</span>
                  <span className="num" style={{fontWeight:700,color:tot>0?SPORT_COLORS[sp.key]:"var(--ink3)"}}>{tot>0?(isGym?fmtGym(tot):tot.toFixed(1)+" km"):"–"}</span>
                </div>
              );
            })}
          </div>
          {/* Rekorde */}
          {(()=>{
            const stats=Array.from({length:12},(_,m2)=>{
              const t=tdeeOf(mSet,sy,m2);
              let def=null,lgd=0;
              if(t){def=0;for(let d2=1;d2<=daysIn(sy,m2);d2++){const x=dayData(data,sy,m2,d2);if(isDayLogged(x)){def+=(x.kcalIn||0)-t-(x.kcalBurned||0);lgd++;}}}
              return {m:m2,def,km:monthKm(data,null,sy,m2),gym:gymMonthMins(data,sy,m2),lgd};
            });
            const withDef=stats.filter(s=>s.def!==null&&s.lgd>0);
            const best=withDef.length?withDef.reduce((b,s)=>s.def<b.def?s:b):null;
            const mostKm=stats.filter(s=>s.km>0).reduce((b,s)=>!b||s.km>b.km?s:b,null);
            const mostGym=stats.filter(s=>s.gym>0).reduce((b,s)=>!b||s.gym>b.gym?s:b,null);
            let streak=0,longest=0;
            for(let m2=0;m2<12;m2++){
              const t=tdeeOf(mSet,sy,m2);
              if(!t){streak=0;continue;}
              for(let d2=1;d2<=daysIn(sy,m2);d2++){
                const x=dayData(data,sy,m2,d2);
                if(isDayLogged(x)){
                  if((x.kcalIn||0)-t-(x.kcalBurned||0)<0){streak++;if(streak>longest)longest=streak;}
                  else streak=0;
                }
              }
            }
            if(!best&&!mostKm&&!mostGym&&!longest)return null;
            const rows=[];
            if(best&&best.def<0)rows.push(["Bester Monat",MN[best.m],"−"+Math.abs(best.def)+" kcal","var(--good)"]);
            if(longest>0)rows.push(["Längste Defizit-Serie",longest+" Tage","","var(--good)"]);
            if(mostKm)rows.push(["Meiste km",MN[mostKm.m],mostKm.km.toFixed(1)+" km",SPORT_COLORS.bike]);
            if(mostGym)rows.push(["Meiste Gym-Zeit",MN[mostGym.m],fmtGym(mostGym.gym),SPORT_COLORS.gym]);
            return(
              <div className="card" style={{padding:"12px 18px"}}>
                <div className="lbl" style={{margin:"6px 0 8px"}}>🏆 Rekorde {sy}</div>
                {rows.map(([l,v,s2,c],i)=>(
                  <div key={l} className="row" style={{padding:"9px 0",borderBottom:i<rows.length-1?"1px solid var(--line)":"none"}}>
                    <span className="sub">{l}</span>
                    <span style={{textAlign:"right"}}>
                      <span className="num" style={{fontWeight:700,color:c}}>{v}</span>
                      {s2&&<span className="sub" style={{display:"block",fontSize:11}}>{s2}</span>}
                    </span>
                  </div>
                ))}
              </div>
            );
          })()}
        </div>
      )}
      {/* TEMPORAER: Diagnose-Sheet fuer die kalenderuebergreifende
          Live-Prognose, siehe ForecastDiagnosticSheet weiter unten. */}
      {showForecastDiag&&<ForecastDiagnosticSheet forecast={forecast} currentDay={currentDay} onClose={()=>setShowForecastDiag(false)}/>}
    </div>
  );
}

/* ===== TAB 3: ZIELE — Ziele-Manager + beide Planer ===== */
function ZieleView({data,mSet,goals,openGoal}){
  const [seg,setSeg]=useState("Aktive Ziele");
  const st=settingsOf(mSet,NOW.getFullYear(),NOW.getMonth());
  const [planForm,setPlanForm]=useState({targetWeight:"",deficit:500,customDeficit:"",useCustom:false,pWeight:"",pFat:"",pActivityIdx:1});
  const [rev,setRev]=useState({targetWeight:"",deadline:"",startWeight:""});

  /* Hochrechnung: monatlicher Verlust bei festem Defizit, TDEE sinkt mit dem Gewicht */
  const plan=useMemo(()=>{
    const sw=parseFloat(planForm.pWeight)||(st?st.weight:0);
    const fat=parseFloat(planForm.pFat)||(st?st.fat:0);
    const ai=planForm.pActivityIdx;
    const target=parseFloat(planForm.targetWeight);
    if(!sw||!target||target>=sw)return null;
    const deficit=planForm.useCustom?(parseFloat(planForm.customDeficit)||500):planForm.deficit;
    let w=sw;const months=[];
    while(w>target&&months.length<120){
      const t=Math.round(calcBMR(w,fat)*ACT[ai].f);
      w=Math.max(w-(deficit*30)/KCAL_PER_KG,target);
      months.push({n:months.length+1,w:w.toFixed(1),t,done:w<=target});
      if(w<=target)break;
    }
    const dTotal=Math.round(((sw-target)*KCAL_PER_KG)/deficit);
    const date=new Date(NOW);date.setDate(date.getDate()+dTotal);
    return {months,dTotal,date,sw,deficit};
  },[st,planForm]);

  /* Jedes Ziel einmal zentral durchrechnen (computeGoalProgress) — Aktiv/
     Inaktiv und Erreicht/Offen trennen sich rein aus diesem einen Ergebnis. */
  const computed=goals.map(g=>({g,r:computeGoalProgress(g,data,mSet)}));
  const active=computed.filter(x=>x.g.active!==false&&!x.r.done);
  const achieved=computed.filter(x=>x.r.done);
  const inactive=computed.filter(x=>x.g.active===false&&!x.r.done);

  const GoalCard=({g,r})=>{
    const gt=GOAL_TYPES.find(t=>t.key===g.type)||GOAL_TYPES[0];
    const pl={total:"Gesamtziel",week:"Diese Woche",month:"Dieser Monat",year:"Dieses Jahr",day:"Heute"};
    return(
      <div className="card" style={{padding:"14px 18px",opacity:g.active===false?.55:1}} onClick={()=>{tapH();openGoal(g);}}>
        <div className="row" style={{marginBottom:10}}>
          <div>
            <div style={{fontSize:15,fontWeight:600,color:r.done?"var(--good)":"var(--ink)"}}>{gt.icon} {g.label||gt.label}{r.done?" 🎉":""}</div>
            <div className="sub">{pl[g.period]}{!gt.tracked?" · manuell":""}{g.active===false?" · inaktiv":""}</div>
          </div>
          <div className="num" style={{fontWeight:700,color:r.done?"var(--good)":"var(--ink2)"}}>{r.prog.toFixed(0)}%</div>
        </div>
        <div style={{background:"var(--card2)",height:8,borderRadius:99,overflow:"hidden",marginBottom:6}}>
          <div style={{height:"100%",width:r.prog+"%",borderRadius:99,background:"var(--accent)",transition:"width .6s cubic-bezier(.32,.72,.28,1)"}}/>
        </div>
        <div className="sub">{r.label}</div>
      </div>
    );
  };

  return(
    <div>
      <div className="row" style={{marginBottom:14}}>
        <div className="h1">Ziele</div>
        <button className="pill on" style={{padding:"9px 16px"}} onClick={()=>{tapH();openGoal(null);}}>＋ Neues Ziel</button>
      </div>

      <Seg items={["Aktive Ziele","Planer","Erreichte Ziele"]} val={seg} onChange={setSeg}/>

      {seg==="Aktive Ziele"&&(
        <div>
          {active.length===0&&(
            <div className="card sub" style={{textAlign:"center",padding:"24px 18px"}}>
              Noch keine aktiven Ziele. Leg oben eins an — Gewicht, Kaloriendefizit, Sporttage und mehr.
            </div>
          )}
          {GOAL_CATEGORIES.map(cat=>{
            const inCat=active.filter(({g})=>{const gt=GOAL_TYPES.find(t=>t.key===g.type);return gt&&gt.category===cat;});
            if(inCat.length===0)return null;
            return(
              <React.Fragment key={cat}>
                <div className="lbl" style={{margin:"16px 4px 8px"}}>{cat}</div>
                {inCat.map(({g,r})=><GoalCard key={g.id} g={g} r={r}/>)}
              </React.Fragment>
            );
          })}
          {inactive.length>0&&(
            <React.Fragment>
              <div className="lbl" style={{margin:"18px 4px 8px"}}>Deaktiviert</div>
              {inactive.map(({g,r})=><GoalCard key={g.id} g={g} r={r}/>)}
            </React.Fragment>
          )}
        </div>
      )}

      {seg==="Erreichte Ziele"&&(
        <div>
          {achieved.length===0&&(
            <div className="card sub" style={{textAlign:"center",padding:"24px 18px"}}>
              Noch keine Ziele erreicht — bleib dran!
            </div>
          )}
          {achieved.map(({g,r})=><GoalCard key={g.id} g={g} r={r}/>)}
        </div>
      )}

      {seg==="Planer"&&(
        <div>
          {/* Abnehm-Planer */}
          <div className="card">
            <div className="lbl" style={{marginBottom:2}}>Abnehm-Planer</div>
            <div className="sub" style={{marginBottom:14}}>Wie lange brauche ich mit welchem Defizit?</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
              <div>
                <div className="lbl" style={{marginBottom:5}}>Gewicht (kg)</div>
                <input type="number" inputMode="decimal" placeholder={st?String(st.weight):"z.B. 90"} value={planForm.pWeight} onChange={e=>setPlanForm(p=>({...p,pWeight:e.target.value}))}/>
              </div>
              <div>
                <div className="lbl" style={{marginBottom:5}}>Körperfett (%)</div>
                <input type="number" inputMode="decimal" placeholder={st?String(st.fat):"z.B. 25"} value={planForm.pFat} onChange={e=>setPlanForm(p=>({...p,pFat:e.target.value}))}/>
              </div>
            </div>
            <div className="lbl" style={{marginBottom:5}}>Aktivitätsfaktor</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:5,marginBottom:12}}>
              {ACT.map((a,i)=><button key={i} className={"pill"+(planForm.pActivityIdx===i?" on":"")} onClick={()=>setPlanForm(p=>({...p,pActivityIdx:i}))}>{a.f}</button>)}
            </div>
            <div className="lbl" style={{marginBottom:5}}>Zielgewicht (kg)</div>
            <input type="number" inputMode="decimal" placeholder="z.B. 80" value={planForm.targetWeight} onChange={e=>setPlanForm(p=>({...p,targetWeight:e.target.value}))} style={{marginBottom:12}}/>
            <div className="lbl" style={{marginBottom:5}}>Tägliches Defizit (kcal)</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:5,marginBottom:8}}>
              {[300,500,750,1000].map(d=><button key={d} className={"pill"+(!planForm.useCustom&&planForm.deficit===d?" on":"")} onClick={()=>setPlanForm(p=>({...p,deficit:d,useCustom:false}))}>{d}</button>)}
            </div>
            <input type="number" inputMode="numeric" placeholder="Eigenes Defizit, z.B. 600" value={planForm.customDeficit} onChange={e=>setPlanForm(p=>({...p,customDeficit:e.target.value,useCustom:e.target.value.length>0}))}/>
            {plan&&(
              <div style={{marginTop:14}}>
                <div style={{padding:14,borderRadius:16,background:"var(--accent-soft)",textAlign:"center",marginBottom:10}}>
                  <div className="sub" style={{marginBottom:4}}>Ziel erreicht am</div>
                  <div className="num" style={{fontSize:22,fontWeight:700,color:"var(--accent)"}}>{plan.date.toLocaleDateString("de-DE",{day:"2-digit",month:"long",year:"numeric"})}</div>
                  <div className="sub">in {plan.dTotal} Tagen · ≈ {(plan.deficit*30/KCAL_PER_KG).toFixed(2)} kg/Monat</div>
                </div>
                <div style={{maxHeight:220,overflowY:"auto"}}>
                  {plan.months.map(r=>(
                    <div key={r.n} className="row" style={{padding:"7px 2px",borderBottom:"1px solid var(--line)"}}>
                      <span className="sub">Monat {r.n}{r.done?" · Ziel ✓":""} <span style={{fontSize:11}}>(TDEE {r.t})</span></span>
                      <span className="num" style={{fontWeight:700,color:r.done?"var(--good)":"var(--ink)"}}>{r.w} kg</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Reverse-Planer */}
          <div className="card">
            <div className="lbl" style={{marginBottom:2}}>Reverse-Planer</div>
            <div className="sub" style={{marginBottom:14}}>Bis Datum X so viel wiegen — wie viel Defizit brauche ich?</div>
            <div className="lbl" style={{marginBottom:5}}>Aktuelles Gewicht (kg)</div>
            <input type="number" inputMode="decimal" placeholder={String(lastWeight(data)||(st?st.weight:"z.B. 90"))} value={rev.startWeight} onChange={e=>setRev(p=>({...p,startWeight:e.target.value}))} style={{marginBottom:10}}/>
            <div className="lbl" style={{marginBottom:5}}>Zielgewicht (kg)</div>
            <input type="number" inputMode="decimal" placeholder="z.B. 80" value={rev.targetWeight} onChange={e=>setRev(p=>({...p,targetWeight:e.target.value}))} style={{marginBottom:10}}/>
            <div className="lbl" style={{marginBottom:5}}>Deadline</div>
            <input type="date" value={rev.deadline} onChange={e=>setRev(p=>({...p,deadline:e.target.value}))}/>
            {(()=>{
              let sw=parseFloat(rev.startWeight);
              if(!sw){sw=lastWeight(data)||(st?st.weight:0);}
              const tw=parseFloat(rev.targetWeight);
              if(!sw||!tw||!rev.deadline)return null;
              const days=Math.ceil((new Date(rev.deadline)-NOW)/86400000);
              if(days<=0)return <div className="sub" style={{marginTop:10,color:"var(--amber)"}}>Die Deadline liegt in der Vergangenheit.</div>;
              if(tw>=sw)return <div className="sub" style={{marginTop:10,color:"var(--amber)"}}>Das Zielgewicht muss unter dem aktuellen liegen.</div>;
              const perDay=Math.round((sw-tw)*KCAL_PER_KG/days);
              let rating="Realistisch ✅",rc="var(--good)";
              if(perDay>1000){rating="Sehr ambitioniert — über 1000 kcal/Tag ⚠️";rc="var(--amber)";}
              else if(perDay>750){rating="Ambitioniert — über 750 kcal/Tag ⚡";rc="var(--amber)";}
              else if(perDay<300){rating="Sehr gemächlich 🐢";rc="var(--ink2)";}
              return(
                <div style={{marginTop:14,padding:14,borderRadius:16,background:"var(--accent-soft)"}}>
                  <div className="sub" style={{textAlign:"center",marginBottom:10}}>{(sw-tw).toFixed(1)} kg in {days} Tagen:</div>
                  {[["Pro Tag",perDay],["Pro Woche",perDay*7],["Pro Monat",perDay*30]].map(([l,v],i)=>(
                    <div key={l} className="row" style={{padding:"6px 0",borderBottom:i<2?"1px solid var(--line)":"none"}}>
                      <span className="sub">{l}</span>
                      <span className="num" style={{fontWeight:700}}>−{v} kcal</span>
                    </div>
                  ))}
                  <div style={{textAlign:"center",marginTop:10,fontWeight:600,fontSize:14,color:rc}}>{rating}</div>
                </div>
              );
            })()}
          </div>
        </div>
      )}
    </div>
  );
}

function DatenexportPage({data,mSet,setData,setMSet,setGoals,onClose}){
  const [msg,setMsg]=useState("");
  const fileRef=useRef();
  const exportData=()=>{
    const blob=new Blob([JSON.stringify({data,mSet,goals:load("tracker_goals",[]),products:loadProducts(),meals:loadMeals(),recipes:loadRecipes()},null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="vital-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();
    URL.revokeObjectURL(url);
  };
  const importData=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const p=JSON.parse(ev.target.result);
        if(p.data){setData(p.data);save("tracker_data",p.data);}
        if(p.mSet){setMSet(p.mSet);save("tracker_mset",p.mSet);}
        if(p.goals){setGoals(p.goals);save("tracker_goals",p.goals);}
        if(p.products)saveProductList(p.products);
        if(p.meals)saveMealList(p.meals);
        if(p.recipes)saveRecipeList(p.recipes);
        setMsg("Import erfolgreich ✓");
      }catch(err){setMsg("Import fehlgeschlagen — ist das eine VITAL-Backup-Datei?");}
    };
    r.readAsText(f);e.target.value="";
  };
  return(
    <Page onClose={onClose} title="Datenexport">
      <div className="card">
        <div className="lbl" style={{marginBottom:6}}>Daten sichern</div>
        <div className="sub" style={{marginBottom:14}}>Alles wird nur lokal auf deinem Gerät gespeichert — inkl. eigener Lebensmittel, Mahlzeiten und Rezepte. Exportiere regelmäßig ein Backup.</div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn" style={{flex:1}} onClick={exportData}>Exportieren</button>
          <button className="btn btn2" style={{flex:1}} onClick={()=>fileRef.current.click()}>Importieren</button>
          <input ref={fileRef} type="file" accept=".json" style={{display:"none"}} onChange={importData}/>
        </div>
        {msg&&<div className="sub" style={{marginTop:10,color:msg.includes("✓")?"var(--accent)":"var(--amber)"}}>{msg}</div>}
      </div>
    </Page>
  );
}

  const [q,setQ]=useState("");

    <CreateFoodFlow initial={editing.id?editing:blankFood()}
      onClose={()=>setEditing(null)}

            <div className="sub" style={{fontSize:12}}>{[p.brand,p.category,portionLabel(p)].filter(Boolean).join(" · ")} · {displayKcal(p)} kcal</div>

/* ===== EIGENE REZEPTE ===== */
function RecipeBuilderPage({initial,onSaved,onClose}){
  const [name,setName]=useState(initial?initial.name:"");
  const [servings,setServings]=useState(initial?String(initial.servings||1):"1");
  const [instructions,setInstructions]=useState(initial?initial.instructions||"":"");
  const [items,setItems]=useState(initial?initial.items:[]);
  const [q,setQ]=useState("");
  const [picking,setPicking]=useState(null);
  const [editIdx,setEditIdx]=useState(null);
  const [askLeave,setAskLeave]=useState(false);
  const products=loadProducts();
  const totals=mealTotals({items},products);
  const hits=products.filter(p=>matchesQuery(p,q)).slice(0,20);
  const dirty=name||items.length>0||instructions;
  const tryClose=()=>{if(dirty)setAskLeave(true);else onClose();};

  if(picking)return(
    <AmountPage product={picking} initial={editIdx!=null?items[editIdx]:null}
      confirmLabel={editIdx!=null?"Übernehmen":"Zum Rezept hinzufügen"}
      onBack={()=>{setPicking(null);setEditIdx(null);}} onClose={tryClose}
      onConfirm={entry=>{
        if(editIdx!=null)setItems(items.map((x,i)=>i===editIdx?entry:x));
        else setItems([...items,entry]);
        setPicking(null);setEditIdx(null);setQ("");
      }}/>
  );

  return(
    <React.Fragment>
      {askLeave&&<ConfirmDialog danger={false} confirmLabel="Verlassen"
        text="Möchtest du den Vorgang wirklich verlassen? Nicht gespeicherte Änderungen gehen verloren."
        onConfirm={onClose} onCancel={()=>setAskLeave(false)}/>}
      <Page onClose={tryClose} title={initial?"Rezept bearbeiten":"Neues Rezept"}
        footer={<button className="btn" style={{opacity:name&&items.length?1:.5}}
          onClick={()=>{if(name&&items.length){tapH();onSaved(saveRecipe({...(initial||{}),name,servings:parseInt(servings)||1,instructions,items}));}}}>Speichern</button>}>
        <div className="lbl" style={{marginBottom:5}}>Name des Rezepts</div>
        <input type="text" placeholder="z.B. Linsensuppe" value={name} onChange={e=>setName(e.target.value)} style={{marginBottom:14}}/>
        <div className="lbl" style={{marginBottom:5}}>Portionen</div>
        <NumField value={servings} onChange={setServings} suffix="Portionen"/>
        {items.length>0&&(
          <div className="card" style={{padding:"4px 14px",margin:"14px 0"}}>
            {items.map((it,i)=>{
              const p=products.find(x=>x.id===it.productId);
              if(!p)return null;
              const n=nutrientsFor(p,it.amount,it.unit);
              return(
                <div key={i} className="row" style={{padding:"10px 0",borderBottom:i<items.length-1?"1px solid var(--line)":"none"}} onClick={()=>{setEditIdx(i);setPicking(p);}}>
                  <span style={{fontSize:13}}>{p.name}</span>
                  <span className="num" style={{fontWeight:700}}>{n.kcal} kcal</span>
                </div>
              );
            })}
            <div className="row" style={{padding:"9px 0 2px"}}>
              <span className="lbl">Gesamt ({servings||1} Portion{servings==1?"":"en"})</span>
              <span className="num" style={{fontWeight:700,color:"var(--accent)"}}>{totals.kcal} kcal</span>
            </div>

/* Tages-DETAIL statt Tages-EINGABE: der Kalender ist die Historie, keine
   zweite Datenquelle. kcal/Makros/verbrannte Kalorien werden NICHT mehr
   manuell eingetippt — sie kommen automatisch aus den Mahlzeiten und
   Aktivitaeten, die genau dieselben Dialoge verwenden wie auf "Heute".
   Einzig das Gewicht laesst sich hier direkt bearbeiten (Punkt 3+4), alles
   andere fuehrt in die bestehenden Editoren fuer GENAU dieses Datum. */
/* Kompaktes Modal zum Gewicht-Eintragen — mit waehlbarem Datum (Standard
   heute). Laedt beim Datumswechsel automatisch das dort schon vorhandene
   Gewicht nach, damit man auch bequem einen vergangenen Tag nachtragen
   oder korrigieren kann, ohne extra ueber den Kalender zu gehen. */
/* Schnellster Weg, das heutige Gewicht einzutragen — bewusst ohne
   Datumsfeld (immer heute; vergangene Tage werden ausschliesslich ueber
   Verlauf -> Kalender bearbeitet) und ohne Speichern-Button: oeffnen,
   eintippen, fertig. Speichert automatisch bei "Fertig" auf der Tastatur
   oder wenn das Feld den Fokus verliert, und schliesst danach von selbst. */
/* Ruhiger Bestaetigungsdialog fuer "suspicious"-Gewichtseintraege. Zeigt
   ausschliesslich Fakten aus der Engine-Validierung an (neue Eingabe,
   letzter gueltiger Wert, Datum, Differenz) — berechnet selbst nichts. */
function WeightConfirmSheet({pending,onConfirm,onCorrect,onClose}){
  const {weight,validation,prevValid}=pending;
  const delta=validation.debug?validation.debug.deltaWeight:null;
  const contextText=validation.usageGapDetected
    ?"Seit deiner letzten Messung ist einige Zeit vergangen. Bitte prüfe kurz, ob der neue Wert korrekt ist."
    :"Dieser Wert unterscheidet sich deutlich von deiner letzten Messung.";
  return(
    <Sheet onClose={onClose} title="Gewicht kurz prüfen">
      <div className="row" style={{padding:"10px 0",borderBottom:"1px solid var(--line)"}}>
        <span className="sub">Neue Eingabe</span>

      {prevValid&&(
        <React.Fragment>
          <div className="row" style={{padding:"10px 0",borderBottom:"1px solid var(--line)"}}>
            <span className="sub">Letzter gültiger Wert</span>
            <span className="num" style={{fontWeight:700}}>{fmtNum(prevValid.weight,1)} kg</span>
          </div>
          <div className="row" style={{padding:"10px 0",borderBottom:"1px solid var(--line)"}}>
            <span className="sub">Datum der letzten Messung</span>

          </div>
          {delta!=null&&(
            <div className="row" style={{padding:"10px 0"}}>
              <span className="sub">Differenz</span>
              <span className="num" style={{fontWeight:700,color:"var(--amber)"}}>{delta>0?"+":""}{fmtNum(delta,1)} kg</span>
            </div>
          )}
        </React.Fragment>

      <div className="sub" style={{marginTop:14,lineHeight:1.6}}>{contextText}</div>
      {validation.shouldTreatAsNewAnchor&&(
        <div className="sub" style={{marginTop:8,lineHeight:1.6}}>Die Prognose startet nach der Bestätigung ab diesem Gewicht neu. Frühere Daten bleiben erhalten.</div>
      )}
      <button className="btn" style={{marginTop:20}} onClick={onConfirm}>Ja, Wert stimmt</button>
      <button className="btn btn2" style={{marginTop:8}} onClick={onCorrect}>Eingabe korrigieren</button>
    </Sheet>
  );
}

function WeightModal({data,onAttemptSave,onClose}){
  const y=NOW.getFullYear(),m=NOW.getMonth(),d=NOW.getDate();
  const existing=dayData(data,y,m,d);
  const [weight,setWeight]=useState(existing.weight?String(existing.weight):"");
  const [toast,setToast]=useState(false);
  const [errorMsg,setErrorMsg]=useState(null);
  const savedValRef=useRef(existing.weight?String(existing.weight):null);
  const closeTimerRef=useRef(null);

  const trySave=()=>{
    const v=parseNum(weight);
    if(v==null||v<=0)return null;
    if(String(v)===savedValRef.current)return null; // unveraendert, nicht erneut speichern
    tapH();
    const result=onAttemptSave(y,m,d,v);
    if(result.status==="valid"){
      savedValRef.current=String(v);
    } else if(result.status==="invalid"){
      setErrorMsg(result.message);
    }
    // "suspicious": das Bestaetigungs-Sheet auf App-Ebene uebernimmt ab hier
    return result;
  };
  const onFieldDone=()=>{
    setErrorMsg(null);
    const result=trySave();
    if(result&&result.status==="valid"){
      setToast(true);
      closeTimerRef.current=setTimeout(onClose,750);
    } else if(result&&result.status==="suspicious"){
      onClose(); // Bestaetigungs-Sheet uebernimmt, dieses Modal wird nicht mehr gebraucht
    }
  };
  /* Falls per X oder Wisch-Geste geschlossen wird, ohne dass das Feld
     vorher den Fokus verloren hat, trotzdem versuchen zu speichern statt
     Eingabe zu verwerfen — bei "suspicious" oeffnet sich dabei ganz normal
     die Bestaetigung. */
  const handleClose=()=>{
    if(closeTimerRef.current)clearTimeout(closeTimerRef.current);
    trySave();
    onClose();
  };
  return(
    <Sheet onClose={handleClose} title="Gewicht heute">
      <NumField value={weight} onChange={v=>{setWeight(v);setErrorMsg(null);}} placeholder="z.B. 84.2" suffix="kg" autoFocus onEnterOrBlur={onFieldDone}/>
      {errorMsg&&<div style={{marginTop:10,fontSize:13,fontWeight:600,color:"#C0453E"}}>{errorMsg}</div>}
      <div style={{maxHeight:toast?26:0,opacity:toast?1:0,overflow:"hidden",transition:"all .3s cubic-bezier(.32,.72,.28,1)",marginTop:toast?12:0}}>
        <div style={{fontSize:13,fontWeight:600,color:"var(--accent)",display:"flex",alignItems:"center",gap:6}}>
          <span style={{width:18,height:18,borderRadius:99,background:"var(--accent)",color:"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:11}}>✓</span>
          Gewicht gespeichert
        </div>
      </div>
    </Sheet>
  );
}

/* Eigenstaendiges Eingabefeld fuer das Tagesgewicht — nutzt die bereits
   bewaehrte NumField-Komponente direkt (type="text"+inputMode="decimal",
   auf iOS zuverlaessiger als type="number"), keine eigene Parallel-
   Implementierung. Der lokale State wird NUR beim Mounten aus "initial"
   gelesen und danach nie wieder von aussen ueberschrieben — kein
   useEffect, der bei jedem Render den Ausgangswert zuruecksetzen koennte.
   Ueber den key auf der aeusseren Komponente (siehe DayDetailSheet)
   bekommt jedes Datum garantiert eine frische Instanz. */
function InlineWeightField({initial,onSave}){
  const [val,setVal]=useState(initial);
  const [saved,setSaved]=useState(false);
  const [errorMsg,setErrorMsg]=useState(null);
  const lastSavedRef=useRef(initial); // verhindert doppeltes Speichern desselben Werts
  const numVal=parseNum(val);
  const doSave=()=>{
    setErrorMsg(null);
    if(numVal==null||numVal<=0)return;         // leeres/ungueltiges Feld speichert nichts
    if(String(numVal)===lastSavedRef.current)return; // unveraendert -> kein erneutes Speichern
    tapH();
    const result=onSave(numVal);
    if(result&&result.status==="valid"){
      lastSavedRef.current=String(numVal);
      setSaved(true);
      setTimeout(()=>setSaved(false),1400);
    } else if(result&&result.status==="invalid"){
      setErrorMsg(result.message);
    }
    // "suspicious": das Bestaetigungs-Sheet auf App-Ebene uebernimmt ab hier
  };
  return(
    <div>
      <NumField value={val} onChange={v=>{setVal(v);setErrorMsg(null);}} placeholder="z.B. 84.2" suffix="kg" autoFocus onEnterOrBlur={doSave}/>
      {errorMsg&&<div style={{marginTop:8,fontSize:12,fontWeight:600,color:"#C0453E"}}>{errorMsg}</div>}
      {/* Kein Speichern-Button mehr — speichert automatisch bei "Fertig"
          auf der Tastatur oder sobald das Feld den Fokus verliert. Kurzes
          Erfolgs-Feedback statt kommentarlos einfach nichts zu tun. */}
      <div style={{maxHeight:saved?24:0,opacity:saved?1:0,overflow:"hidden",transition:"all .3s cubic-bezier(.32,.72,.28,1)",marginTop:saved?8:0}}>
        <div style={{fontSize:12,fontWeight:600,color:"var(--accent)",display:"flex",alignItems:"center",gap:5}}>
          <span style={{width:16,height:16,borderRadius:99,background:"var(--accent)",color:"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:10}}>✓</span>
          Gewicht gespeichert
        </div>
      </div>
    </div>
  );
}
