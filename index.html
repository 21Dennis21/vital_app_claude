function ActivitySheet({date,data,editIndex,onSave,onDelete,onClose}){
  const {y,m,d}=date;
  const x=dayData(data,y,m,d);
  const existing=editIndex!=null?(x.sports||[])[editIndex]:null;
  const [f,setF]=useState(existing?{
    type:existing.type,
    km:existing.km!=null?String(existing.km):"",
    unit:existing.unit||"km",
    hours:existing.hours!=null?String(existing.hours):"",
    minutes:existing.minutes!=null?String(existing.minutes):"",
    kcal:existing.kcal!=null?String(existing.kcal):"",
  }:{type:"bike",km:"",unit:"km",hours:"",minutes:"",kcal:""});
  const isGym=f.type==="gym";
  const hasDistTime=isGym?(parseFloat(f.hours)||0)+(parseFloat(f.minutes)||0)>0:parseFloat(f.km)>0;
  const hasKcal=(parseFloat(f.kcal)||0)>0;
  const valid=hasDistTime||hasKcal; // Distanz ODER Kalorien reicht zum Speichern
  const saveIt=()=>{
    if(!valid)return;
    const raw=parseFloat(f.km)||0;
    const item=isGym
      ?{type:"gym",hours:parseFloat(f.hours)||0,minutes:parseFloat(f.minutes)||0,kcal:parseFloat(f.kcal)||0}
      :{type:f.type,km:Math.round((f.unit==="mi"?raw*1.60934:raw)*100)/100,unit:"km",kcal:parseFloat(f.kcal)||0};
    tapH();
    onSave({y,m,d},item,editIndex);
  };
  return(
    <Sheet onClose={onClose} title={editIndex!=null?"Aktivität bearbeiten":"Aktivität hinzufügen"}>
      <div className="lbl" style={{marginBottom:5}}>Sportart</div>
      <select value={f.type} onChange={e=>setF(p=>({...p,type:e.target.value}))} style={{marginBottom:12}}>
        {SPORTS.map(sp=><option key={sp.key} value={sp.key}>{sp.icon} {sp.label}</option>)}
      </select>
      {isGym?(
        <div style={{marginBottom:12}}>
          <div className="lbl" style={{marginBottom:5}}>Dauer</div>
          <div style={{display:"flex",gap:8}}>
            <input type="number" inputMode="numeric" placeholder="Stunden" value={f.hours} onChange={e=>setF(p=>({...p,hours:e.target.value}))}/>
            <input type="number" inputMode="numeric" placeholder="Minuten" value={f.minutes} onChange={e=>setF(p=>({...p,minutes:e.target.value}))}/>
          </div>
        </div>
      ):(
        <div style={{marginBottom:12}}>
          <div className="lbl" style={{marginBottom:5}}>Distanz</div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <input type="number" inputMode="decimal" placeholder="z.B. 8.5" value={f.km} onChange={e=>setF(p=>({...p,km:e.target.value}))} style={{flex:1}}/>
            {["km","mi"].map(u=>(
              <button key={u} className={"pill"+((f.unit||"km")===u?" on":"")} style={{padding:"12px 14px"}} onClick={()=>setF(p=>({...p,unit:u}))}>{u}</button>
            ))}
          </div>
        </div>
      )}
      <div style={{marginBottom:16}}>
        <div className="lbl" style={{marginBottom:5}}>Kalorien verbrannt</div>
        <input type="number" inputMode="numeric" placeholder="z.B. 350" value={f.kcal} onChange={e=>setF(p=>({...p,kcal:e.target.value}))}/>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:8}}>
        <button className="btn btn2" style={{flex:1}} onClick={onClose}>Abbrechen</button>
        <button className="btn" style={{flex:1,opacity:valid?1:.5}} onClick={saveIt}>Speichern</button>
      </div>
      {editIndex!=null&&<button className="btn btn-danger" onClick={()=>{tapH();onDelete({y,m,d},editIndex);}}>Aktivität löschen</button>}
    </Sheet>
  );
}

/* Kamera-Barcode-Scanner. Nutzt ZXing statt der nativen Browser-API, weil
   Safari/iOS die eingebaute BarcodeDetector-API nicht unterstuetzt — ZXing
   erkennt den Code direkt aus dem Kamerabild und funktioniert dadurch auch
   auf dem iPhone zuverlässig. Kamera wird beim Verlassen sauber gestoppt. */
function BarcodeScanSheet({onDetected,onSkip,onClose}){
  const videoRef=useRef();
  const [error,setError]=useState("");
  useEffect(()=>{
    let controls=null,stopped=false;
    (async()=>{
      try{
        /* Nur die Barcode-Formate suchen, die auf Lebensmitteln vorkommen
           (statt allen 1D/2D-Formaten) -> jedes Kamerabild wird schneller
           ausgewertet, was v.a. bei kleineren/entfernteren Codes hilft.
           TRY_HARDER laesst den Decoder pro Bild etwas gruendlicher suchen. */
        const {DecodeHintType,BarcodeFormat}=window.ZXing||{};
        let hints;
        if(DecodeHintType&&BarcodeFormat){
          hints=new Map();
          hints.set(DecodeHintType.POSSIBLE_FORMATS,[
            BarcodeFormat.EAN_13,BarcodeFormat.EAN_8,
            BarcodeFormat.UPC_A,BarcodeFormat.UPC_E,BarcodeFormat.CODE_128,
          ]);
          hints.set(DecodeHintType.TRY_HARDER,true);
        }
        const reader=new ZXingBrowser.BrowserMultiFormatReader(hints);
        const onResult=(result)=>{
          if(result&&!stopped){stopped=true;tapH();controls&&controls.stop();onDetected(result.getText());}
        };
        /* facingMode als HARTER Zwang (exact) statt nur Wunsch (ideal):
           "ideal" darf der Browser ignorieren, "exact" nicht — erzwingt
           also wirklich die Rueckkamera statt sie nur vorzuschlagen.
           Anfrage bewusst einfach gehalten (nur facingMode + Aufloesung,
           ohne focusMode/advanced), weil zu viele gleichzeitige Wuensche
           auf Safari manchmal dazu fuehren, dass die komplette Anfrage
           verworfen und irgendeine Kamera genommen wird. Falls "exact"
           auf einem Geraet ganz ohne Rueckkamera fehlschlaegt, faellt die
           App auf "ideal" und zuletzt auf irgendeine Kamera zurueck. */
        try{
          controls=await reader.decodeFromConstraints(
            {video:{facingMode:{exact:"environment"},width:{ideal:1920},height:{ideal:1080}}},
            videoRef.current,onResult);
        }catch(e1){
          try{
            controls=await reader.decodeFromConstraints(
              {video:{facingMode:{ideal:"environment"}}},videoRef.current,onResult);
          }catch(e2){
            controls=await reader.decodeFromConstraints({video:true},videoRef.current,onResult);
          }
        }
      }catch(e){setError("Kamera-Zugriff nicht möglich — bitte in den Einstellungen erlauben.");}
    })();
    return()=>{stopped=true;controls&&controls.stop();};
  },[]);
  return(
    <div style={{position:"fixed",inset:0,background:"#000",zIndex:200,display:"flex",flexDirection:"column"}}>
      <video ref={videoRef} style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}} muted playsInline/>
      {/* Abgedunkelte Ecken, heller Scan-Ausschnitt in der Mitte — klassisches Scanner-Overlay */}
      <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.45)",WebkitMaskImage:"linear-gradient(#000 0 0)"}}>
        <div style={{position:"absolute",top:"32%",left:"8%",right:"8%",height:"26%",border:"3px solid #fff",borderRadius:16,boxShadow:"0 0 0 2000px rgba(0,0,0,.45)"}}/>
      </div>
      <div style={{position:"relative",paddingTop:"calc(18px + env(safe-area-inset-top))",padding:"calc(18px + env(safe-area-inset-top)) 20px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <button onClick={onClose} style={{width:38,height:38,borderRadius:99,background:"rgba(255,255,255,.15)",border:"none",color:"#fff",fontSize:18}}>✕</button>
        <div style={{color:"#fff",fontWeight:600,fontSize:15}}>Barcode scannen</div>
        <div style={{width:38}}/>
      </div>
      <div style={{marginTop:"auto",padding:"0 24px calc(28px + env(safe-area-inset-bottom))",position:"relative"}}>
        {error&&<div style={{color:"var(--amber)",textAlign:"center",marginBottom:14,fontSize:13,background:"rgba(0,0,0,.5)",padding:10,borderRadius:12}}>{error}</div>}
        <div style={{color:"rgba(255,255,255,.8)",textAlign:"center",marginBottom:16,fontSize:13}}>Halte den Barcode ins Kamerabild.</div>
        <button className="btn btn2" style={{background:"rgba(255,255,255,.15)",color:"#fff"}} onClick={onSkip}>Ohne Barcode eingeben</button>
      </div>
    </div>
  );
}

/* Such-/Hinzufuegen-Dialog fuer eine Mahlzeit. Schritte in einem Sheet:
   1) suchen (in der eigenen Produktliste) oder neues Produkt anlegen
      -> neues Produkt startet IMMER mit Barcode-Scan (oder ueberspringen)
   2) Formular mit Naehrwerten (falls Barcode unbekannt / uebersprungen)
   3) Menge in Gramm eingeben, kcal/Makros werden live hochgerechnet
   4) Hinzufuegen -> landet in der gewaehlten Mahlzeit des Tages
   Aktuell lokal (tracker_products); sobald Supabase angebunden ist, wird nur
   die Datenquelle dieser Suche ausgetauscht, der Rest bleibt gleich. */
/* Uebersicht einer Mahlzeit: zeigt alle heute bereits eingetragenen
   Lebensmittel dieser Mahlzeit inkl. Gesamt-Naehrwerte, mit Moeglichkeit
   einzelne Eintraege zu entfernen oder weitere hinzuzufuegen. */
function MealDetailSheet({mealLabel,items,onRemoveItem,onAddMore,onClose}){
  const totalKcal=items.reduce((s,it)=>s+(it.kcal||0),0);
  const totalCarbs=Math.round(items.reduce((s,it)=>s+(it.carbs||0),0)*10)/10;
  const totalProtein=Math.round(items.reduce((s,it)=>s+(it.protein||0),0)*10)/10;
  const totalFat=Math.round(items.reduce((s,it)=>s+(it.fat||0),0)*10)/10;
  return(
    <Page onClose={onClose} title={mealLabel}>
      <div style={{textAlign:"center",marginBottom:20}}>
        <div className="num" style={{fontSize:38,fontWeight:700}}>{totalKcal}</div>
        <div className="sub" style={{marginBottom:8}}>kcal insgesamt</div>
        <div style={{display:"flex",justifyContent:"center",gap:14,fontSize:12}}>
          <span className="sub">KH {totalCarbs}g</span>
          <span className="sub">Eiweiß {totalProtein}g</span>
          <span className="sub">Fett {totalFat}g</span>
        </div>
      </div>
      {items.length===0&&<div className="sub" style={{textAlign:"center",padding:"20px 0"}}>Noch nichts eingetragen.</div>}
      {items.map((it,i)=>(
        <div key={it.id||i} className="row" style={{padding:"12px 4px",borderBottom:i<items.length-1?"1px solid var(--line)":"none"}}>
          <div>
            <div style={{fontWeight:600,fontSize:14}}>{it.name}</div>
            <div className="sub" style={{fontSize:11}}>{fmtNum(it.amount,0)} {it.unit==="ml"?"ml":it.unit==="piece"?"Stück":it.unit==="portion"?"Portion":"g"} · KH {fmtNum(it.carbs||0)}g · Eiweiß {fmtNum(it.protein||0)}g · Fett {fmtNum(it.fat||0)}g</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
            <span className="num" style={{fontWeight:700}}>{it.kcal} kcal</span>
            <button onClick={()=>{tapH();onRemoveItem(i);}} style={{width:26,height:26,borderRadius:99,background:"rgba(192,69,62,.1)",border:"1px solid rgba(192,69,62,.3)",color:"#C0453E",fontSize:12,flexShrink:0}}>✕</button>
          </div>
        </div>
      ))}
      <button className="btn" style={{marginTop:20}} onClick={onAddMore}>＋ Weiteres Lebensmittel hinzufügen</button>
    </Page>
  );
}

/* Leeres Lebensmittel-Formular — Naehrwertfelder werden aus NUT_ALL erzeugt,
   damit Formular und Datenmodell nie auseinanderlaufen. */
function blankFood(){
  const o={id:null,name:"",brand:"",barcode:"",category:"",basis:"100g",
    portionName:"",portionSize:"",packageSize:"",portionsPerPackage:"",usLabel:false};
  NUT_ALL.forEach(n=>o[n.k]="");
  return o;
}
const BASIS_OPTS=[{k:"100g",l:"100 g"},{k:"100ml",l:"100 ml"},{k:"portion",l:"Portion"},{k:"piece",l:"Stück"}];

/* ===== Mengenansicht: Einheit waehlen, Menge eingeben, Werte live ===== */
function AmountPage({product,initial,notice,onBack,onClose,onConfirm,confirmLabel="Hinzufügen"}){
  const opts=servingOptions(product);
  const [unit,setUnit]=useState(initial?initial.unit:opts[0].key);
  const [amount,setAmount]=useState(initial?String(initial.amount):(opts[0].key==="g"||opts[0].key==="ml"?"100":"1"));
  const n=nutrientsFor(product,amount,unit);
  const valid=(parseNum(amount)||0)>0;
  return(
    <Page onBack={onBack} onClose={onClose} title={product.name}
      footer={<button className="btn" style={{opacity:valid?1:.5}} onClick={()=>{if(valid){tapH();onConfirm({productId:product.id,amount:parseNum(amount),unit});}}}>{confirmLabel}</button>}>
      {(product.brand||product.category)&&<div className="sub" style={{marginTop:-8,marginBottom:16}}>{[product.brand,product.category].filter(Boolean).join(" · ")}</div>}
      {notice&&<div style={{padding:"12px 14px",borderRadius:14,background:"var(--amber-soft)",color:"var(--amber)",fontSize:13,fontWeight:500,marginBottom:16}}>{notice}</div>}
      <div className="lbl" style={{marginBottom:6}}>Einheit</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat("+opts.length+",1fr)",gap:6,marginBottom:14}}>
        {opts.map(o=><button key={o.key} className={"pill"+(unit===o.key?" on":"")} onClick={()=>setUnit(o.key)}>{o.label}</button>)}
      </div>
      <div className="lbl" style={{marginBottom:6}}>Menge</div>
      <NumField value={amount} onChange={setAmount} suffix={(opts.find(o=>o.key===unit)||{}).label}/>
      <div style={{padding:16,borderRadius:18,background:"var(--accent-soft)",margin:"18px 0"}}>
        <div className="row" style={{marginBottom:10}}>
          <span className="lbl">Kalorien</span>
          <span className="num" style={{fontSize:22,fontWeight:700,color:"var(--accent)"}}>{n.kcal} kcal</span>
        </div>
        <div style={{display:"flex",gap:16,fontSize:12}}>
          <span className="sub">KH {fmtNum(n.carbs)}g</span>
          <span className="sub">Eiweiß {fmtNum(n.protein)}g</span>
          <span className="sub">Fett {fmtNum(n.fat)}g</span>
        </div>
      </div>
    </Page>
  );
}

/* ===== 4-Schritt-Assistent zum Anlegen/Bearbeiten eines Lebensmittels ===== */
function CreateFoodFlow({initial,onSaved,onClose}){
  const [step,setStep]=useState(1);
  const [f,setF]=useState(()=>initial?{...blankFood(),...initial}:blankFood());
  const [catQ,setCatQ]=useState("");
  const [showFat,setShowFat]=useState(false);
  const [showVit,setShowVit]=useState(false);
  const [showMin,setShowMin]=useState(false);
  const [askLeave,setAskLeave]=useState(false);
  const [dupErr,setDupErr]=useState("");
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const dirty=f.name||f.brand||f.category||NUT_MAIN.some(n=>f[n.k]!=="");
  const tryClose=()=>{if(dirty)setAskLeave(true);else onClose();};

  const step1ok=f.name.trim()&&f.brand.trim();
  const step2ok=!!f.category;
  const step4ok=NUT_MAIN.every(n=>parseNum(f[n.k])!=null);

  const doSave=()=>{
    if(!step4ok)return;
    /* Doppelte Barcodes verhindern — ausser es ist derselbe Eintrag */
    if(f.barcode){
      const other=findProductByBarcode(f.barcode);
      if(other&&other.id!==f.id){setDupErr("Dieser Barcode ist bereits vergeben ("+other.name+").");return;}
    }
    const clean={...f};
    NUT_ALL.forEach(n=>{const v=parseNum(clean[n.k]);clean[n.k]=v==null?null:v;});
    ["portionSize","packageSize","portionsPerPackage"].forEach(k=>{const v=parseNum(clean[k]);clean[k]=v==null?null:v;});
    tapH();
    onSaved(saveProduct(clean));
  };

  const nextBtn=(ok,onNext,label="Weiter")=>(
    <button className="btn" style={{opacity:ok?1:.5}} onClick={()=>{if(ok){tapH();onNext();}}}>{label}</button>
  );

  const cats=FOOD_CATEGORIES.filter(c=>c.label.toLowerCase().includes(catQ.toLowerCase()));
  const basisLabel=(BASIS_OPTS.find(b=>b.k===f.basis)||{}).l;

  const nutGroup=(list,cols)=>(
    <div style={{display:"grid",gridTemplateColumns:cols||"1fr",gap:10,marginBottom:10}}>
      {list.map(n=>(
        <div key={n.k}>
          <div className="lbl" style={{marginBottom:5}}>{n.l}{n.req&&<span style={{color:"var(--amber)"}}> *</span>}</div>
          <NumField value={f[n.k]} onChange={v=>set(n.k,v)} suffix={n.u}/>
        </div>
      ))}
    </div>
  );

  return(
    <React.Fragment>
      {askLeave&&<ConfirmDialog danger={false} confirmLabel="Verlassen"
        text="Möchtest du den Vorgang wirklich verlassen? Nicht gespeicherte Änderungen gehen verloren."
        onConfirm={onClose} onCancel={()=>setAskLeave(false)}/>}

      {step===1&&(
        <Page onClose={tryClose} title="Schritt 1 von 4" footer={nextBtn(step1ok,()=>setStep(2))}>
          <div style={{fontSize:22,fontWeight:700,marginBottom:18}}>Wie heißt das Lebensmittel?</div>
          {f.barcode&&<div className="sub" style={{marginBottom:14}}>Barcode: {f.barcode}</div>}
          <div style={{marginBottom:14}}>
            <div className="lbl" style={{marginBottom:5}}>Name<span style={{color:"var(--amber)"}}> *</span></div>
            <input type="text" autoFocus placeholder="z.B. Vollkorn-Haferflocken" value={f.name} onChange={e=>set("name",e.target.value)}/>
          </div>
          <div>
            <div className="lbl" style={{marginBottom:5}}>Marke<span style={{color:"var(--amber)"}}> *</span></div>
            <input type="text" placeholder="z.B. Alnatura" value={f.brand} onChange={e=>set("brand",e.target.value)}/>
          </div>
        </Page>
      )}

      {step===2&&(
        <Page onBack={()=>setStep(1)} onClose={tryClose} title="Schritt 2 von 4"
          footer={nextBtn(step2ok,()=>setStep(3))}>
          <div style={{fontSize:22,fontWeight:700,marginBottom:14}}>Kategorie</div>
          <input type="text" placeholder="Kategorie suchen" value={catQ} onChange={e=>setCatQ(e.target.value)} style={{marginBottom:14}}/>
          {cats.map(c=>(
            <button key={c.label} className="foodrow" onClick={()=>{tapH();set("category",c.label);}}
              style={{borderColor:f.category===c.label?"var(--accent)":"transparent",background:f.category===c.label?"var(--accent-soft)":"var(--card2)"}}>
              <div style={{display:"flex",alignItems:"center",gap:12}}>
                <span style={{fontSize:20}}>{c.icon}</span>
                <span style={{fontWeight:500,fontSize:14}}>{c.label}</span>
              </div>
              {f.category===c.label&&<span style={{color:"var(--accent)",fontWeight:700}}>✓</span>}
            </button>
          ))}
        </Page>
      )}

      {step===3&&(
        <Page onBack={()=>setStep(2)} onClose={tryClose} title="Schritt 3 von 4"
          footer={nextBtn(true,()=>setStep(4))}>
          <div style={{fontSize:22,fontWeight:700,marginBottom:6}}>Portionen</div>
          <div className="sub" style={{marginBottom:18}}>Worauf beziehen sich die Nährwerte, die du gleich einträgst?</div>
          <div className="lbl" style={{marginBottom:6}}>Die Nährwerte gelten pro</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:6,marginBottom:18}}>
            {BASIS_OPTS.map(b=><button key={b.k} className={"pill"+(f.basis===b.k?" on":"")} onClick={()=>set("basis",b.k)}>{b.l}</button>)}
          </div>
          <div className="sub" style={{marginBottom:10,fontWeight:600}}>Portionsangaben (optional)</div>
          <div style={{marginBottom:10}}>
            <div className="lbl" style={{marginBottom:5}}>Portionsname</div>
            <input type="text" placeholder="z.B. Riegel, Scheibe, Glas" value={f.portionName} onChange={e=>set("portionName",e.target.value)}/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            <div>
              <div className="lbl" style={{marginBottom:5}}>Portionsgröße</div>
              <NumField value={f.portionSize} onChange={v=>set("portionSize",v)} suffix={f.basis==="100ml"?"ml":"g"}/>
            </div>
            <div>
              <div className="lbl" style={{marginBottom:5}}>Verpackungsgröße</div>
              <NumField value={f.packageSize} onChange={v=>set("packageSize",v)} suffix={f.basis==="100ml"?"ml":"g"}/>
            </div>
          </div>
          <div>
            <div className="lbl" style={{marginBottom:5}}>Portionen pro Verpackung</div>
            <NumField value={f.portionsPerPackage} onChange={v=>set("portionsPerPackage",v)}/>
          </div>
        </Page>
      )}

      {step===4&&(
        <Page onBack={()=>setStep(3)} onClose={tryClose} title="Schritt 4 von 4"
          footer={<React.Fragment>
            {dupErr&&<div className="sub" style={{color:"var(--amber)",marginBottom:8}}>{dupErr}</div>}
            <button className="btn" style={{opacity:step4ok?1:.5}} onClick={doSave}>Speichern</button>
          </React.Fragment>}>
          <div style={{fontSize:22,fontWeight:700,marginBottom:14}}>Nährwertangaben</div>
          <div className="row" style={{padding:"12px 14px",borderRadius:14,background:"var(--card2)",marginBottom:12}}>
            <span style={{fontSize:14,fontWeight:600}}>US Nutrition Label</span>
            <button onClick={()=>{const on=!f.usLabel;setF(p=>({...p,usLabel:on,basis:on?"portion":"100g"}));}}
              style={{width:48,height:28,borderRadius:99,border:"none",background:f.usLabel?"var(--accent)":"var(--ink3)",position:"relative",cursor:"pointer",transition:"background .2s"}}>
              <span style={{position:"absolute",top:3,left:f.usLabel?23:3,width:22,height:22,borderRadius:99,background:"#fff",transition:"left .2s"}}/>
            </button>
          </div>
          <div className="sub" style={{marginBottom:14}}>
            {f.usLabel?"US-Etiketten geben Werte pro Portion an — die Basis wurde entsprechend umgestellt.":"Werte pro "+basisLabel}
          </div>
          {nutGroup(NUT_MAIN)}
          <button className="btn btn2" style={{marginBottom:10}} onClick={()=>setShowFat(!showFat)}>{showFat?"Weniger anzeigen":"Alle anzeigen"}</button>
          {showFat&&nutGroup(NUT_FAT_EXTRA)}
          <div className="sub" style={{margin:"18px 0 8px",fontWeight:600}}>Vitamine (optional)</div>
          {nutGroup(NUT_VIT_BASE,"1fr 1fr")}
          <button className="btn btn2" style={{marginBottom:10}} onClick={()=>setShowVit(!showVit)}>{showVit?"Weniger anzeigen":"Alle anzeigen"}</button>
          {showVit&&nutGroup(NUT_VIT_MORE,"1fr 1fr")}
          <div className="sub" style={{margin:"18px 0 8px",fontWeight:600}}>Mineralstoffe (optional)</div>
          {nutGroup(NUT_MIN_BASE,"1fr 1fr")}
          <button className="btn btn2" style={{marginBottom:10}} onClick={()=>setShowMin(!showMin)}>{showMin?"Weniger anzeigen":"Alle anzeigen"}</button>
          {showMin&&nutGroup(NUT_MIN_MORE,"1fr 1fr")}
          <div className="sub" style={{margin:"18px 0 8px",fontWeight:600}}>Sonstiges (optional)</div>
          {nutGroup(NUT_OTHER,"1fr 1fr")}
          <div className="sub" style={{marginTop:12}}>* Pflichtfeld</div>
        </Page>
      )}
    </React.Fragment>
  );
}

/* ===== Baukasten fuer eigene Mahlzeiten ===== */
function MealBuilderPage({initial,onSaved,onClose}){
  const [name,setName]=useState(initial?initial.name:"");
  const [items,setItems]=useState(initial?initial.items:[]);
  const [q,setQ]=useState("");
  const [picking,setPicking]=useState(null);   // Produkt fuer Mengeneingabe
  const [editIdx,setEditIdx]=useState(null);   // Bestandteil bearbeiten
  const [dupFound,setDupFound]=useState(false); // true nur wenn ueber Suche ein Duplikat erkannt wurde
  const [askLeave,setAskLeave]=useState(false);
  const products=loadProducts();
  const totals=mealTotals({items},products);
  const hits=products.filter(p=>matchesQuery(p,q)).slice(0,20);
  const dirty=name||items.length>0;
  const tryClose=()=>{if(dirty)setAskLeave(true);else onClose();};
  const move=(i,dir)=>{
    const j=i+dir;if(j<0||j>=items.length)return;
    const next=[...items];const t=next[i];next[i]=next[j];next[j]=t;setItems(next);
  };

  if(picking)return(
    <AmountPage product={picking} initial={editIdx!=null?items[editIdx]:null}
      notice={dupFound?"Dieses Lebensmittel ist bereits in der Mahlzeit — Menge anpassen.":null}
      confirmLabel={editIdx!=null?"Übernehmen":"Zur Mahlzeit hinzufügen"}
      onBack={()=>{setPicking(null);setEditIdx(null);setDupFound(false);}} onClose={tryClose}
      onConfirm={entry=>{
        if(editIdx!=null)setItems(items.map((x,i)=>i===editIdx?entry:x));
        else setItems([...items,entry]);
        setPicking(null);setEditIdx(null);setDupFound(false);setQ("");
      }}/>
  );

  return(
    <React.Fragment>
      {askLeave&&<ConfirmDialog danger={false} confirmLabel="Verlassen"
        text="Möchtest du den Vorgang wirklich verlassen? Nicht gespeicherte Änderungen gehen verloren."
        onConfirm={onClose} onCancel={()=>setAskLeave(false)}/>}
      <Page onClose={tryClose} title={initial?"Mahlzeit bearbeiten":"Neue Mahlzeit"}
        footer={<button className="btn" style={{opacity:name&&items.length?1:.5}}
          onClick={()=>{if(name&&items.length){tapH();onSaved(saveMealPreset({...(initial||{}),name,items}));}}}>Speichern</button>}>
        <div className="lbl" style={{marginBottom:5}}>Name der Mahlzeit</div>
        <input type="text" placeholder="z.B. Eier mit Bacon" value={name} onChange={e=>setName(e.target.value)} style={{marginBottom:16}}/>
        {items.length>0&&(
          <div className="card" style={{padding:"4px 14px",marginBottom:16}}>
            {items.map((it,i)=>{
              const p=products.find(x=>x.id===it.productId);
              if(!p)return null;
              const n=nutrientsFor(p,it.amount,it.unit);
              const unitLabel=(servingOptions(p).find(o=>o.key===it.unit)||{}).label||"";
              return(
                <div key={i} className="row" style={{padding:"10px 0",borderBottom:i<items.length-1?"1px solid var(--line)":"none"}}>
                  <div style={{flex:1,minWidth:0}} onClick={()=>{setEditIdx(i);setDupFound(false);setPicking(p);}}>
                    <div style={{fontSize:13,fontWeight:600}}>{p.name}</div>
                    <div className="sub" style={{fontSize:11}}>{fmtNum(it.amount,0)} {unitLabel} · {n.kcal} kcal</div>
                  </div>
                  <div style={{display:"flex",gap:4,flexShrink:0}}>
                    <button onClick={()=>move(i,-1)} style={{width:26,height:26,borderRadius:8,background:"var(--card2)",border:"none",color:"var(--ink2)"}}>↑</button>
                    <button onClick={()=>move(i,1)} style={{width:26,height:26,borderRadius:8,background:"var(--card2)",border:"none",color:"var(--ink2)"}}>↓</button>
                    <button onClick={()=>setItems(items.filter((_,j)=>j!==i))} style={{width:26,height:26,borderRadius:8,background:"rgba(192,69,62,.1)",border:"1px solid rgba(192,69,62,.3)",color:"#C0453E",fontSize:11}}>✕</button>
                  </div>
                </div>
              );
            })}
            <div className="row" style={{padding:"10px 0 6px",borderTop:"1px solid var(--line)"}}>
              <span className="lbl">Gesamt</span>
              <span className="num" style={{fontWeight:700,color:"var(--accent)"}}>{totals.kcal} kcal</span>
            </div>
            <div style={{display:"flex",gap:14,paddingBottom:8}}>
              <span className="sub" style={{fontSize:11}}>KH {fmtNum(totals.carbs)}g</span>
              <span className="sub" style={{fontSize:11}}>Eiweiß {fmtNum(totals.protein)}g</span>
              <span className="sub" style={{fontSize:11}}>Fett {fmtNum(totals.fat)}g</span>
            </div>
          </div>
        )}
        <div className="lbl" style={{marginBottom:5}}>Lebensmittel hinzufügen</div>
        <input type="text" placeholder="Lebensmittel suchen" value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:10}}/>
        {q&&hits.length===0&&<div className="sub" style={{textAlign:"center",padding:"12px 0"}}>Nichts gefunden.</div>}
        {q&&hits.map(p=>(
          <button key={p.id} className="foodrow" onClick={()=>{
            const dupIdx=items.findIndex(it=>it.productId===p.id);
            setEditIdx(dupIdx>-1?dupIdx:null);
            setDupFound(dupIdx>-1);
            setPicking(p);
          }}>
            <div>
              <div style={{fontWeight:600,fontSize:14}}>{p.name}</div>
              <div className="sub" style={{fontSize:12}}>{[p.brand,portionLabel(p)].filter(Boolean).join(" · ")} · {displayKcal(p)} kcal</div>
            </div>
            <div style={{width:44,height:44,borderRadius:99,background:"var(--accent)",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,fontWeight:700,flexShrink:0,boxShadow:"0 4px 12px rgba(0,0,0,.18)"}}>+</div>
          </button>
        ))}
      </Page>
    </React.Fragment>
  );
}

/* ===== Hauptseite: Suche / Barcode / Lebensmittel hinzufügen ===== */
function FoodSearchSheet({mealLabel,mealPlaceholder,existingItems,onAdd,onClose}){
  const [tab,setTab]=useState("search");        // search | barcode | create
  const [query,setQuery]=useState("");
  const [typeFilter,setTypeFilter]=useState("all");   // all | food | meal
  const [quick,setQuick]=useState("");               // "" | fav | often | recent
  const [catPick,setCatPick]=useState("");
  const [showCatPicker,setShowCatPicker]=useState(false);
  const [amountFor,setAmountFor]=useState(null);
  const [dupExisting,setDupExisting]=useState(null); // bereits vorhandener Eintrag, falls Duplikat erkannt
  const [createFor,setCreateFor]=useState(null);     // {barcode} zum Anlegen
  const [mealBuilder,setMealBuilder]=useState(null); // {} = neu
  const [notFound,setNotFound]=useState(null);
  const [tick,setTick]=useState(0);                  // erzwingt Neuladen nach Aenderungen
  const refresh=()=>setTick(t=>t+1);

  const products=useMemo(()=>loadProducts(),[tick]);
  const meals=useMemo(()=>loadMeals(),[tick]);

  const applyFilters=list=>{
    let l=list.filter(x=>matchesQuery(x,query));
    if(catPick)l=l.filter(x=>x.category===catPick);
    if(quick==="fav")l=l.filter(x=>x.favorite);
    if(quick==="often")l=l.filter(x=>(x.useCount||0)>0).sort((a,b)=>(b.useCount||0)-(a.useCount||0));
    if(quick==="recent")l=l.filter(x=>x.lastUsed).sort((a,b)=>(b.lastUsed||0)-(a.lastUsed||0));
    else l=sortByRelevance(l,query); // Favoriten > Zuletzt > Häufig > exakt > ähnlich
    return l;
  };
  const foodHits=typeFilter==="meal"?[]:applyFilters(products).slice(0,40);
  const mealHits=typeFilter==="food"?[]:applyFilters(meals).slice(0,40);

  /* Duplikat-Pruefung: dasselbe Lebensmittel (per ID) ist in dieser Mahlzeit
     schon vorhanden -> statt eines zweiten Eintrags oeffnet sich die
     bestehende Menge zur Anpassung (kein doppelter Eintrag entsteht). */
  const openAmountFor=p=>{
    const existing=(existingItems||[]).find(it=>it.productId===p.id);
    setDupExisting(existing||null);
    setAmountFor(p);
  };
  const addProduct=(entry,isReplace)=>{
    const p=products.find(x=>x.id===entry.productId);
    const n=nutrientsFor(p,entry.amount,entry.unit);
    markProductUsed(p.id);
    onAdd({id:"i"+Date.now(),productId:p.id,name:p.name,amount:entry.amount,unit:entry.unit,
      kcal:n.kcal,carbs:n.carbs||0,protein:n.protein||0,fat:n.fat||0},isReplace?"replace":"add");
  };
  const addMeal=m=>{
    markMealUsed(m.id);
    tapH();
    /* Mengen werden bei bereits vorhandenen Lebensmitteln automatisch
       zusammengefuehrt (additiv), siehe addMealItem in App. */
    m.items.forEach((it,i)=>{
      const p=products.find(x=>x.id===it.productId);
      if(!p)return;
      const n=nutrientsFor(p,it.amount,it.unit);
      onAdd({id:"i"+Date.now()+"-"+i,productId:p.id,name:p.name,amount:it.amount,unit:it.unit,
        kcal:n.kcal,carbs:n.carbs||0,protein:n.protein||0,fat:n.fat||0},"add");
    });
  };

  if(amountFor)return(
    <AmountPage product={amountFor} initial={dupExisting}
      notice={dupExisting?"Dieses Lebensmittel wurde bereits hinzugefügt. Passe stattdessen die vorhandene Menge an.":null}
      confirmLabel={dupExisting?"Menge aktualisieren":"Hinzufügen"}
      onBack={()=>{setAmountFor(null);setDupExisting(null);}} onClose={onClose}
      onConfirm={entry=>{addProduct(entry,!!dupExisting);setDupExisting(null);}}/>
  );
  if(createFor)return(
    <CreateFoodFlow initial={{barcode:createFor.barcode||""}}
      onClose={()=>setCreateFor(null)}
      onSaved={p=>{setCreateFor(null);refresh();setNotFound(null);openAmountFor(p);}}/>
  );
  if(mealBuilder)return(
    <MealBuilderPage initial={mealBuilder.meal}
      onClose={()=>setMealBuilder(null)}
      onSaved={m=>{setMealBuilder(null);refresh();addMeal(m);}}/>
  );
  if(tab==="barcode")return(
    <BarcodeScanSheet onClose={()=>setTab("search")} onSkip={()=>setTab("search")}
      onDetected={code=>{
        const hit=findProductByBarcode(code);
        if(hit){setNotFound(null);setTab("search");openAmountFor(hit);}
        else{setNotFound(code);setTab("search");}
      }}/>
  );

  const TABS=[["search","Suche"],["barcode","Barcode"],["create","Hinzufügen"]];
  return(
    <React.Fragment>
      {showCatPicker&&(
        <Page onClose={()=>setShowCatPicker(false)} title="Kategorie">
          <button className="foodrow" onClick={()=>{setCatPick("");setShowCatPicker(false);}}
            style={{justifyContent:"center",color:"var(--accent)",fontWeight:600}}>Alle Kategorien</button>
          {FOOD_CATEGORIES.map(c=>(
            <button key={c.label} className="foodrow" onClick={()=>{setCatPick(c.label);setShowCatPicker(false);}}>
              <div style={{display:"flex",alignItems:"center",gap:12}}>
                <span style={{fontSize:20}}>{c.icon}</span><span style={{fontSize:14}}>{c.label}</span>
              </div>
            </button>
          ))}
        </Page>
      )}
      <Page onClose={onClose} title={mealLabel}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
          {TABS.map(([k,l])=>{
            const on=tab===k;
            return(
              <div key={k} className="dc" onClick={()=>{tapH();setTab(k);}}
                style={{aspectRatio:"1.15",borderRadius:16,background:on?"var(--accent-soft)":"var(--card)",
                  border:on?"1.5px solid var(--accent)":"1px solid transparent",boxShadow:on?"none":"var(--shadow)",
                  display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:7}}>
                {k==="search"&&<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke={on?"var(--accent)":"var(--ink)"} strokeWidth="2.2" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>}
                {k==="barcode"&&<div style={{display:"flex",alignItems:"center",gap:1.5,height:21}}>
                  {[3,1,2,1,3,1,2].map((w,i)=><div key={i} style={{width:w,height:19,background:on?"var(--accent)":"var(--ink)"}}/>)}
                </div>}
                {k==="create"&&<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke={on?"var(--accent)":"var(--ink)"} strokeWidth="2.2" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>}
                <span style={{fontSize:11,fontWeight:600,color:on?"var(--accent)":"var(--ink)"}}>{l}</span>
              </div>
            );
          })}
        </div>

        {/* Grosser, eigenstaendiger Primaer-Button — bewusst nicht wie ein
            normales Suchergebnis gestaltet, damit sofort klar ist: hier wird
            etwas Neues erstellt, kein bestehender Eintrag ausgewaehlt. */}
        <button onClick={()=>{tapH();setMealBuilder({});}}
          style={{width:"100%",display:"flex",alignItems:"center",gap:14,padding:"16px 18px",borderRadius:18,
            background:"linear-gradient(135deg,var(--accent),var(--accent))",border:"none",cursor:"pointer",marginBottom:16,
            boxShadow:"0 6px 16px rgba(0,0,0,.14)"}}>
          <div style={{width:44,height:44,borderRadius:99,background:"rgba(255,255,255,.22)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>🍱</div>
          <div style={{textAlign:"left"}}>
            <div style={{fontWeight:700,fontSize:15,color:"#fff"}}>Eigene Mahlzeit erstellen</div>
            <div style={{fontSize:12,color:"rgba(255,255,255,.85)"}}>Mehrere Lebensmittel kombinieren & speichern</div>
          </div>
        </button>

        {tab==="create"&&(
          <div>
            <button className="foodrow" style={{padding:"16px 14px"}} onClick={()=>{tapH();setCreateFor({});}}>
              <div style={{display:"flex",alignItems:"center",gap:14}}>
                <span style={{fontSize:22}}>✏️</span>
                <div>
                  <div style={{fontWeight:600,fontSize:15}}>Neues Lebensmittel ohne Barcode</div>
                  <div className="sub" style={{fontSize:12}}>Direkt eintragen, z.B. Selbstgekochtes</div>
                </div>
              </div>
            </button>
            <button className="foodrow" style={{padding:"16px 14px"}} onClick={()=>{tapH();setTab("barcode");}}>
              <div style={{display:"flex",alignItems:"center",gap:14}}>
                <span style={{fontSize:22}}>📷</span>
                <div>
                  <div style={{fontWeight:600,fontSize:15}}>Neues Lebensmittel mit Barcode</div>
                  <div className="sub" style={{fontSize:12}}>Barcode wird zuerst gescannt</div>
                </div>
              </div>
            </button>
          </div>
        )}

        {tab==="search"&&(
          <div>
            <input type="text" placeholder={mealPlaceholder} value={query} autoFocus
              onChange={e=>{setQuery(e.target.value);setNotFound(null);}} style={{marginBottom:12}}/>

            {notFound&&(
              <div style={{padding:14,borderRadius:16,background:"var(--amber-soft)",marginBottom:12}}>
                <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>Für diesen Barcode wurde kein Lebensmittel gefunden.</div>
                <button className="btn" style={{padding:"10px 14px",fontSize:13}}
                  onClick={()=>{setCreateFor({barcode:notFound});}}>Neues Lebensmittel mit Barcode hinzufügen</button>

            {/* Filter: erneutes Tippen auf den aktiven Filter deaktiviert ihn

            <Seg items={["Alle","Lebensmittel","Eigene Mahlzeiten"]}
              val={typeFilter==="all"?"Alle":typeFilter==="food"?"Lebensmittel":"Eigene Mahlzeiten"}

            <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:4,marginBottom:14}}>

            {foodHits.length===0&&mealHits.length===0&&(

            {mealHits.length>0&&<div className="lbl" style={{margin:"4px 0 8px"}}>Eigene Mahlzeiten</div>}

              return(

                  <div style={{fontWeight:600,fontSize:14}}>{p.name}</div>
                  <div className="sub" style={{fontSize:12}}>{[p.brand,portionLabel(p)].filter(Boolean).join(" · ")} · {displayKcal(p)} kcal</div>

                <div style={{display:"flex",gap:8,flexShrink:0,alignItems:"center"}}>
                  <button onClick={()=>{toggleProductFavorite(p.id);refresh();}} style={{width:26,height:26,borderRadius:8,background:"var(--card)",border:"none",color:p.favorite?"var(--amber)":"var(--ink3)",fontSize:13}}>★</button>
                  <button onClick={()=>openAmountFor(p)} style={{width:44,height:44,borderRadius:99,background:"var(--accent)",color:"#fff",border:"none",fontSize:24,fontWeight:700,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 12px rgba(0,0,0,.18)"}}>+</button>
                </div>
              </div>

          </div>
        )}
      </Page>

}

/* Monatseinstellungen: Gewicht, KFA, Aktivitaet -> BMR/TDEE-Vorschau.
   Ist der Monat noch nicht eingerichtet, werden die Felder mit den Werten
   des letzten eingerichteten Vormonats vorbelegt (Vorschlag, kein Automatik-
   Uebernehmen). Der Monat gilt erst nach dem Speichern als eingerichtet. */
function SetupSheet({y,m,mSet,onSave,onDelete,onClose}){
  const ex=mSet[y+"-"+m];
  /* Letzten eingerichteten Monat vor (y,m) suchen, max. 24 Monate zurueck */
  const prev=(()=>{
    let py=y,pm=m-1;
    for(let i=0;i<24;i++){
      if(pm<0){pm=11;py--;}
      const s=mSet[py+"-"+pm];
      if(s)return {...s,srcM:pm};
      pm--;
    }
    return null;
  })();
  const [f,setF]=useState(
    ex?{weight:ex.weight,fat:ex.fat,activityIdx:ex.activityIdx}
      :prev?{weight:prev.weight,fat:prev.fat,activityIdx:prev.activityIdx}
      :{weight:"",fat:"",activityIdx:1}
  );
  const bmr=calcBMR(parseFloat(f.weight)||0,parseFloat(f.fat)||0);
  const tdee=f.weight?Math.round(bmr*ACT[f.activityIdx].f):0;
  return(
    <Sheet onClose={onClose} title={"Grundbedarf · "+MN[m]+" "+y}>
      {!ex&&prev&&(
        <div className="sub" style={{marginTop:-10,marginBottom:14,padding:"10px 12px",borderRadius:12,background:"var(--accent-soft)",color:"var(--accent)"}}>
          Vorbelegt aus {MN[prev.srcM]} — bitte dein aktuelles Gewicht für {MN[m]} prüfen.
        </div>
      )}
      {[["Körpergewicht (kg)","weight","z.B. 85"],["Körperfettanteil (%)","fat","z.B. 22"]].map(([l,k,ph])=>(
        <div key={k} style={{marginBottom:10}}>
          <div className="lbl" style={{marginBottom:5}}>{l}</div>
          <input type="number" inputMode="decimal" placeholder={ph} value={f[k]} onChange={e=>setF(p=>({...p,[k]:e.target.value}))}/>
        </div>
      ))}
      <div className="lbl" style={{marginBottom:6}}>Aktivitätslevel</div>
      {ACT.map((a,i)=>(
        <button key={i} className={"optbtn"+(f.activityIdx===i?" on":"")} onClick={()=>setF(p=>({...p,activityIdx:i}))}>
          <b>{a.f}</b> · {a.l}
          <span className="sub" style={{display:"block"}}>{a.e}</span>
        </button>
      ))}
      {f.weight>0&&(
        <div className="row" style={{padding:14,borderRadius:16,background:"var(--accent-soft)",margin:"10px 0 12px"}}>
          <span className="sub">BMR {bmr} kcal ×{ACT[f.activityIdx].f}</span>
          <span className="num" style={{fontSize:19,fontWeight:700,color:"var(--accent)"}}>{tdee} kcal/Tag</span>
        </div>
      )}
      <div style={{display:"flex",gap:8,marginBottom:8}}>
        <button className="btn btn2" style={{flex:1}} onClick={onClose}>Abbrechen</button>
        <button className="btn" style={{flex:1}} onClick={()=>{if(f.weight){tapH();onSave(y,m,{weight:parseFloat(f.weight),fat:parseFloat(f.fat)||0,activityIdx:f.activityIdx});}}}>Speichern</button>
      </div>
      {ex&&<button className="btn btn-danger" onClick={()=>onDelete(y,m)}>Für diesen Monat löschen</button>}
    </Sheet>
  );
}

/* Ziel anlegen/bearbeiten */
function GoalSheet({goal,data,mSet,onSave,onDelete,onClose}){

    manualValue:goal.manualValue||"",active:goal.active!==false,
  }:{type:"weight",period:"total",target:"",startValue:startW?String(startW):"",
    deadline:"",label:"",sportType:"all",manualValue:"",active:true});

      <div className="lbl" style={{marginBottom:5}}>Zeitraum</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat("+periods.length+",1fr)",gap:5,marginBottom:12}}>
        {periods.map(p=><button key={p.key} className={"pill"+(f.period===p.key?" on":"")} style={{fontSize:11}} onClick={()=>setF(p2=>({...p2,period:p.key}))}>{p.label}</button>)}
      </div>
      {gt.kind==="level"&&(
        <div style={{marginBottom:12}}>
          <div className="lbl" style={{marginBottom:5}}>Startgewicht (kg)</div>

          <input type="date" value={f.deadline} onChange={e=>setF(p=>({...p,deadline:e.target.value}))}/>
        </div>
      )}
      <div className="row" style={{padding:"12px 14px",borderRadius:14,background:"var(--card2)",marginBottom:14}}>
        <span style={{fontSize:14,fontWeight:600}}>Aktiv</span>
        <button onClick={()=>setF(p=>({...p,active:!p.active}))}
          style={{width:48,height:28,borderRadius:99,border:"none",background:f.active?"var(--accent)":"var(--ink3)",position:"relative"}}>
          <span style={{position:"absolute",top:3,left:f.active?23:3,width:22,height:22,borderRadius:99,background:"#fff",transition:"left .2s"}}/>
        </button>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:8}}>
        <button className="btn btn2" style={{flex:1}} onClick={onClose}>Abbrechen</button>
        <button className="btn" style={{flex:1,opacity:f.target?1:.5}} onClick={()=>{if(f.target){tapH();onSave({id:goal?goal.id:"g"+Date.now(),...f});}}}>Speichern</button>
      </div>
      {goal&&<button className="btn btn-danger" onClick={()=>onDelete(goal.id)}>Ziel löschen</button>}
    </Sheet>
  );
}

/* ===== Reaktives "Heute" fuer zeitkritische Logik (Forecast, Kalibrierung) =====
   Die globale Konstante NOW (einmal beim Laden gesetzt) reicht fuer das
   meiste in der App (Kalenderansichten etc.) voellig aus und bleibt dort
   bewusst unangetastet. Fuer die Forecast-Engine ist ein eingefrorenes
   Datum aber ein echtes Problem: laeuft die App ueber einen Tages- oder
   sogar Monatswechsel hinweg (z.B. ein Tab, der ueber Nacht offen bleibt),
   wuerde die Prognose sonst dauerhaft mit dem alten Datum weiterrechnen.
   Setzt einen Timer exakt bis zur naechsten lokalen Mitternacht (nicht
   minuetlich!), aktualisiert dann einmal und setzt den naechsten Timer. */
function useCurrentDay(){
  const [now,setNow]=useState(()=>new Date());
  useEffect(()=>{
    let timer;
    const scheduleNext=()=>{
      const n=new Date();
      const nextMidnight=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,0,0,5); // 5s Puffer
      const ms=nextMidnight-n;
      timer=setTimeout(()=>{
        setNow(new Date());
        scheduleNext();
      },ms);
    };
    scheduleNext();
    return ()=>clearTimeout(timer);
  },[]);
  return now;
}

/* ===== APP: Zustand, Tabs, Sheets ===== */
function App(){
  /* Reaktives "Heute" fuer die Forecast-Engine — siehe useCurrentDay()
     oben. Die globale NOW-Konstante bleibt fuer alles andere unveraendert
     im Einsatz (Kalender, Standard-Navigationsmonat etc.), nur die
     zeitkritische Forecast-Logik nutzt ab hier currentDay. */
  const currentDay=useCurrentDay();
  const currentDayKey=dateToIso(currentDay);
  /* Theme: auto folgt dem System, sonst erzwungen via data-theme am <html> */
  const [theme,setTheme]=useState(()=>load("tracker_theme","auto"));
  useEffect(()=>{
    save("tracker_theme",theme);
    if(theme==="auto")delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme=theme;
  },[theme]);
  const [tab,setTab]=useState("heute");
  const [verlaufSeg,setVerlaufSeg]=useState(null); // von aussen vorgegebenes Startsegment fuer Verlauf
  /* Navigation von Dashboard-Widgets: wechselt den Tab und merkt optional
     vor, welches Verlauf-Unterthema direkt geoeffnet werden soll. */
  const navigateTo=(targetTab,seg)=>{
    if(seg)setVerlaufSeg(seg);
    setTab(targetTab);
  };
  /* Gleiche localStorage-Schlüssel wie vorher — alte Daten bleiben erhalten */
  const [data,setData]=useState(()=>load("tracker_data",{}));
  const [mSet,setMSet]=useState(()=>load("tracker_mset",{}));
  const [goals,setGoals]=useState(()=>load("tracker_goals",[]));
  useEffect(()=>{save("tracker_data",data);},[data]);
  useEffect(()=>{save("tracker_mset",mSet);},[mSet]);
  useEffect(()=>{save("tracker_goals",goals);},[goals]);
  /* Bestaetigungen auffaelliger Gewichtseintraege — dauerhaft gespeichert,
     damit ein einmal bestaetigter Wert nach einem Reload nicht wieder als
     unbestaetigt gilt. Jeder Datensatz speichert nur einfache Strings/
     Booleans (weightEntryId, confirmedByUser, confirmedAt als ISO-String,
     validationReason) — keine Date-Objekte, daher ist beim Laden aus
     localStorage keine Rueckumwandlung noetig. Muss VOR dem Kalibrierungs-
     Effekt stehen, da dieser sie jetzt mitnutzt. */
  const [weightConfirmations,setWeightConfirmations]=useState(()=>{
    const saved=load("tracker_weight_confirmations",null);
    return Array.isArray(saved)?saved:[];
  });
  useEffect(()=>{save("tracker_weight_confirmations",weightConfirmations);},[weightConfirmations]);

  /* Forecast-Engine: Kalibrierungsprofil als ECHTER React-State (nicht nur
     localStorage) — nur so sieht die sichtbare Live-Prognose eine beim
     App-Start nachgeholte Kalibrierung sofort, ohne dass ein Reload noetig
     waere. Laeuft bei jedem echten Tageswechsel UND zusaetzlich bei jeder
     fachlich relevanten Datenaenderung (Ernaehrung/Aktivitaet/Gewicht in
     "data", Monatseinstellungen "mSet", Bestaetigungen
     "weightConfirmations") — vorher lief das nur beim Tageswechsel, wodurch
     z.B. ein siebter gueltiger Ernaehrungstag am selben Tag keinen neuen
     Snapshot ausloeste. Bleibt trotzdem idempotent dank processedMonthIds
     bzw. hasSnapshotForToday() — ein zweiter Durchlauf am selben Tag mit
     unveraenderten Daten aendert nichts (siehe Test 21 der Engine).
     WICHTIG: calibProfile selbst steht bewusst NICHT in den Abhaengigkeiten
     — der Effekt setzt es selbst, eine Abhaengigkeit davon wuerde eine
     Endlosschleife erzeugen. */
  const [calibProfile,setCalibProfile]=useState(()=>load("tracker_forecast_calibration",null)||DEFAULT_CALIBRATION_PROFILE());
  useEffect(()=>{
    try{
      const {dailyData,monthlySettings,weightEntries}=buildEngineInputsFor(currentDay,data,mSet);
      let profile=runPendingMonthlyCalibrations(currentDay,dailyData,monthlySettings,weightEntries,weightConfirmations,calibProfile);
      profile=finalizePendingSnapshots(profile,currentDay,weightEntries,dailyData,monthlySettings,weightConfirmations);

      const forecast=calculateCurrentMonthForecast({now:currentDay,dailyData,monthlySettings,weightEntries,calibrationProfile:profile,weightConfirmations});
      if(forecast.status==="ok"&&!hasSnapshotForToday(profile,forecast.forecastDate,currentDay)){
        const snap=buildForecastSnapshot(forecast,currentDay);
        if(snap)profile=storeForecastSnapshot(profile,snap);
      }

      if(profile!==calibProfile){setCalibProfile(profile);save("tracker_forecast_calibration",profile);}
    }catch(e){ /* Kalibrierung/Snapshots duerfen im Fehlerfall niemals die App blockieren */ }
    // eslint-disable-next-line
  },[currentDayKey,data,mSet,weightConfirmations]);
  /* Welche Sheets offen sind */
  const [dayT,setDayT]=useState(null);       // {y,m,d}
  const [setupT,setSetupT]=useState(null);   // {y,m}
  const [goalT,setGoalT]=useState(undefined);// undefined=zu, null=neu, Objekt=bearbeiten
  const [activityT,setActivityT]=useState(null); // {y,m,d,editIndex} — editIndex null = neu
  const [mealT,setMealT]=useState(null);      // {y,m,d,mealKey}
  const [mealDetailT,setMealDetailT]=useState(null); // {y,m,d,mealKey}
  const openDay=(y,m,d)=>setDayT({y,m,d});
  const openSetup=(y,m)=>setSetupT({y,m});
  const openActivity=(y,m,d,editIndex)=>setActivityT({y,m,d,editIndex});
  const openMeal=(y,m,d,mealKey)=>setMealT({y,m,d,mealKey});
  const openMealDetail=(y,m,d,mealKey)=>setMealDetailT({y,m,d,mealKey});
  /* EINZIGE Stelle im ganzen Code, die das Gewicht eines Tages schreibt —
     genutzt sowohl vom Kalender (jedes beliebige Datum) als auch von
     "Gewicht heute". Ruehrt NUR das Gewichtsfeld an, alles andere
     (Mahlzeiten, Aktivitaeten, kcal) bleibt unangetastet. Legt den
     Tageseintrag bei Bedarf frisch an. weight=0 loescht den Wert wieder
     (ueberall im Code bedeutet weight>0 "vorhanden"). */
  /* Reines, UNVALIDIERTES Speichern — wird ab jetzt NIE mehr direkt von der
     UI aufgerufen, sondern ausschliesslich von attemptSaveWeight() weiter
     unten, nachdem die zentrale Engine-Validierung "valid" ergeben hat
     oder der Nutzer einen "suspicious"-Wert ausdruecklich bestaetigt hat. */
  const saveWeightForDateRaw=(y,m,d,weight)=>{
    const key=dk(y,m,d);
    setData(p=>{
      const cur=p[key]||{kcalIn:0,kcalBurned:0,sports:[],meals:{}};
      if(weight===0&&cur.weight>0){
        setWeightConfirmations(wc=>removeWeightConfirmation(wc,{date:new Date(y,m,d),weight:cur.weight,id:"weight_"+dateToIso(new Date(y,m,d))}));
      }
      return {...p,[key]:{...cur,weight,logged:true}};
    });
  };
  /* Zentrale, validierende Schnittstelle — JEDER Eingabepfad (Dashboard,
     Kalender, Gewichtsdetail) MUSS ab jetzt ausschliesslich hierueber
     speichern, nie mehr direkt saveWeightForDateRaw() aufrufen. Baut aus
     den bestehenden Gewichtseintraegen + dem neuen Kandidaten die
     Engine-Eingaben, laesst validateWeightEntry() (ueber
     classifyWeightEntries) entscheiden, und reagiert AUSSCHLIESSLICH auf
     das Ergebnis — keine eigene Schwellenwert-Logik hier.
       valid      -> sofort speichern, keine Bestaetigung noetig
       suspicious -> Bestaetigungs-Sheet oeffnen, NICHT speichern
       invalid    -> nicht speichern, Fehlermeldung zurueckgeben
     onCorrectFocus: optionaler Callback, den das Bestaetigungs-Sheet bei
     "Eingabe korrigieren" aufruft (z.B. um das Eingabefeld erneut zu
     fokussieren). */
  const attemptSaveWeight=(y,m,d,weight,onCorrectFocus)=>{
    /* weight=0 bedeutet "Gewicht für diesen Tag löschen" (siehe Button
       weiter unten) — das ist kein unplausibler Messwert, sondern eine
       bewusste Loeschung, und darf die Validierung nicht durchlaufen
       (sonst wuerde 0 als "invalid" abgelehnt und liesse sich nie mehr
       loeschen). */
    if(weight===0){
      saveWeightForDateRaw(y,m,d,0);
      return {status:"valid"};
    }
    const candidateId="weight_"+dateToIso(new Date(y,m,d));
    const {dailyData,monthlySettings,weightEntries}=buildEngineInputsFor(currentDay,data,mSet);
    const otherEntries=weightEntries.filter(e=>e.id!==candidateId);
    const candidateEntry={id:candidateId,date:new Date(y,m,d),weight,savedAt:0};
    const allEntries=[...otherEntries,candidateEntry];
    /* WICHTIG (Bearbeiten-Fall): eine fuer denselben Tag evtl. bereits
       gespeicherte alte Bestaetigung MUSS schon VOR der Validierung
       entfernt werden, nicht erst danach. isEntryConfirmed() prueft nur
       anhand der Entry-ID (die bei gleichem Tag gleich bleibt) — bliebe
       die alte Bestaetigung hier drin, wuerde ein komplett neuer,
       unplausibler Wert am selben Tag die alte Bestaetigung stillschweigend
       "erben" und ungeprueft als bestaetigt durchgehen, obwohl der Nutzer
       diesen NEUEN Wert nie bestaetigt hat. */
    const confirmationsForValidation=(weightConfirmations||[]).filter(c=>c.weightEntryId!==candidateId);
    const classified=classifyWeightEntries(allEntries,dailyData,monthlySettings,confirmationsForValidation,FORECAST_CONFIG,currentDay);
    const idx=classified.findIndex(e=>e.id===candidateId);
    const validation=classified[idx].validation;

    if(validation.status==="invalid"){
      if(validation.reasons&&validation.reasons[0]==="future_weight_date_not_allowed"){
        return {status:"invalid", message:"Gewicht kann nur für heute oder vergangene Tage eingetragen werden."};
      }
      return {status:"invalid",
        message:"Bitte gib ein gültiges Gewicht zwischen "+FORECAST_CONFIG.minimumWeightKg+" und "+FORECAST_CONFIG.maximumWeightKg+" kg ein."};
    }
    if(validation.status==="valid"){
      // Alte Bestaetigung fuer denselben Tag ist jetzt in jedem Fall
      // gegenstandslos (der Wert war entweder von Anfang an plausibel,
      // oder hier bereits oben aus der Validierungsbasis entfernt) —
      // endgueltig aus dem persistenten State entfernen, bevor gespeichert wird.
      setWeightConfirmations(wc=>removeWeightConfirmation(wc,candidateEntry));
      saveWeightForDateRaw(y,m,d,weight);
      return {status:"valid"};
    }
    // suspicious: NICHT speichern — vorherigen gueltigen Eintrag fuer den
    // Bestaetigungsdialog heraussuchen (der zeitlich letzte VOR dem
    // Kandidaten mit status="valid").
    let prevValid=null;
    for(let i=idx-1;i>=0;i--){
      if(classified[i].validation.status==="valid"){prevValid=classified[i];break;}
    }
    setPendingWeightConfirm({y,m,d,weight,candidateEntry,validation,prevValid,onCorrectFocus});
    return {status:"suspicious"};
  };
  const [pendingWeightConfirm,setPendingWeightConfirm]=useState(null);
  const [showPersonalize,setShowPersonalize]=useState(false);
  const [showWeightModal,setShowWeightModal]=useState(false);
  const [dashRefresh,setDashRefresh]=useState(0);
  /* Lebensmittel zu einer Mahlzeit hinzufuegen. Verhindert Duplikate: existiert
     in dieser Mahlzeit bereits ein Eintrag mit derselben Lebensmittel-ID,
     wird KEIN zweiter Eintrag angelegt, sondern zusammengefuehrt:
       mode="add"     -> Mengen/Naehrwerte werden addiert (z.B. beim
                          automatischen Hinzufuegen einer eigenen Mahlzeit)
       mode="replace" -> der Eintrag wird ersetzt (z.B. wenn der Nutzer die
                          Menge im Duplikat-Dialog bewusst neu eingegeben hat)
     Rechnet kcalIn/carbsIn/proteinIn/fatIn danach aus der Summe ALLER
     Mahlzeiten neu — ein evtl. vorher manuell eingetragener Gesamtwert wird
     dadurch durch die echte Summe ersetzt. */
  const addMealItem=(dt,mealKey,item,mode="add")=>{
    const key=dk(dt.y,dt.m,dt.d);
    setData(p=>{
      const cur=p[key]||{kcalIn:0,kcalBurned:0,weight:0,sports:[],meals:{},logged:true};
      const list=[...((cur.meals||{})[mealKey]||[])];
      const dupIdx=item.productId?list.findIndex(x=>x.productId===item.productId):-1;
      let nextList;
      if(dupIdx>-1){
        const ex=list[dupIdx];
        if(mode==="replace"){
          nextList=list.map((x,i)=>i===dupIdx?item:x);
        }else{
          const sameUnit=ex.unit===item.unit;
          nextList=list.map((x,i)=>i===dupIdx?{
            ...x,
            amount:sameUnit?x.amount+item.amount:item.amount,
            unit:item.unit,
            kcal:x.kcal+item.kcal,
            carbs:Math.round(((x.carbs||0)+(item.carbs||0))*10)/10,
            protein:Math.round(((x.protein||0)+(item.protein||0))*10)/10,
            fat:Math.round(((x.fat||0)+(item.fat||0))*10)/10,
          }:x);
        }
      }else{
        nextList=[...list,item];
      }
      const meals={...(cur.meals||{}),[mealKey]:nextList};
      const all=Object.values(meals).flat();
      const kcalIn=all.reduce((s,it)=>s+(it.kcal||0),0);
      const carbsIn=Math.round(all.reduce((s,it)=>s+(it.carbs||0),0)*10)/10;
      const proteinIn=Math.round(all.reduce((s,it)=>s+(it.protein||0),0)*10)/10;
      const fatIn=Math.round(all.reduce((s,it)=>s+(it.fat||0),0)*10)/10;
      return {...p,[key]:{...cur,meals,kcalIn,carbsIn,proteinIn,fatIn,logged:true}};
    });
    setMealT(null);
  };
  /* Einzelnen Eintrag aus einer Mahlzeit entfernen — rechnet kcalIn/Makros
     danach genauso aus der Summe aller verbleibenden Mahlzeiten neu. */
  const removeMealItem=(dt,mealKey,index)=>{
    const key=dk(dt.y,dt.m,dt.d);
    setData(p=>{
      const cur=p[key]||{};
      const meals={...(cur.meals||{})};
      meals[mealKey]=(meals[mealKey]||[]).filter((_,i)=>i!==index);
      const all=Object.values(meals).flat();
      const kcalIn=all.reduce((s,it)=>s+(it.kcal||0),0);
      const carbsIn=Math.round(all.reduce((s,it)=>s+(it.carbs||0),0)*10)/10;
      const proteinIn=Math.round(all.reduce((s,it)=>s+(it.protein||0),0)*10)/10;
      const fatIn=Math.round(all.reduce((s,it)=>s+(it.fat||0),0)*10)/10;
      return {...p,[key]:{...cur,meals,kcalIn,carbsIn,proteinIn,fatIn}};
    });
  };
  /* Aktivitaet speichern: aktualisiert das sports-Array UND gleicht das
     Tages-kcalBurned um die Differenz aus (statt es neu zu berechnen), damit
     ein evtl. manuell im Tages-Dialog eingetragener Wert nicht verloren geht. */
  const saveActivity=(dt,item,editIndex)=>{
    const key=dk(dt.y,dt.m,dt.d);
    setData(p=>{
      const cur=p[key]||{kcalIn:0,kcalBurned:0,weight:0,sports:[],logged:true};
      const sports=[...(cur.sports||[])];
      const oldKcal=editIndex!=null?(sports[editIndex].kcal||0):0;
      if(editIndex!=null)sports[editIndex]=item; else sports.push(item);
      const kcalBurned=Math.max(0,(cur.kcalBurned||0)-oldKcal+(item.kcal||0));
      return {...p,[key]:{...cur,sports,kcalBurned,logged:true}};
    });
    setActivityT(null);
  };
  const deleteActivity=(dt,editIndex)=>{
    const key=dk(dt.y,dt.m,dt.d);
    setData(p=>{
      const cur=p[key]||{};
      const sports=[...(cur.sports||[])];
      const removed=sports.splice(editIndex,1)[0];
      const kcalBurned=Math.max(0,(cur.kcalBurned||0)-((removed&&removed.kcal)||0));
      return {...p,[key]:{...cur,sports,kcalBurned}};
    });
    setActivityT(null);
  };
  return(
    <div className="app">
      {tab==="heute"&&<HeuteView data={data} mSet={mSet} goals={goals} dashRefresh={dashRefresh} openDay={openDay} openSetup={openSetup} openActivity={openActivity} openMeal={openMeal} openMealDetail={openMealDetail} openPersonalize={()=>setShowPersonalize(true)} onNavigate={navigateTo} onOpenWeightModal={()=>setShowWeightModal(true)}/>}
      {tab==="verlauf"&&<VerlaufView key={verlaufSeg||"default"} data={data} mSet={mSet} goals={goals} calibProfile={calibProfile} weightConfirmations={weightConfirmations} currentDay={currentDay} initialSeg={verlaufSeg} openDay={openDay} openSetup={openSetup}/>}
      {tab==="ziele"&&<ZieleView data={data} mSet={mSet} goals={goals} openGoal={g=>setGoalT(g)}/>}
      {tab==="profil"&&<ProfilView data={data} mSet={mSet} theme={theme} setTheme={setTheme} openSetup={openSetup} setData={setData} setMSet={setMSet} setGoals={setGoals}/>}
      <TabBar tab={tab} setTab={t=>{setVerlaufSeg(null);setTab(t);}}/>
      {dayT&&<DayDetailSheet key={dk(dayT.y,dayT.m,dayT.d)} date={dayT} data={data} mSet={mSet}
        onSaveWeight={attemptSaveWeight}
        onOpenMealDetail={(y,m,d,mealKey)=>{setDayT(null);openMealDetail(y,m,d,mealKey);}}
        onOpenActivity={(y,m,d,editIndex)=>{setDayT(null);openActivity(y,m,d,editIndex);}}
        onDeleteDay={dt=>{
          const key=dk(dt.y,dt.m,dt.d);
          const existing=data[key];
          if(existing&&existing.weight>0){
            setWeightConfirmations(wc=>removeWeightConfirmation(wc,{date:new Date(dt.y,dt.m,dt.d),weight:existing.weight}));
          }
          setData(p=>{const n={...p};delete n[key];return n;});
          setDayT(null);
        }}
        onClose={()=>setDayT(null)}/>}
      {activityT&&<ActivitySheet key={dk(activityT.y,activityT.m,activityT.d)+"-"+activityT.editIndex}
        date={activityT} data={data} editIndex={activityT.editIndex}
        onSave={saveActivity} onDelete={deleteActivity} onClose={()=>setActivityT(null)}/>}
      {mealT&&<FoodSearchSheet key={dk(mealT.y,mealT.m,mealT.d)+"-"+mealT.mealKey}
        mealLabel={MEALS.find(x=>x.key===mealT.mealKey).addTitle}
        mealPlaceholder={MEALS.find(x=>x.key===mealT.mealKey).ph}
        existingItems={(data[dk(mealT.y,mealT.m,mealT.d)]||{}).meals?.[mealT.mealKey]||[]}
        onAdd={(item,mode)=>addMealItem(mealT,mealT.mealKey,item,mode)} onClose={()=>setMealT(null)}/>}
      {mealDetailT&&<MealDetailSheet
        mealLabel={MEALS.find(x=>x.key===mealDetailT.mealKey).label}
        items={(data[dk(mealDetailT.y,mealDetailT.m,mealDetailT.d)]||{}).meals?.[mealDetailT.mealKey]||[]}
        onRemoveItem={i=>removeMealItem(mealDetailT,mealDetailT.mealKey,i)}
        onAddMore={()=>{setMealDetailT(null);openMeal(mealDetailT.y,mealDetailT.m,mealDetailT.d,mealDetailT.mealKey);}}
        onClose={()=>setMealDetailT(null)}/>}
      {setupT&&<SetupSheet key={setupT.y+"-"+setupT.m} y={setupT.y} m={setupT.m} mSet={mSet}
        onSave={(y,m,s)=>{setMSet(p=>({...p,[y+"-"+m]:s}));setSetupT(null);}}
        onDelete={(y,m)=>{setMSet(p=>{const n={...p};delete n[y+"-"+m];return n;});setSetupT(null);}}
        onClose={()=>setSetupT(null)}/>}
      {goalT!==undefined&&<GoalSheet key={goalT?goalT.id:"new"} goal={goalT} data={data} mSet={mSet}
        onSave={g=>{setGoals(gs=>goalT?gs.map(x=>x.id===g.id?g:x):[...gs,g]);setGoalT(undefined);}}
        onDelete={id=>{setGoals(gs=>gs.filter(x=>x.id!==id));setGoalT(undefined);}}
        onClose={()=>setGoalT(undefined)}/>}
      {showPersonalize&&<DashboardPersonalizeSheet onClose={()=>setShowPersonalize(false)} onSaved={()=>{setDashRefresh(v=>v+1);setShowPersonalize(false);}}/>}
      {showWeightModal&&<WeightModal data={data} onAttemptSave={(y,m,d,v)=>attemptSaveWeight(y,m,d,v)} onClose={()=>setShowWeightModal(false)}/>}
      {pendingWeightConfirm&&(
        <WeightConfirmSheet
          pending={pendingWeightConfirm}
          onConfirm={()=>{
            const {y,m,d,weight,candidateEntry,validation}=pendingWeightConfirm;
            tapH();
            setWeightConfirmations(wc=>recordWeightConfirmation(wc,candidateEntry,validation.reasons&&validation.reasons[0],currentDay));
            saveWeightForDateRaw(y,m,d,weight);
            setPendingWeightConfirm(null);
          }}
          onCorrect={()=>{
            const cb=pendingWeightConfirm.onCorrectFocus;
            setPendingWeightConfirm(null);
            if(cb)cb();
          }}
          onClose={()=>setPendingWeightConfirm(null)}
        />
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
